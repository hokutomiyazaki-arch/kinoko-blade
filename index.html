/* ---------- 胞子紋ゲージ（シグネチャ要素） ---------- */
function drawSporeGauge(g, cx, cy, r, pct, color, dimColor){
  g.save(); g.translate(cx,cy);
  const N=32;
  for(let i=0;i<N;i++){
    const a0 = -Math.PI/2 + i/N*Math.PI*2, a1 = a0 + (Math.PI*2/N)*0.66;
    const on = (i/N) < pct;
    g.strokeStyle = on? color : dimColor;
    g.lineWidth = on? 2.4 : 1.6;
    g.beginPath(); g.arc(0,0,r,a0,a1); g.stroke();
  }
  g.strokeStyle = pct>=1? color : dimColor; g.lineWidth=1;
  g.beginPath(); g.arc(0,0,r*0.42,0,7); g.stroke();
  if(pct>=1){ g.fillStyle=color; g.beginPath(); g.arc(0,0,r*0.22,0,7); g.fill(); }
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════
   FIGHTER
   ══════════════════════════════════════════════════════════════════ */
class Fighter{
  constructor(spec, x, dir, isPlayer){
    this.s = spec; this.x = x; this.dir = dir; this.isPlayer = isPlayer;
    this.hp = spec.hp; this.maxHp = spec.hp;
    this.atk = 0; this.grd = 0; this.sht = 0; // 0..1 ゲージ（攻・防・飛）
    this.state = "walk"; this.t = 0;         // 状態内経過秒
    this.hitDone = false; this.shotDone = false;
    this.poison = 0; this.poisonDps = 0;
    this.flash = 0; this.swing = 0; this.hurtLim = RULES.hurtTime;
    this.stunLim = RULES.parryStun;
    this.dmgScale = 1;                 // 敵のレベルで与ダメージが変わる
    this.team = isPlayer? 0 : 1;       // 0=こちら 1=敵。味方同士は当たらない
    this.big = false;                  // ボスは巨体
    this.box = {halfW:RULES.hitHalfW, top:RULES.hitTop, bot:RULES.hitBot};
    this.hitList = null;               // 巨体の攻撃は範囲内の全員に当たる
    this.special = null;               // 使用中のスペシャル武器
    this.wasReady = {atk:false, grd:false, sht:false};   // 満タンになった瞬間だけ鳴らす
  }
  get busy(){ return this.state!=="walk"; }
  get dead(){ return this.hp<=0; }
  get ready(){ return {a:this.atk>=1, g:this.grd>=1, s:this.sht>=1}; }

  tryAttack(){ if(this.state!=="walk"||this.atk<1) return false;
    this.atk=0; this.state="windup"; this.t=0; this.hitDone=false; SFX.swing(); return true; }
  // 背中を向けていたら防げない。剣は前にしか出ないので、防御も前だけ
  canGuard(){ const o = nearestFoe(this); return !o || this.facing(o); }
  tryGuard(){ if(this.state!=="walk"||this.grd<1) return false;
    if(!this.canGuard()) return false;
    this.grd=0; this.state="guard"; this.t=0; SFX.guard(); return true; }
  tryShot(){ if(this.state!=="walk"||this.sht<1) return false;
    this.sht=0; this.state="cast"; this.t=0; this.shotDone=false; return true; }
  // スペシャルはゲージを使わない。使い切りなので所持数が代わりの制約
  trySpecial(w){ if(this.state!=="walk"||!w) return false;
    this.special = w; this.t = 0; this.hitDone = false; this.shotDone = false;
    this.state = (w.kind==="melee") ? "spWind" : "spCast";
    SFX.special(w.id); return true; }

  update(dt, foe){
    this.t += dt; this.flash = Math.max(0, this.flash-dt*4);
    if(this.poison>0){ this.poison-=dt; this.hp = Math.max(0, this.hp - this.poisonDps*dt); }

    const S=this.s;
    if(this.state==="walk"){
      // ゲージは「歩いている間だけ」溜まる → 行動には常に機会費用がある
      this.atk = Math.min(1, this.atk + dt/S.atkGauge);
      this.grd = Math.min(1, this.grd + dt/S.guardGauge);
      this.sht = Math.min(1, this.sht + dt/S.shot.gauge);
      this.x += this.dir * S.speed * dt;
      if(this.x <= RULES.wallL){ this.x = RULES.wallL; this.dir = 1; }
      if(this.x >= RULES.wallR){ this.x = RULES.wallR; this.dir = -1; }
      this.swing = 0;
    }
    else if(this.state==="windup"){ this.swing = -(this.t/S.windup)*0.55;
      if(this.t>=S.windup){ this.state="active"; this.t=0; this.hitList = this.big? new Set() : null; } }
    else if(this.state==="active"){ this.swing = 0.35 + (this.t/S.active)*0.65;
      if(this.t>=S.active){ this.state="recover"; this.t=0; } }
    else if(this.state==="recover"){ this.swing = 1.0 - (this.t/S.recover);
      if(this.t>=S.recover){ this.state="walk"; this.t=0; } }
    else if(this.state==="cast"){ this.swing = -0.35 - (this.t/S.shot.windup)*0.25;
      if(this.t>=S.shot.windup){                 // 撃つ
        if(!this.shotDone){ this.shotDone=true;
          const n = S.shot.n || 1;
          for(let i=0;i<n;i++){
            const sh = new Shot(this);
            if(n>1) sh.vx = this.dir * S.shot.speed * (0.55 + i*0.42);   // 前後にばら撒く
            shots.push(sh);
          }
          SFX.shot(S.shot.kind); }
        this.state="castRec"; this.t=0; } }
    else if(this.state==="castRec"){ this.swing = -0.6 + (this.t/S.shot.recover)*0.6;
      if(this.t>=S.shot.recover){ this.state="walk"; this.t=0; } }
    // スペシャル：大振り（melee）
    else if(this.state==="spWind"){ const w=this.special;
      this.swing = -(this.t/w.windup)*0.8;
      if(this.t>=w.windup){ this.state="spActive"; this.t=0; } }
    else if(this.state==="spActive"){ const w=this.special;
      this.swing = 0.4 + (this.t/w.active)*0.8;
      if(this.t>=w.active){ this.state="spRec"; this.t=0; } }
    // スペシャル：弾・落雷（cast）
    else if(this.state==="spCast"){ const w=this.special;
      this.swing = -0.45 - (this.t/w.windup)*0.3;
      if(this.t>=w.windup){
        if(!this.shotDone){ this.shotDone=true; fireSpecial(this, w); }
        this.state="spRec"; this.t=0; } }
    else if(this.state==="spRec"){ const w=this.special;
      this.swing = (this.swing||0)*0.86;
      if(this.t>=w.recover){ this.state="walk"; this.t=0; this.special=null; } }
    else if(this.state==="guard"){ this.swing = -0.15;
      if(this.t>=S.guardTime){ this.state="walk"; this.t=0; } }
    else if(this.state==="stun"||this.state==="hurt"){
      this.swing *= 0.9;
      const lim = this.state==="stun"? this.stunLim : this.hurtLim;
      if(this.t>=lim){ this.state="walk"; this.t=0; } }
  }
  facing(foe){ return Math.sign(foe.x - this.x) === this.dir; }
  takeHit(dmg){ this.hp = Math.max(0, this.hp - dmg); this.flash = 1; }
  hurt(dur){ this.state="hurt"; this.t=0; this.hurtLim=dur; }
  stun(dur){ this.state="stun"; this.t=0; this.stunLim=dur; this.special=null; }
}

/* ══════════════════════════════════════════════════════════════════
   飛び道具
   ------------------------------------------------------------------
   移動が自動なので弾は「避ける」ことができない。答えは防御だけ。
   通常ガードなら削りが通り、ジャスト防御なら完全に消える。
   ══════════════════════════════════════════════════════════════════ */
let shots = [];
class Shot{
  constructor(owner, spec){
    const S = spec || owner.s.shot;
    this.s = S; this.owner = owner; this.dir = owner.dir;
    this.x = owner.x + owner.dir*24;
    this.dy = RULES.muzzleY;            // 床からの高さ（上が負）。画面比が変わっても効く
    this.vx = owner.dir * S.speed;
    this.vy = S.kind==="lob" ? -S.up : 0;
    this.t = 0; this.dead = false;
  }
  update(dt){
    this.t += dt;
    if(this.s.kind==="lob"){ this.vy += RULES.gravity*dt; this.dy += this.vy*dt; }
    else if(this.s.kind==="wave"){ this.dy = RULES.muzzleY + Math.sin(this.t*this.s.freq)*this.s.amp; }
    else if(this.s.kind==="mist"){ this.vx *= Math.pow(0.30, dt); this.dy -= 5*dt; }
    this.x += this.vx*dt;
    if(this.t >= this.s.life) this.dead = true;
    if(this.x < RULES.wallL-16 || this.x > RULES.wallR+16) this.dead = true;
    if(this.dy > -3) this.dead = true;   // 山なり弾は地面で消える
  }
  hits(f){
    if(f===this.owner || f.team===this.owner.team || f.dead) return false;
    return Math.abs(this.x - f.x) < f.box.halfW + this.s.r*0.5
        && this.dy > f.box.top && this.dy < f.box.bot;
  }
}

/* ---------- スペシャルの発動処理 ---------- */
let bolts = [];      // 落雷の演出（見た目だけ。判定は発動時に済んでいる）
function fireSpecial(f, w){
  if(w.kind==="burst"){
    // 扇状に5発。上下にばらけるので全部ガードするのは難しい
    for(let i=0;i<w.n;i++){
      const sh = new Shot(f, w.shot);
      sh.dy = RULES.muzzleY - 16 + i*8;
      sh.vx = f.dir * (w.shot.speed * (0.82 + i*0.09));
      shots.push(sh);
    }
  } else if(w.kind==="single"){
    shots.push(new Shot(f, w.shot));
  } else if(w.kind==="strike"){
    // 距離に関係なく相手の真上から落ちる。ガードには完全に消される
    const foe = nearestFoe(f);
    if(!foe) return;
    bolts.push({x:foe.x, t:0});
    if(foe.state==="guard"){ foe.grd = Math.min(1, foe.grd + RULES.shotParryRefund); SFX.block();
      say(`${w.name}をガード！ 完全に防いだ`); }
    else { foe.takeHit(w.dmg * f.dmgScale); foe.hurt(RULES.hurtTime); SFX.thunder();
      say(`${w.name} 直撃 ${Math.round(w.dmg*f.dmgScale)}`); }
  }
}

/* ══════════════════════════════════════════════════════════════════
   GAME
   ══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cv = $("stage"), g = cv.getContext("2d");
let P, C, timeLeft, running=false, last=0, logT=0, cpuTimer=0, cpuIntent=null;
let party = [], foes = [], bossFight = false, actIdx = 0;
let stage = STAGES[0];
let pick = 0, cpuPick = 1, lastSec = 0, selSlot = 0, resultShown = false;
let cpuProf = cpuProfile(SAVE.level);

function nearestFoe(f){
  const list = (f.team===0) ? foes : party;
  let best=null, bd=1e9;
  for(const o of list){ if(o.dead) continue;
    const d=Math.abs(o.x-f.x); if(d<bd){ bd=d; best=o; } }
  return best;
}
const alive = arr => arr.filter(f=>!f.dead);

function begin(){
  const lv = SAVE.level;
  bossFight = isBossLevel(lv);
  stage = stageFor(lv);
  cpuProf = cpuProfile(lv);
  shots = []; bolts = []; sparks = []; selSlot = 0; resultShown = false; actIdx = 0;
  party = []; foes = [];

  if(bossFight){
    const n = partySize(lv);                       // 2〜3体で挑む
    for(let i=0;i<n;i++){
      const sp = SPECIES[(pick+i) % SPECIES.length];
      const m = new Fighter(sp, RULES.wallL + 56 + i*52, 1, true);
      party.push(m);
    }
    const B = bossFor(lv);
    const b = new Fighter(B, RULES.wallR - 110, -1, false);
    b.big = true; b.box = BOSS_BOX;
    b.dmgScale = cpuProf.dmg;
    b.maxHp = Math.round(B.hp * cpuProf.hp); b.hp = b.maxHp;
    foes.push(b);
  } else {
    party.push(new Fighter(SPECIES[pick], RULES.wallL+80, 1, true));
    const c = new Fighter(SPECIES[cpuPick], RULES.wallR-80, -1, false);
    c.dmgScale = cpuProf.dmg;
    c.maxHp = Math.round(c.maxHp * cpuProf.hp); c.hp = c.maxHp;
    foes.push(c);
  }
  P = party[0]; C = foes[0];

  timeLeft = RULES.roundTime; running = true; logT=0; cpuTimer=0; cpuIntent=null;
  buildPanels();
  $("nmL").innerHTML = bossFight
    ? `${party.length}体<em>YOU</em>` : P.s.name + '<em>YOU</em>';
  $("nmR").innerHTML = `<em>Lv.${lv}${bossFight?" BOSS":""}</em>` + C.s.name;
  renderBag();
  show("scFight"); fitStage();
  say(bossFight? `${stage.name} ／ ${C.s.name} 出現` : `${stage.name} ／ 交錯を待て`);
  lastSec = RULES.roundTime; BGM.setMode(bossFight? "boss" : "fight"); BGM.start();
  last = performance.now(); requestAnimationFrame(loop);
}

function loop(now){
  if(!running) return;
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  step(dt); render(); requestAnimationFrame(loop);
}

function step(dt){
  timeLeft -= dt;
  logT = Math.max(0, logT-dt);
  aiThink(dt);

  for(const f of party) if(!f.dead) f.update(dt, nearestFoe(f));
  for(const f of foes)  if(!f.dead) f.update(dt, nearestFoe(f));

  // ゲージが満タンになった瞬間だけ合図を鳴らす（3本を音の高さで区別）
  for(const m of party){
    if(m.dead) continue;
    ["atk","grd","sht"].forEach(k=>{
      const full = m[k]>=1;
      if(full && !m.wasReady[k]) SFX.ready(k);
      m.wasReady[k] = full;
    });
  }
  // 残り5秒の秒読み。BGMも締めに入る
  const sec = Math.ceil(timeLeft);
  if(sec!==lastSec){ if(sec<=5 && sec>0) SFX.tick(); lastSec = sec; }
  if(timeLeft<=15 && !BGM.tense) BGM.setMode("tense");   // 曲はそのまま速くなる

  // ── 衝突：敵とだけ弾き合う（味方同士はすり抜ける。詰まると何もできなくなるため）
  for(const m of party){ if(m.dead) continue;
    for(const o of foes){ if(o.dead) continue;
      const gap = o.big ? RULES.bodyGap + CHAR_W*0.5 : RULES.bodyGap;
      if(Math.abs(m.x-o.x) < gap){
        const sgn = Math.sign(m.x-o.x) || 1;
        if(m.state==="walk") m.dir = sgn;
        if(o.state==="walk") o.dir = -sgn;
        m.x = clampX(m.x + sgn*1.6);
        if(!o.big) o.x = clampX(o.x - sgn*1.6);   // ボスは押し返されない
      }
    }
  }

  // ── 判定：味方→敵、敵→味方（巨体の一撃は範囲内の全員に当たる）
  for(const m of party){ if(m.dead) continue;
    for(const o of foes) if(!o.dead) resolve(m, o); }
  for(const o of foes){ if(o.dead) continue;
    for(const m of party) if(!m.dead) resolve(o, m); }
  stepShots(dt);

  // ── 決着：こちらが全滅 or 敵が全滅 or 時間切れ
  if(alive(party).length===0 || alive(foes).length===0 || timeLeft<=0) finish();
}

/* ---------- 飛び道具の進行と当たり ---------- */
function stepShots(dt){
  for(const sh of shots){
    sh.update(dt);
    if(sh.dead) continue;
    for(const f of party.concat(foes)){ if(sh.hits(f)){ hitByShot(sh, f); break; } }
  }
  // 弾同士の相殺（撃ち合いに意味を持たせる）
  for(let i=0;i<shots.length;i++) for(let j=i+1;j<shots.length;j++){
    const a=shots[i], b=shots[j];
    if(a.dead||b.dead||a.owner===b.owner) continue;
    if(Math.abs(a.x-b.x) < a.s.r+b.s.r && Math.abs(a.dy-b.dy) < a.s.r+b.s.r){
      a.dead=b.dead=true; SFX.cancel(); say("弾が相殺");
    }
  }
  shots = shots.filter(s=>!s.dead);
  for(const b of bolts) b.t += dt;
  bolts = bolts.filter(b=>b.t < 0.35);
  for(const sp of sparks) sp.t += dt;
  sparks = sparks.filter(sp=>sp.t < 0.22);
}

function hitByShot(sh, f){
  sh.dead = true;
  const S = sh.s;
  if(f.state==="guard"){
    // 受け切ると防御ゲージが一部戻る＝弾の連射だけでは防御を枯らせない
    if(f.t <= f.s.parryWindow){
      f.flash=.6; f.grd = Math.min(1, f.grd + RULES.shotParryRefund);
      SFX.parry(); say(`ジャスト防御！ ${S.name}を消した`); return; }
    const chip = Math.min(S.dmg*RULES.blockChip, RULES.chipCap);
    f.takeHit(chip); f.grd = Math.min(1, f.grd + RULES.shotBlockRefund);
    SFX.block(); say(`${S.name}をガード ${chip.toFixed(1)} 削り`);
    return;
  }
  const dmg = S.dmg * sh.owner.dmgScale;
  f.takeHit(dmg); SFX.hit(dmg);
  f.x = clampX(f.x + Math.sign(sh.vx||sh.dir)*RULES.shotKnock);
  if(S.bind){ f.stun(S.bind); say(`${S.name} 命中！ ${S.bind}秒 動きを止めた`); }
  else f.hurt(RULES.shotHurt);
  if(S.poison){ f.poison = S.poison.dur; f.poisonDps = S.poison.dps;
    if(!S.bind) say(`${S.name} 命中 ${Math.round(dmg)} + 毒`); }
  else if(!S.bind) say(`${S.name} 命中 ${Math.round(dmg)}`);
}

function resolve(a, b){
  // 通常の斬りとスペシャルの大振りは、間合とダメージが違うだけで扱いは同じ
  const sp = (a.state==="spActive") ? a.special : null;
  if(a.state!=="active" && !sp) return;
  if(a.big){                       // 巨体の薙ぎは範囲内の全員をまとめて薙ぐ
    if(!a.hitList) a.hitList = new Set();
    if(a.hitList.has(b)) return;
  } else if(a.hitDone) return;
  const reach = sp ? sp.reach : a.s.reach;
  const dmg   = (sp ? sp.dmg : a.s.dmg) * a.dmgScale;
  const label = sp ? sp.name : a.s.skill;

  const dist = Math.abs(a.x-b.x);
  if(dist > reach || !a.facing(b)) return;
  if(a.big) a.hitList.add(b); else a.hitDone = true;
  const kb = Math.sign(b.x-a.x)*RULES.knockback;

  if(b.state==="guard"){
    if(b.t <= b.s.parryWindow){                     // ジャスト防御
      a.stun(RULES.parryStun); a.swing=0;
      SFX.parry();
      if(b.s.reflect){ a.takeHit(b.s.reflect); say(`${b.s.name} 舞い返し！ ${b.s.reflect}反射`); }
      else if(b.s.parryRefund){ b.atk = 1; say(`${b.s.name} 香気斬り！ 攻撃ゲージ全快`); }
      else say(`ジャスト防御！ ${a.s.name} 硬直`);
      b.flash = .6;
    } else {                                        // 通常ガード（削りは通る）
      // スペシャルは削りが重い（大傘断ちは半分通る）
      const chip = sp ? Math.min(dmg*sp.chip, 14)
                      : Math.min(dmg*RULES.blockChip, RULES.chipCap);
      b.takeHit(chip); b.x = clampX(b.x+kb*0.5); SFX.block();
      say(`${label}をガード ${chip.toFixed(1)} 削り`);
    }
    return;
  }
  b.takeHit(dmg); b.hurt(RULES.hurtTime); b.x = clampX(b.x+kb*(sp?1.6:1)); SFX.hit(dmg);
  sparks.push({x:(a.x+b.x)/2, y:RULES.floorY-36, t:0, seed:Math.random()*6});
  if(!sp && a.s.poison){ b.poison = a.s.poison.dur; b.poisonDps = a.s.poison.dps;
    say(`${label} 命中 ${Math.round(dmg)} + 猛毒`); }
  else say(`${label} 命中 ${Math.round(dmg)}`);
}
const clampX = x => Math.max(RULES.wallL, Math.min(RULES.wallR, x));
function say(t){ $("log").textContent = t; logT = 1.6; }

/* ---------- CPU ---------- */
function aiThink(dt){
  cpuTimer -= dt;
  if(cpuTimer>0) return;
  cpuTimer = cpuProf.react*(0.7+Math.random()*0.6);
  for(const f of foes){ if(f.dead || f.state!=="walk") continue;
    f.big ? bossThink(f) : cpuThink(f); }
}

/* 通常のCPU：これまでどおり */
function cpuThink(C){
  const P = nearestFoe(C); if(!P) return;
  const dist = Math.abs(P.x-C.x);
  const closing = C.facing(P);

  // 飛んでくる弾は防御でしか止められない（背中を向けていたら防げない）
  if(C.grd>=1 && C.canGuard()){
    let best = null;
    for(const sh of shots){
      if(sh.owner.team===C.team) continue;
      if(Math.sign(sh.vx || sh.dir) !== Math.sign(C.x - sh.x)) continue;
      const tta = (Math.abs(sh.x-C.x) - C.box.halfW) / Math.max(40, Math.abs(sh.vx));
      if(tta>=0 && (best===null || tta<best)) best = tta;
    }
    if(best!==null && best < Math.min(0.34, C.s.guardTime*0.55) && Math.random()<cpuProf.pGuard){
      C.tryGuard(); return; }
  }
  // 相手の振りかぶりを見てから防御
  if(P.state==="windup" && C.grd>=1 && dist < P.s.reach+60 && C.canGuard()){
    const remain = P.s.windup - P.t;
    if(remain < C.s.parryWindow*0.9 + 0.06 && Math.random() < cpuProf.guard){ C.tryGuard(); return; }
  }
  // 飛び道具は間合いの外から。山なり弾だけは近距離で頭上を越えるので撃たない
  if(C.sht>=1 && closing){
    const k = C.s.shot.kind;
    const ok = k==="lob" ? (dist>150 && dist<300) : dist > C.s.reach*0.95;
    const keepMelee = C.atk>=1 && dist < C.s.reach*1.7;   // 斬れる間合いなら撃たない
    if(ok && !keepMelee && Math.random()<cpuProf.shot){ C.tryShot(); return; }
  }
  // 間合いに入る時刻を予測して振る
  if(C.atk>=1 && closing){
    const rel = P.state==="walk" && !P.facing(C) ? C.s.speed - P.s.speed : C.s.speed + P.s.speed;
    const tta = (dist - C.s.reach*0.82) / Math.max(20, rel);
    if(tta <= C.s.windup + 0.05 && tta > -0.10) C.tryAttack();
  }
}

/* ボス：防御しない。薙ぎ払いと胞子の雨だけを撃ち分ける。
   振りかぶりが長いので、こちらは「見てから防御」が間に合う。 */
function bossThink(B){
  const t = nearestFoe(B); if(!t) return;
  const dist = Math.abs(t.x - B.x);
  const closing = B.facing(t);
  // 近ければ薙ぎ払い（範囲内の味方はまとめて巻き込む）
  if(B.atk>=1 && closing && dist < B.s.reach*1.15){ B.tryAttack(); return; }
  // 遠ければ雨。山なりなので近距離では撃たない
  if(B.sht>=1 && closing && dist > B.s.reach*0.9){ B.tryShot(); return; }
}

/* ---------- 画面いっぱいに合わせる ---------- */
/* 横幅（＝壁の間隔）は 480 で固定。バランスに直結するので画面で変えない。
   代わりに高さだけ画面比に合わせて伸ばし、余白を作らず全面を使う。 */
const view = {scale:1, ox:0, oy:0, bleed:0};
function fitStage(){
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const cssW = Math.max(240, box.width), cssH = Math.max(120, box.height);
  // ボスは縦3キャラ分（231）ある。頭が切れないよう最低の高さを上げる
  const minH = bossFight ? CHAR_H*3 + 70 : 180;
  RULES.arenaH = Math.max(minH, Math.min(460, Math.round(RULES.arenaW*cssH/cssW)));
  RULES.floorY = RULES.arenaH - 38;
  cv.style.width = cssW+"px"; cv.style.height = cssH+"px";
  cv.width  = Math.round(cssW*dpr);
  cv.height = Math.round(cssH*dpr);
  // 横だけで合わせると縦がはみ出すことがあるので、両方に収まる倍率を採る
  view.scale = Math.min(cv.width/RULES.arenaW, cv.height/RULES.arenaH);
  // 横に余ったぶんは黒帯にせず、背景と地面を左右へ延ばして画面の端まで使う。
  // 壁（＝戦える範囲）は 44〜516 のままなので、勝負のバランスは変わらない。
  // ボス戦は縦3キャラ分の高さが要るぶん倍率が下がり、横向きの iPad ではここが効く。
  view.bleed = Math.max(0, (cv.width/view.scale - RULES.arenaW)/2);
  view.ox = (cv.width  - RULES.arenaW*view.scale)/2;
  view.oy = (cv.height - RULES.arenaH*view.scale)/2;
}
addEventListener("resize", ()=>{ if(!$("scFight").classList.contains("hide")){ fitStage(); if(P) render(); } });

/* ---------- 描画 ---------- */
function render(){
  const W=RULES.arenaW, H=RULES.arenaH, F=RULES.floorY;
  // 背景と地面だけは闘技場の外へも延ばす（X0 から幅 WW ぶん）
  const B=view.bleed, X0=-B, WW=W+B*2;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle="#211E29"; g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);
  const sky = g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0, stage.sky[0]); sky.addColorStop(1, stage.sky[1]);
  g.fillStyle = sky; g.fillRect(X0,0,WW,H);

  // 胞子紋の同心円は情景の下に薄く敷く（署名要素は残しつつ情景を主役にする）
  g.save(); g.globalAlpha=.13; g.strokeStyle=stage.ring; g.lineWidth=1;
  const rMax = Math.max(300, H*1.4, WW*0.75);
  for(let r=30;r<rMax;r+=24){ g.beginPath(); g.arc(W/2,F,r,Math.PI,0); g.stroke(); }
  g.restore();

  // 情景（森・街・洞窟・湖畔・神社・雪原）
  g.save(); g.translate(X0,0); scenery(g, stage, WW, H, F); g.restore();

  // 漂う胞子（面ごとに色が違う）
  g.save(); g.fillStyle=stage.mote; g.globalAlpha=.22;
  const now = performance.now()/1000;
  for(let i=0;i<14;i++){
    const sx = X0 + ((i*97 + now*(6+i%5)*2) % (WW+40)) - 20;
    const sy = F - ((i*53 + now*(9+(i%4)*4)) % (H*0.9)) - 10;
    g.beginPath(); g.arc(sx, sy, 1.4+(i%3)*0.7, 0, 7); g.fill();
  }
  g.restore();

  // 床
  g.strokeStyle=stage.floor; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(X0,F+.5); g.lineTo(X0+WW,F+.5); g.stroke();
  g.fillStyle=stage.ground; g.fillRect(X0,F+1,WW,H-F);
  // 闘技場の外は少し落として、戦える範囲がどこまでか目で分かるようにする
  if(B>0){ g.save(); g.globalAlpha=.30; g.fillStyle="#0F0D14";
    g.fillRect(X0,0,B,H); g.fillRect(W,0,B,H); g.restore(); }
  // 壁の目盛
  g.strokeStyle=stage.ring;
  [RULES.wallL,RULES.wallR].forEach(x=>{ g.beginPath(); g.moveTo(x,F-74); g.lineTo(x,F); g.stroke(); });

  // 間合いリング（プレイヤーが振れる距離）
  const lead = party[actIdx] || party[0];
  if(lead && !lead.dead && lead.ready.a && lead.state==="walk"){ const P = lead;
    g.save(); g.globalAlpha=.22; g.strokeStyle="#B06A3B"; g.setLineDash([3,5]); g.lineWidth=1;
    g.beginPath(); g.moveTo(P.x+P.dir*P.s.reach, F-58); g.lineTo(P.x+P.dir*P.s.reach, F); g.stroke();
    g.restore();
  }

  foes.concat(party).forEach(f=>{
    if(f.flash>0){ g.save(); g.globalAlpha=Math.min(.40,f.flash*.5);
      g.fillStyle="#D08A92"; g.beginPath();
      g.arc(f.x, F+(f.big? -CHAR_H*1.4 : -34), f.big? 80 : 30, 0, 7); g.fill(); g.restore(); }
    if(f.state==="guard"){
      const just = f.t<=f.s.parryWindow;
      g.save(); g.strokeStyle= just? "#EDE4CC":"#7C8F4E";
      g.lineWidth= just?2.5:1.5; g.globalAlpha= just?.95:.6;
      g.beginPath(); g.arc(f.x, F-30, 32, f.dir>0? -1.4:1.75, f.dir>0? 1.4:4.55); g.stroke(); g.restore();
    }
    if(f.state==="stun"){ g.fillStyle="#D08A92"; g.font="600 13px "+getComputedStyle(document.body).fontFamily;
      g.textAlign="center"; g.fillText("★", f.x, F-(f.big? CHAR_H*3+10 : 78)); }
    if(f.poison>0){ g.save(); g.globalAlpha=.5; g.fillStyle="#7C8F4E";
      for(let i=0;i<3;i++){ const p=(performance.now()/700+i/3)%1;
        g.beginPath(); g.arc(f.x-8+i*8, F-16-p*54, 2.2, 0, 7); g.fill(); } g.restore(); }

    if(f.big){ drawBoss(g, f, f.x, F); }
    else drawMushroom(g, f.s, f.x, F, 1, f.dir, {
      swing:f.swing, ko:f.dead,
      shout:f.state==="windup"||f.state==="active"||f.state==="hurt"||f.state==="cast",
    });

    // 溜め中の胞子玉
    if(f.state==="cast"){
      const p = Math.min(1, f.t/f.s.shot.windup);
      g.save(); g.globalAlpha=.4+p*.6; g.fillStyle=f.s.art.body;
      g.beginPath(); g.arc(f.x+f.dir*(f.big?60:26), F+(f.big? -CHAR_H*1.9 : RULES.muzzleY),
                           2+p*f.s.shot.r*(f.big?2:1), 0, 7); g.fill();
      g.restore();
    }
    // スペシャルの溜め（武器色の輪が締まる）
    if(f.state==="spCast" || f.state==="spWind"){
      const w=f.special, p=Math.min(1, f.t/w.windup);
      g.save(); g.globalAlpha=.25+p*.6; g.strokeStyle=w.color; g.lineWidth=2;
      g.beginPath(); g.arc(f.x, F-34, 46-p*24, 0, 7); g.stroke(); g.restore();
    }
    // 大傘断ちの薙ぎ
    if(f.state==="spActive" && f.special && f.special.kind==="melee"){
      const w=f.special, p=f.t/w.active;
      g.save(); g.globalAlpha=.7*(1-p); g.strokeStyle=w.color; g.lineWidth=9; g.lineCap="round";
      g.beginPath(); g.arc(f.x, F-34, w.reach*0.55, f.dir>0? -1.5+p*1.9 : 1.6-p*1.9,
                                                      f.dir>0? -0.9+p*1.9 : 2.2-p*1.9); g.stroke();
      g.restore();
    }
    // ボスの薙ぎ払い
    if(f.big && f.state==="active"){
      const p = f.t/f.s.active;
      g.save(); g.globalAlpha=.6*(1-p); g.strokeStyle=f.s.art.weapon; g.lineWidth=14; g.lineCap="round";
      g.beginPath(); g.arc(f.x, F-CHAR_H, f.s.reach*0.8, f.dir>0? -1.4+p*1.8 : 1.7-p*1.8,
                                                          f.dir>0? -0.7+p*1.8 : 2.4-p*1.8); g.stroke();
      g.restore();
    }
  });

  party.concat(foes).forEach(f=>{ if(!f.dead) drawSlash(g, f, F); });
  drawSparks(g, F);
  shots.forEach(sh=>drawShot(g, sh));
  bolts.forEach(b=>{                       // 落雷菌：上から落ちる柱
    const p = b.t/0.35;
    g.save(); g.globalAlpha = Math.max(0, 1-p); g.strokeStyle="#BCA9EC"; g.lineWidth=7-p*5;
    g.beginPath(); g.moveTo(b.x, 0); g.lineTo(b.x+6, F*0.45); g.lineTo(b.x-4, F*0.7); g.lineTo(b.x, F-8);
    g.stroke();
    g.globalAlpha = Math.max(0,.5-p*.5); g.fillStyle="#EDE4CC";
    g.beginPath(); g.arc(b.x, F-20, 26*(1-p)+6, 0, 7); g.fill(); g.restore();
  });

  // ラベル
  g.font="500 9px ui-monospace,monospace"; g.textAlign="center";
  party.forEach((m,i)=>{
    if(m.dead) return;
    if(bossFight){
      // パネルと同じ色の輪を足元に置く。操作中の1体は輪を濃くして矢印を出す
      const col = m.s.accent, act = (i===actIdx);
      g.save();
      g.globalAlpha = act? .95 : .45;
      g.strokeStyle = col; g.lineWidth = act? 3 : 1.6;
      g.beginPath(); g.ellipse(m.x, F+3, act? 26 : 21, act? 8 : 6.5, 0, 0, 7); g.stroke();
      if(act){
        const bob = Math.sin(performance.now()/220)*3;
        g.fillStyle = col;
        g.beginPath();
        g.moveTo(m.x, F-CHAR_H-14+bob); g.lineTo(m.x-8, F-CHAR_H-26+bob); g.lineTo(m.x+8, F-CHAR_H-26+bob);
        g.closePath(); g.fill();
      }
      g.restore();
      g.fillStyle = col; g.font = (act?"700 11px ":"500 10px ")+"ui-monospace,monospace";
      g.fillText(String(i+1), m.x, RULES.floorY+16);
    } else {
      g.fillStyle = "#6E6880";
      g.fillText("YOU", m.x, RULES.floorY+15);
    }
  });

  // HUD
  const pHp = party.reduce((a,m)=>a+m.hp,0), pMax = party.reduce((a,m)=>a+m.maxHp,0);
  $("hpL").style.width = (pHp/pMax*100)+"%";
  $("hpR").style.width = (C.hp/C.maxHp*100)+"%";
  $("clock").textContent = Math.max(0,Math.ceil(timeLeft));
  $("clock").classList.toggle("low", timeLeft<=15);
  if(logT<=0) $("log").innerHTML="&nbsp;";

  if(bossFight) paintPanels();
  else {
    paintPad("padA", P.atk, "#B06A3B");
    paintPad("padG", P.grd, "#7C8F4E");
    paintPad("padS", P.sht, "#C6A24A");
  }
}

/* ---------- 斬撃の軌跡：刃が通った跡を残す（当たっている実感のため） ---------- */
function drawSlash(g, f, F){
  if(f.state!=="active" || f.big) return;
  const p = Math.min(1, f.t/f.s.active);
  const hx = f.x + f.dir*HAND_X*K, hy = F - 38*K;
  const r  = (f.s.bladeLen + 6) * K;
  const ang = -1.05 + f.swing*1.9;
  const a   = f.dir>0 ? ang : Math.PI - ang;      // 左向きは鏡像
  const back = f.dir>0 ? -0.75 : 0.75;
  g.save(); g.lineCap="round";
  g.globalAlpha = 0.45*(1-p); g.strokeStyle = f.s.art.weapon; g.lineWidth = 9;
  g.beginPath(); g.arc(hx, hy, r, a+back, a, f.dir<0); g.stroke();
  g.globalAlpha = 0.85*(1-p); g.strokeStyle = "#FFF9E8"; g.lineWidth = 2.6;
  g.beginPath(); g.arc(hx, hy, r*0.99, a+back*0.7, a, f.dir<0); g.stroke();
  g.restore();
}
/* 命中の火花 */
let sparks = [];
function drawSparks(g, F){
  for(const sp of sparks){
    const p = sp.t/0.22;
    g.save(); g.globalAlpha = Math.max(0,1-p);
    g.strokeStyle="#FFF9E8"; g.lineWidth=2.4; g.lineCap="round";
    for(let i=0;i<6;i++){
      const a = i/6*Math.PI*2 + sp.seed;
      const r0 = 6+p*14, r1 = 16+p*26;
      g.beginPath();
      g.moveTo(sp.x+Math.cos(a)*r0, sp.y+Math.sin(a)*r0);
      g.lineTo(sp.x+Math.cos(a)*r1, sp.y+Math.sin(a)*r1);
      g.stroke();
    }
    g.restore();
  }
}

/* ---------- 弾の描画：種ごとに軌道が違うので見た目も変える ---------- */
function drawShot(g, sh){
  const S=sh.s, col=sh.owner.s.art.body, k=S.kind;
  g.save(); g.translate(sh.x, RULES.floorY + sh.dy);
  if(k==="mist"){                       // ふくらむ毒の雲
    const p = sh.t/S.life;
    g.globalAlpha=.30*(1-p*0.5); g.fillStyle="#7C8F4E";
    for(let i=0;i<4;i++){ const a=i*1.9+sh.t*1.2;
      g.beginPath(); g.arc(Math.cos(a)*S.r*.5, Math.sin(a)*S.r*.4, S.r*(.7+p*.5), 0, 7); g.fill(); }
    g.globalAlpha=.85; g.fillStyle=col;
    g.beginPath(); g.arc(0,0,S.r*.42,0,7); g.fill();
  } else {
    // 尾（速いものほど長い）
    g.globalAlpha=.32; g.strokeStyle=col; g.lineWidth=S.r*0.9; g.lineCap="round";
    g.beginPath(); g.moveTo(0,0); g.lineTo(-sh.dir*S.speed*0.035, 0); g.stroke();
    g.globalAlpha=1;
    g.fillStyle=col; g.beginPath();
    if(k==="dart"){ g.ellipse(0,0,S.r*1.7,S.r*0.62,0,0,7); }
    else { g.arc(0,0,S.r,0,7); }
    g.fill();
    g.strokeStyle=ART.line; g.lineWidth=1.6; g.stroke();
    // 胞子紋のヒダ
    g.strokeStyle="rgba(30,27,36,.45)"; g.lineWidth=1;
    for(let i=0;i<5;i++){ const a=i/5*Math.PI*2 + sh.t*4;
      g.beginPath(); g.moveTo(Math.cos(a)*S.r*.3, Math.sin(a)*S.r*.3);
      g.lineTo(Math.cos(a)*S.r*.85, Math.sin(a)*S.r*.85); g.stroke(); }
  }
  g.restore();
}
/* ---------- ボス戦：味方ごとの操作パネル ----------
   1体につき 攻/防/飛/特 の4つ。番号キー(1〜3)で操作対象を切り替えられる。 */
function buildPanels(){
  const box = $("panels");
  box.classList.toggle("hide", !bossFight);
  $("pads").classList.toggle("hide", bossFight);
  box.innerHTML = "";
  if(!bossFight) return;
  party.forEach((m,i)=>{
    const el = document.createElement("div");
    el.className = "panel";
    el.style.setProperty("--pc", m.s.accent);      // 帯・枠・ボタンすべてこの色になる
    el.innerHTML = `
      <div class="phead">
        <span class="n">${i+1}</span>
        <span class="nm2">${m.s.name}</span>
        <span class="now">操作中</span>
        <span class="hp2"><b></b></span>
      </div>
      <div class="prow">
        <button class="mini a" type="button">攻<i></i></button>
        <button class="mini g" type="button">防<i></i></button>
        <button class="mini s" type="button">飛<i></i></button>
        <button class="mini w" type="button">特</button>
      </div>`;
    const [ba,bg,bs,bw] = el.querySelectorAll("button");
    const use = fn => e=>{ e.preventDefault(); actIdx=i; fn(m); paintPanels(); };
    ba.addEventListener("pointerdown", use(attack));
    bg.addEventListener("pointerdown", use(guard));
    bs.addEventListener("pointerdown", use(shot));
    bw.addEventListener("pointerdown", use(special));
    box.appendChild(el);
  });
}
function paintPanels(){
  const els = $("panels").children;
  party.forEach((m,i)=>{
    const el = els[i]; if(!el) return;
    el.classList.toggle("act", i===actIdx);
    el.classList.toggle("ko", m.dead);
    el.querySelector(".hp2 b").style.width = (m.hp/m.maxHp*100)+"%";
    const [ba,bg,bs,bw] = el.querySelectorAll("button");
    const set = (b,v)=>{ b.querySelector("i").style.width = Math.min(1,v)*100+"%";
                         b.classList.toggle("ready", v>=1); b.disabled = m.dead; };
    set(ba, m.atk); set(bg, m.grd); set(bs, m.sht);
    bw.disabled = m.dead || !currentWeapon();
  });
}

/* ---------- 手持ちと特殊ボタン ---------- */
function renderBag(){
  const el = $("bag"); el.innerHTML = "";
  for(let i=0;i<BAG_MAX;i++){
    const w = wep(SAVE.bag[i]);
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = w? w.mark : "・";
    b.className = (w? "has ":"") + (i===selSlot && w? "sel":"");
    b.style.setProperty("--w", w? w.color : "var(--dim)");
    b.title = w? `${w.name} — ${w.desc}` : "空き";
    b.disabled = !w;
    b.onclick = ()=>{ selSlot = i; renderBag(); };
    el.appendChild(b);
  }
  const w = wep(SAVE.bag[selSlot]) || wep(SAVE.bag.find(x=>x));
  $("wmark").textContent = w? w.mark : "―";
  $("wmark").style.setProperty("--w", w? w.color : "var(--dim)");
  $("padW").disabled = !w;
  $("padW").title = w? `${w.name} — ${w.desc}` : "スペシャル武器なし（勝利のガチャで手に入る）";
}
function currentWeapon(){
  if(wep(SAVE.bag[selSlot])) return {w:wep(SAVE.bag[selSlot]), i:selSlot};
  const i = SAVE.bag.findIndex(x=>wep(x));
  return i>=0 ? {w:wep(SAVE.bag[i]), i} : null;
}

function paintPad(id, pct, col){
  const el=$(id), c=el.querySelector("canvas"), x=c.getContext("2d");
  x.clearRect(0,0,84,84); drawSporeGauge(x,42,42,30,pct,col,"#3A3547");
  el.classList.toggle("ready", pct>=1);
}

/* ---------- 決着 ---------- */
function finish(){
  if(!running) return;
  running=false;
  // 撃沈の姿勢を1フレーム描いてから結果へ（時間切れは待たせない）
  const ko = alive(party).length===0 || alive(foes).length===0;
  BGM.setMode("menu");
  if(ko) SFX.ko();
  render();
  setTimeout(showResult, ko? 1100 : 260);
}
function showResult(){
  if(resultShown) return;      // レベルとガチャは1試合につき1回だけ
  resultShown = true;
  const pHp = party.reduce((a,m)=>a+m.hp,0), pMax = party.reduce((a,m)=>a+m.maxHp,0);
  const cHp = foes.reduce((a,f)=>a+f.hp,0),  cMax = foes.reduce((a,f)=>a+f.maxHp,0);
  const pr = pHp/pMax, cr = cHp/cMax;
  const win = cHp<=0 && pHp>0 ? 1 : pHp<=0 && cHp>0 ? -1 : (pr>cr?1:pr<cr?-1:0);
  $("resultText").textContent = win>0? "勝　利" : win<0? "敗　北" : "引　分";
  $("resultText").style.color = win>0? "var(--cream)" : win<0? "var(--pink)" : "var(--dim)";
  if(win>0) SFX.win(); else if(win<0) SFX.lose();

  let sub = (bossFight
      ? `味方${party.length}体 ${Math.round(pHp)}/${pMax}  ―  ${C.s.name} ${Math.round(cHp)}/${cMax}`
      : `${P.s.name} ${Math.round(pHp)}/${pMax}  ―  Lv.${SAVE.level} ${C.s.name} ${Math.round(cHp)}/${cMax}`)
    + (timeLeft<=0 ? "  (時間切れ判定)" : "");
  if(win>0){                       // 勝ったら敵が1つ強くなる＋ガチャ
    SAVE.level = Math.min(99, SAVE.level+1); SAVE.save();
    sub += `  →  次は Lv.${SAVE.level}`;
    gachaReady();
  } else {
    $("gachaBox").classList.add("hide");
  }
  $("resultSub").textContent = sub;
  show("scEnd");
}

/* ---------- ガチャポン ----------
   ハンドルを回す → カプセルが落ちる → 弾んで止まる → 割れて中身が出る。
   canvas に手描きしている（画像を持たない方針は音と同じ）。 */
const G_CRANK = 0.95, G_DROP = 1.55, G_SETTLE = 2.05, G_OPEN = 2.45;
let gAnim = null;

function gachaReady(){
  const box = $("gachaBox");
  box.classList.remove("hide");
  $("gname").textContent = SAVE.bag.length>=BAG_MAX ? "手持ちが満杯（5個）" : "\u00a0";
  $("gdesc").textContent = SAVE.bag.length>=BAG_MAX
    ? "1つ使ってから回すと受け取れる。回すこと自体はできる。" : "ハンドルを回す";
  $("gachaBtn").disabled = false;
  $("gachaBtn").textContent = "ガチャを回す";
  gAnim = null;
  drawGachapon({t:0, res:null});
}

function spinGacha(){
  if(gAnim) return;
  const res = rollGacha();
  $("gachaBtn").disabled = true;
  $("gname").textContent = "\u00a0"; $("gdesc").textContent = "\u00a0";
  gAnim = {t:0, res, last:performance.now(), tick:0, dropped:false, landed:false, opened:false};
  const frame = (now)=>{
    if(!gAnim) return;
    const dt = Math.min(0.05, (now-gAnim.last)/1000); gAnim.last = now;
    gAnim.t += dt;
    if(gAnim.t < G_CRANK){                       // ハンドルのカチカチ
      gAnim.tick -= dt; if(gAnim.tick<=0){ gAnim.tick = 0.10; SFX.gachaTick(); }
    }
    if(!gAnim.dropped && gAnim.t >= G_CRANK){ gAnim.dropped = true; SFX.gachaDrop(); }
    if(!gAnim.landed  && gAnim.t >= G_DROP ){ gAnim.landed  = true; SFX.gachaLand(); }
    if(!gAnim.opened  && gAnim.t >= G_OPEN ){ gAnim.opened  = true; giveGacha(res); }
    drawGachapon(gAnim);
    if(gAnim.t < G_OPEN + 1.0) requestAnimationFrame(frame);
    else gAnim = null;                            // 最後の絵は残したまま止める
  };
  requestAnimationFrame(frame);
}

function giveGacha(res){
  if(!res){
    $("gname").textContent = "はずれ";
    $("gdesc").textContent = "また勝てば引ける。";
    SFX.gachaMiss();
  } else if(SAVE.bag.length >= BAG_MAX){
    $("gname").textContent = `${res.name} … 手持ちが満杯で受け取れない`;
    $("gdesc").textContent = "5個持てる上限。1つ使ってから勝つと入る。";
    SFX.gachaMiss();
  } else {
    SAVE.bag.push(res.id); SAVE.save();
    $("gname").textContent = `${res.name}（${res.role}）を獲得！`;
    $("gdesc").textContent = res.desc;
    SFX.gachaHit();
  }
  $("gachaBtn").textContent = "もう一度回すには勝つこと";
  renderBag(); renderStatus();
}

/* 筐体のなかのカプセル（位置は固定。回している間だけ揺れる） */
const G_BALLS = [[-34,-18],[-12,-30],[10,-26],[30,-10],[-28,6],[-6,-6],[16,4],[34,14],
                 [-18,20],[4,18],[24,26],[-36,-2],[0,-42],[18,-40]];
function drawGachapon(a){
  const cv2 = $("gcv"); if(!cv2) return;
  const x = cv2.getContext("2d");
  x.setTransform(2,0,0,2,0,0);                    // 論理 220×260
  x.clearRect(0,0,220,260);
  const t = a.t, res = a.res;
  const col = res ? res.color : "#6E6880";

  // ---- 台と筐体 ----
  x.fillStyle="#211E29"; x.beginPath(); x.roundRect(32,118,156,104,12); x.fill();
  x.strokeStyle="#4A4456"; x.lineWidth=2; x.stroke();
  x.fillStyle="#332E40"; x.beginPath(); x.roundRect(48,126,124,24,6); x.fill();
  x.fillStyle="#EDE4CC"; x.font="700 13px "+getComputedStyle(document.body).fontFamily;
  x.textAlign="center"; x.fillText("決 闘 団", 110, 143);

  // ---- ドーム（ガラス）----
  x.save();
  x.beginPath(); x.arc(110,120,58,Math.PI*0.98,Math.PI*2.02); x.closePath();
  x.fillStyle="rgba(237,228,204,.07)"; x.fill();
  x.clip();
  const shake = t < G_CRANK ? Math.sin(t*38)*3 : 0;
  G_BALLS.forEach(([bx,by],i)=>{
    const w = WEAPONS[i % WEAPONS.length];
    x.beginPath();
    x.arc(110+bx+shake*((i%3)-1), 100+by*0.7+Math.abs(shake)*((i%2)?0.5:-0.5), 10, 0, 7);
    x.fillStyle = w.color; x.globalAlpha=.85; x.fill(); x.globalAlpha=1;
    x.strokeStyle="rgba(30,27,36,.5)"; x.lineWidth=1.5; x.stroke();
  });
  x.restore();
  x.beginPath(); x.arc(110,120,58,Math.PI*0.98,Math.PI*2.02);
  x.strokeStyle="#6E6880"; x.lineWidth=3; x.stroke();
  x.save();                                       // ガラスの照り
  x.globalAlpha=.16; x.strokeStyle="#FFF"; x.lineWidth=7; x.lineCap="round";
  x.beginPath(); x.arc(110,120,46,Math.PI*1.15,Math.PI*1.45); x.stroke(); x.restore();

  // ---- ハンドル ----
  const turns = Math.min(1, t/G_CRANK);
  const ang = turns*Math.PI*4;                    // 2回転
  x.save(); x.translate(156,188);
  x.beginPath(); x.arc(0,0,15,0,7); x.fillStyle="#4A4456"; x.fill();
  x.strokeStyle="#EDE4CC"; x.lineWidth=2; x.stroke();
  x.rotate(ang);
  x.beginPath(); x.roundRect(-3,-13,6,26,3); x.fillStyle="#EDE4CC"; x.fill();
  x.beginPath(); x.arc(0,-13,4.5,0,7); x.fillStyle="#C6A24A"; x.fill();
  x.restore();

  // ---- 取り出し口 ----
  x.fillStyle="#14121A"; x.beginPath(); x.roundRect(62,176,58,30,6); x.fill();
  x.strokeStyle="#4A4456"; x.lineWidth=2; x.stroke();
  const flap = (t>G_CRANK && t<G_DROP) ? 0.9 : 0;   // 落ちる間だけフタが開く
  x.save(); x.translate(62,176); x.rotate(-flap);
  x.fillStyle="#332E40"; x.beginPath(); x.roundRect(0,0,58,8,3); x.fill(); x.restore();

  // ---- カプセル ----
  let cx=91, cy=191, open=0, show=false;
  if(t >= G_CRANK){
    show = true;
    if(t < G_DROP){                                // 落下
      const p=(t-G_CRANK)/(G_DROP-G_CRANK);
      cy = 191 + p*p*45; cx = 91 + p*5;
    } else if(t < G_SETTLE){                       // 弾む
      const p=(t-G_DROP)/(G_SETTLE-G_DROP);
      cy = 236 - Math.abs(Math.sin(p*Math.PI*2))*18*(1-p); cx = 96 + p*4;
    } else {
      cy = 236; cx = 100;
      open = Math.min(1, (t-G_OPEN)/0.34);
      if(open<0) open = 0;
    }
  }
  if(show){
    const R=17;
    x.save(); x.translate(cx,cy);
    if(open<=0){
      x.beginPath(); x.arc(0,0,R,Math.PI,0); x.fillStyle=col; x.fill();
      x.strokeStyle="#1E1B24"; x.lineWidth=2; x.stroke();
      x.beginPath(); x.arc(0,0,R,0,Math.PI); x.fillStyle="#F8EDCB"; x.fill(); x.stroke();
      x.beginPath(); x.moveTo(-R,0); x.lineTo(R,0); x.strokeStyle="#1E1B24"; x.stroke();
    } else {
      // 割れる：上下が離れて中身が出る
      const d = open*26;
      x.save(); x.translate(-d*0.5,-d); x.rotate(-open*0.5);
      x.beginPath(); x.arc(0,0,R,Math.PI,0); x.fillStyle=col; x.fill();
      x.strokeStyle="#1E1B24"; x.lineWidth=2; x.stroke(); x.restore();
      x.save(); x.translate(d*0.5,d*0.6); x.rotate(open*0.5);
      x.beginPath(); x.arc(0,0,R,0,Math.PI); x.fillStyle="#F8EDCB"; x.fill();
      x.strokeStyle="#1E1B24"; x.lineWidth=2; x.stroke(); x.restore();
      // 光
      x.save(); x.globalAlpha=Math.max(0,0.8-open*0.8);
      x.strokeStyle="#FFF9E8"; x.lineWidth=2.5; x.lineCap="round";
      for(let i=0;i<8;i++){ const A=i/8*Math.PI*2;
        x.beginPath(); x.moveTo(Math.cos(A)*(10+open*10), Math.sin(A)*(10+open*10));
        x.lineTo(Math.cos(A)*(20+open*26), Math.sin(A)*(20+open*26)); x.stroke(); }
      x.restore();
      // 中身
      const sc = Math.min(1, open*1.4);
      x.save(); x.translate(0,-6); x.scale(sc,sc);
      if(res){
        x.font="700 30px "+getComputedStyle(document.body).fontFamily;
        x.textAlign="center"; x.textBaseline="middle";
        x.fillStyle=res.color; x.fillText(res.mark, 0, 0);
      } else {
        x.strokeStyle="#6E6880"; x.lineWidth=3.5; x.lineCap="round";
        x.beginPath(); x.moveTo(-9,-9); x.lineTo(9,9); x.moveTo(9,-9); x.lineTo(-9,9); x.stroke();
      }
      x.restore();
    }
    x.restore();
  }
}

/* ---------- 選択画面の状態表示 ---------- */
function renderStatus(){
  const slots = Array.from({length:BAG_MAX}, (_,i)=>{
    const w = wep(SAVE.bag[i]);
    return w? `<span class="slot" style="color:${w.color}" title="${w.name}">${w.mark}</span>`
            : `<span class="slot">・</span>`;
  }).join("");
  const bossNext = isBossLevel(SAVE.level);
  $("status").innerHTML =
    `敵のレベル <b>${SAVE.level}</b>　勝つと上がる` +
    `<span style="margin-left:6px">舞台 ${stageFor(SAVE.level).name}</span>` +
    (bossNext ? `<span style="color:var(--pink)">▲ ボス戦（味方${partySize(SAVE.level)}体）</span>` : "") +
    `<span style="margin-left:6px">スペシャル ${slots} ${SAVE.bag.length}/${BAG_MAX}</span>` +
    `<button class="reset" id="resetBtn">記録を消す</button>`;
  $("resetBtn").onclick = ()=>{
    if(confirm("敵のレベルと手持ちの武器を消して、Lv.1 から始め直しますか？")){
      SAVE.reset(); selSlot=0; cpuProf = cpuProfile(SAVE.level); renderStatus(); renderBag();
    }
  };
}

/* ══════════════════════════════════════════════════════════════════
   SELECT UI
   ══════════════════════════════════════════════════════════════════ */
function buildRoster(){
  const max = {speed:165, hp:132, dmg:23};
  // ゲージは「短いほど満タン表示」。3本並べて型が一目で分かるようにする
  const gaugeBar = (label, v, lo, hi) =>
    bar(label, 1-(v-lo)/(hi-lo), v.toFixed(1)+"s");
  $("roster").innerHTML = "";
  SPECIES.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="card"; el.tabIndex=0; el.setAttribute("role","option");
    el.setAttribute("aria-selected", i===pick);
    el.style.setProperty("--accent", s.accent);
    el.innerHTML = `
      <canvas width="128" height="128"></canvas>
      <div>
        <div class="nm">${s.name}<span class="rl">${s.role}</span></div>
        <div class="sk">技: ${s.skill} — ${s.note}</div>
        <div class="sk">飛: ${s.shot.name}（${s.shot.dmg}） — ${s.shot.note}</div>
        <div class="bars">
          ${bar("速度", s.speed/max.speed)}
          ${bar("体力", s.hp/max.hp)}
          ${bar("攻撃", s.dmg/max.dmg)}
          ${gaugeBar("攻ゲージ", s.atkGauge, 1.1, 3.2)}
          ${gaugeBar("防ゲージ", s.guardGauge, 0.9, 2.0)}
          ${gaugeBar("飛ゲージ", s.shot.gauge, 2.2, 3.3)}
        </div>
      </div>`;
    const cx = el.querySelector("canvas").getContext("2d");
    cx.scale(2,2); drawMushroom(cx, s, 29, 60, 0.75, 1, {swing:0.15});
    el.onclick = ()=>{ pick=i; refreshSel(); };
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick=i; refreshSel(); } };
    $("roster").appendChild(el);
  });
}
const bar = (label, v, txt) =>
  `<div class="bar">${txt?label+" "+txt:label}<i style="--w:${Math.max(6,Math.min(100,v*100))}%"></i></div>`;
function refreshSel(){
  [...$("roster").children].forEach((el,i)=> el.setAttribute("aria-selected", i===pick));
}
function show(id){ ["scSelect","scFight","scEnd"].forEach(s=> $(s).classList.toggle("hide", s!==id)); }

/* ---------- 入力 ----------
   通常戦は P（1体）、ボス戦は操作中の1体に対して働く。 */
function actor(){ const m = party[actIdx]; return (m && !m.dead) ? m : alive(party)[0]; }

function attack(m){ m = m || actor(); if(!running || !m) return;
  if(!m.tryAttack() && m.state==="walk") say("ゲージ不足"); }
function guard(m){ m = m || actor(); if(!running || !m) return;
  if(m.state==="walk" && !m.canGuard()){ say(`${m.s.name} 背を向けている 防げない`); return; }
  if(!m.tryGuard() && m.state==="walk") say("ゲージ不足"); }
function shot(m){ m = m || actor(); if(!running || !m) return;
  if(!m.tryShot() && m.state==="walk") say("ゲージ不足"); }
function special(m){
  m = m || actor(); if(!running || !m) return;
  const cur = currentWeapon();
  if(!cur){ say("スペシャル武器がない"); return; }
  if(m.state!=="walk") return;
  if(m.trySpecial(cur.w)){
    SAVE.bag.splice(cur.i,1); SAVE.save();          // 1回使うと消える
    selSlot = Math.min(selSlot, Math.max(0, SAVE.bag.length-1));
    renderBag(); say(`${m.s.name} ${cur.w.name}！`);
  }
}

["pointerdown"].forEach(ev=>{
  $("padA").addEventListener(ev, e=>{ e.preventDefault(); attack(); });
  $("padG").addEventListener(ev, e=>{ e.preventDefault(); guard(); });
  $("padS").addEventListener(ev, e=>{ e.preventDefault(); shot(); });
  $("padW").addEventListener(ev, e=>{ e.preventDefault(); special(); });
});
addEventListener("keydown", e=>{
  if(e.repeat) return;
  if(e.key>="1" && e.key<="3"){ const i=+e.key-1;
    if(party[i]){ e.preventDefault(); actIdx=i; if(bossFight) paintPanels(); } return; }
  if(e.key==="f"||e.key==="F"||e.key==="ArrowLeft"){ e.preventDefault(); attack(); }
  if(e.key==="j"||e.key==="J"||e.key==="ArrowRight"){ e.preventDefault(); guard(); }
  if(e.key==="k"||e.key==="K"||e.key==="ArrowUp"||e.key===" "){ e.preventDefault(); shot(); }
  if(e.key==="l"||e.key==="L"||e.key==="ArrowDown"){ e.preventDefault(); special(); }
});
$("startBtn").onclick = ()=>{ cpuPick = (pick + 1 + Math.floor(Math.random()*4)) % 5; begin(); };
$("againBtn").onclick = ()=>{ cpuPick = (pick + 1 + Math.floor(Math.random()*4)) % 5; begin(); };
$("backBtn").onclick  = ()=>{ BGM.setMode("menu"); renderStatus(); show("scSelect"); };

buildRoster();
renderStatus();
renderBag();
$("gachaBtn").onclick = spinGacha;

/* ---------- ホーム画面に置ける／圏外でも遊べるようにする ---------- */
/* file:// で開いた時は登録できないので黙って諦める。ゲーム側は一切変わらない */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
