<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>キノコ決闘団 — KINOKO DUEL SQUAD</title>
<meta name="description" content="きのこの剣士たちが胞子紋の闘技場で斬り合う、間合いと読み合いの対戦ゲーム。">
<!-- ホーム画面に置いてアプリとして遊べるようにする（PWA） -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E1B24">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="キノコ決闘団">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 外部フォントは描画も script もブロックさせない。
     読み込めない回線・環境でもゲームは即座に始まり、フォントだけ後から差し替わる -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  /* 胞子紋 palette — colours taken from real spore-print classes */
  --ink:#1E1B24;        /* purple-black spore */
  --ink-2:#282433;
  --ink-3:#332E40;
  --cream:#EDE4CC;      /* cream spore */
  --rust:#B06A3B;       /* rust-brown spore — ATTACK */
  --moss:#7C8F4E;       /* moss — GUARD */
  --ochre:#C6A24A;      /* ochre spore — SHOT */
  --pink:#D08A92;       /* pink spore — damage */
  --dim:#6E6880;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gothic:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);color:var(--cream);font-family:var(--gothic);
  display:flex;justify-content:center;
  background-image:radial-gradient(circle at 50% 0%,#2A2534 0%,var(--ink) 60%);
  overscroll-behavior:none;overflow:hidden;
}
/* 画面いっぱいに使う。闘技場は残った高さを全部取る。
   iPad の横向き（〜1366px）でも左右が余らないよう上限は広めに取り、
   ノッチ・ホームバーの分だけ safe-area で内側に逃がす */
#app{
  width:100%;max-width:1600px;height:100dvh;
  padding:8px calc(10px + env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          calc(10px + env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:8px;
}
#app > section{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#scSelect{overflow:hidden}
#scEnd{justify-content:center}

/* ---- masthead ---- */
.mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink-3);padding-bottom:6px;flex:0 0 auto}
.mast h1{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.10em}
.mast .sub{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.mastR{display:flex;align-items:center;gap:10px}
.snd{
  font-size:13px;line-height:1;width:28px;height:24px;cursor:pointer;
  background:none;border:1px solid var(--ink-3);color:var(--cream);
}
.snd[aria-pressed="false"]{color:var(--dim);text-decoration:line-through}
.snd:hover{border-color:var(--cream)}

/* ---- select screen ---- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.roster{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.card{
  display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;
  background:var(--ink-2);border:1px solid var(--ink-3);border-left:3px solid var(--accent,var(--dim));
  padding:10px 12px;cursor:pointer;transition:background .15s,transform .1s;
}
.card:hover,.card:focus-visible{background:var(--ink-3);outline:none}
.card:active{transform:translateX(2px)}
.card[aria-selected="true"]{background:var(--ink-3);border-color:var(--cream);border-left-color:var(--accent)}
.card canvas{width:64px;height:64px;display:block}
.card .nm{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.05em}
.card .rl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--accent,var(--dim));margin-left:8px}
.card .sk{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin-top:6px}
.bar{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--dim)}
.bar i{display:block;height:3px;background:var(--ink);margin-top:3px;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w,50%);background:var(--accent,var(--dim))}

/* ---- arena ---- */
.arena{flex:1;min-height:120px;position:relative;border:1px solid var(--ink-3);background:var(--ink-2);overflow:hidden}
#stage{position:absolute;inset:0;display:block;touch-action:none}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;flex:0 0 auto}
.side .who{font-family:var(--display);font-size:14px;letter-spacing:.06em;display:flex;align-items:baseline;gap:6px}
.side .who em{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--dim)}
.side.r{text-align:right}
.side.r .who{justify-content:flex-end}
.hp{height:7px;background:var(--ink-3);margin-top:5px;position:relative;overflow:hidden}
.hp b{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--cream);transition:width .18s ease-out}
.hp.r b{left:auto;right:0}
.hp u{position:absolute;top:0;bottom:0;background:var(--pink);opacity:.5;text-decoration:none;transition:width .5s .15s}
.clock{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.04em;min-width:56px;text-align:center}
.clock.low{color:var(--pink)}

/* ---- controls ---- 3つのゲージを横一列に並べる ---- */
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:0 0 auto}
.pad{
  position:relative;border:1px solid var(--ink-3);background:var(--ink-2);color:var(--cream);
  font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.2em;
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;overflow:hidden;transition:background .1s;
}
.pad small{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--dim)}
.pad.ready{border-color:var(--c);background:linear-gradient(0deg,color-mix(in srgb,var(--c) 16%,var(--ink-2)),var(--ink-2))}
.pad:active{background:var(--c)!important;color:var(--ink)}
.pad:disabled{cursor:default}
.pad canvas{width:38px;height:38px}
#padA{--c:var(--rust)} #padG{--c:var(--moss)} #padS{--c:var(--ochre)} #padW{--c:var(--cream)}
.pads{grid-template-columns:repeat(4,1fr)}
.pad .wmark{font-family:var(--display);font-size:20px;line-height:38px;height:38px;color:var(--w,var(--dim))}
.pad:disabled{opacity:.45}

/* ---- 手持ち（5枠。使うと消える） ---- */
.bag{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:0 0 auto}
.bag button{
  font-family:var(--display);font-size:15px;padding:6px 2px;cursor:pointer;
  background:var(--ink-2);border:1px solid var(--ink-3);color:var(--dim);
}
.bag button.has{color:var(--w);border-color:var(--w)}
.bag button.sel{background:var(--ink-3);outline:1px solid var(--cream)}
.bag button:disabled{cursor:default}

/* ---- ボス戦：味方ごとの操作パネル ---- */
.panels{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.panel{
  border:2px solid color-mix(in srgb,var(--pc) 55%,var(--ink-3));
  background:color-mix(in srgb,var(--pc) 13%,var(--ink-2));
  padding:4px 5px;transition:background .12s,border-color .12s,opacity .12s;
  opacity:.72;
}
/* 操作中の1体は色を濃くして、名前の帯も塗りつぶす */
.panel.act{
  border-color:var(--pc);opacity:1;
  background:color-mix(in srgb,var(--pc) 34%,var(--ink-2));
  box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 45%,transparent);
}
.phead .now{
  font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--ink);
  background:var(--pc);padding:2px 5px;display:none;
}
.panel.act .phead .now{display:inline-block}
.panel.ko{opacity:.38;filter:grayscale(1)}
.phead{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.phead .n{font-family:var(--mono);font-size:9px;color:var(--ink);background:var(--pc);
  width:15px;height:15px;line-height:15px;text-align:center;font-weight:700}
.panel.act .phead .n{outline:2px solid var(--cream)}
.phead .nm2{font-family:var(--display);font-size:12px;letter-spacing:.04em;color:var(--pc)}
.phead .hp2{flex:1;height:6px;background:rgba(0,0,0,.35);position:relative;overflow:hidden}
.phead .hp2 b{position:absolute;inset:0 auto 0 0;background:var(--pc);transition:width .18s}
.prow{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mini{
  position:relative;overflow:hidden;cursor:pointer;padding:7px 2px 8px;
  border:1px solid color-mix(in srgb,var(--pc) 35%,var(--ink-3));
  background:color-mix(in srgb,var(--pc) 10%,var(--ink));
  color:var(--cream);font-family:var(--display);font-size:15px;letter-spacing:.1em;
}
.mini i{position:absolute;left:0;bottom:0;height:3px;background:var(--c);width:0;transition:width .08s linear}
.mini.ready{border-color:var(--c);background:linear-gradient(0deg,color-mix(in srgb,var(--c) 20%,var(--ink)),var(--ink))}
.mini:active{background:var(--c);color:var(--ink)}
.mini:disabled{opacity:.4;cursor:default}
.mini.a{--c:var(--rust)} .mini.g{--c:var(--moss)} .mini.s{--c:var(--ochre)} .mini.w{--c:var(--cream)}

/* ---- 選択画面の状態表示 ---- */
.status{
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  border-bottom:1px solid var(--ink-3);padding-bottom:6px;margin-bottom:6px;flex-wrap:wrap;
}
.status b{color:var(--cream);font-weight:700;font-size:12px}
.status .slot{font-family:var(--display);font-size:13px;color:var(--dim)}
.status .reset{margin-left:auto;background:none;border:1px solid var(--ink-3);color:var(--dim);
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:3px 8px;cursor:pointer}
.status .reset:hover{border-color:var(--pink);color:var(--pink)}

/* ---- ガチャ ---- */
.gacha{border:1px solid var(--ink-3);background:var(--ink-2);padding:12px;margin-top:8px}
.gcv{display:block;margin:0 auto;width:220px;height:260px}
.gname{font-family:var(--display);font-size:16px;text-align:center;letter-spacing:.08em;min-height:22px}
.gdesc{font-size:11px;color:var(--dim);text-align:center;line-height:1.6;min-height:34px;margin-bottom:8px}

.btn{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:none;border:1px solid var(--ink-3);color:var(--cream);padding:12px;cursor:pointer;width:100%}
.btn.go{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700}
.btn:hover{border-color:var(--cream)}
.log{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);min-height:14px;text-align:center}
.hide{display:none!important}
.result{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.2em;text-align:center;padding:6px 0}
.keys{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="mast">
    <h1>キノコ決闘団</h1>
    <div class="mastR">
      <button id="sndBtn" class="snd" aria-pressed="true" aria-label="音のオン/オフ" title="音のオン/オフ">♪</button>
      <span class="sub">Kinoko Duel Squad</span>
    </div>
  </div>

  <!-- ============ SELECT ============ -->
  <section id="scSelect">
    <p class="eyebrow" style="flex:0 0 auto">子実体を選べ / choose your fruiting body</p>
    <div class="status" id="status"></div>
    <div class="roster" id="roster"></div>
    <button class="btn go" id="startBtn">対戦開始</button>
    <p class="keys" style="margin-top:8px">キーボード: F / ← = 攻撃 &nbsp;·&nbsp; J / → = 防御 &nbsp;·&nbsp; K / ↑ / space = 飛び道具 &nbsp;·&nbsp; L / ↓ = スペシャル</p>
  </section>

  <!-- ============ FIGHT ============ -->
  <section id="scFight" class="hide">
    <div class="hud">
      <div class="side l">
        <div class="who" id="nmL">—<em>YOU</em></div>
        <div class="hp"><u id="ghL"></u><b id="hpL"></b></div>
      </div>
      <div class="clock" id="clock">90</div>
      <div class="side r">
        <div class="who" id="nmR"><em>CPU</em>—</div>
        <div class="hp r"><u id="ghR"></u><b id="hpR"></b></div>
      </div>
    </div>
    <div class="arena"><canvas id="stage"></canvas></div>
    <p class="log" id="log">&nbsp;</p>
    <div class="bag" id="bag"></div>
    <div class="panels hide" id="panels"></div>
    <div class="pads" id="pads">
      <button class="pad" id="padA"><canvas width="84" height="84"></canvas>攻<small>ATTACK</small></button>
      <button class="pad" id="padG"><canvas width="84" height="84"></canvas>防<small>GUARD</small></button>
      <button class="pad" id="padS"><canvas width="84" height="84"></canvas>飛<small>SHOT</small></button>
      <button class="pad" id="padW"><span class="wmark" id="wmark">―</span>特<small>SPECIAL</small></button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="scEnd" class="hide">
    <p class="result" id="resultText"></p>
    <p class="log" id="resultSub"></p>
    <div id="gachaBox" class="gacha hide">
      <p class="eyebrow" style="text-align:center">勝利報酬 / GACHA</p>
      <canvas class="gcv" id="gcv" width="440" height="520"></canvas>
      <p class="gname" id="gname">&nbsp;</p>
      <p class="gdesc" id="gdesc">&nbsp;</p>
      <button class="btn go" id="gachaBtn">ガチャを回す</button>
    </div>
    <div style="height:10px"></div>
    <button class="btn go" id="againBtn">もう一度</button>
    <div style="height:8px"></div>
    <button class="btn" id="backBtn">きのこを選び直す</button>
  </section>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   BALANCE TABLE  —  すべての戦略的パラメータはここに集約
   ------------------------------------------------------------------
   設計意図:
     speed が高い  → 遭遇回数が増える = 相手のゲージ充填を「飢えさせる」
     speed が低い  → 遭遇は稀 = 1回の交錯を必ず決めきる必要がある
   つまり速度は攻撃力ではなく「テンポ支配力」。
   ゲージ秒数は speed とゆるやかに逆相関させつつ、
   atkGauge / guardGauge / shot.gauge を独立させることで型を分けている。

   飛び道具（shot）は全員が持つ。移動が自動＝避けられないので、
   飛び道具に対する答えは「防御」しかない。これが防御の存在意義。
     kind:"bolt" 直進 / "dart" 高速で小さい / "wave" 上下に蛇行
     kind:"lob"  山なり（近距離は頭上を素通りする＝置き技）
     kind:"mist" 低速で減速しながら居座る（毒つき）
   ══════════════════════════════════════════════════════════════════ */

    atkGauge:1.2, guardGauge:0.9,

  {

    atkGauge:3.2, guardGauge:2.0,
    windup:0.5, active:0.2, recover:0.58,

  {
    id:"maitake", name:"マイタケ", role:"WALL", skill:"舞い返し",

    hp:132, speed:60, dmg:15, reach:118,

           windup:0.28, recover:0.36, r:9, life:3.0,

  {

    atkGauge:2.8, guardGauge:2.0,
    windup:0.2, active:0.12, recover:0.3,
    guardTime:0.56, parryWindow:0.24,
    parryRefund:true,
    shot:{ name:"香気弾", kind:"wave", gauge:2.9, dmg:6, speed:261, amp:17, freq:9,
           windup:0.16, recover:0.24, r:7, life:2.2,

    art:{ style:"stripe", body:"#C3B2EF", cap:"#AE99E7", pom:"#AE99E7", trim:"#FAF5E8", weapon:"#AE99E7" },
    accent:"#BCA9EC",

function bossFor(lv){
  const tier = Math.max(1, Math.round(lv/BOSS_EVERY));       // 1,2,3,4...
  const base = BOSSES[(tier-1) % BOSSES.length];
  const g = tier - 1;
  const b = Object.assign({}, base, {
    hp:       Math.round(base.hp    * (1 + g*0.16)),
    dmg:      Math.round(base.dmg   * (1 + g*0.07)),
    speed:    Math.round(base.speed * (1 + g*0.04)),
    atkGauge: +(base.atkGauge / (1 + g*0.04)).toFixed(2),
    tier,
  });
  if(tier > BOSSES.length) b.name = base.name + "・" + "二三四五六七八九".charAt(Math.min(7, Math.floor(g/BOSSES.length)-1+1)) + "の型";
  return b;
}

/* 種を固定した乱数。毎フレーム同じ配置が出るので木や建物がちらつかない */
function srnd(seed){
  let v = seed>>>0;
  return ()=>{ v = (v + 0x6D2B79F5)>>>0;
    let t = Math.imul(v ^ v>>>15, 1|v); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14)>>>0) / 4294967296; };
}

/* 情景は動かないので一度だけ別キャンバスに描いて使い回す
   （毎フレーム100本近くのパスを引くのは端末に厳しい） */
let sceneCv = null, sceneKey = "";
function scenery(g, st, W, H, F){
  const key = st.id+"|"+Math.round(W)+"x"+Math.round(H)+"|"+Math.round(F);
  if(sceneKey !== key){
    sceneCv = document.createElement("canvas");
    sceneCv.width = Math.max(1,Math.round(W)); sceneCv.height = Math.max(1,Math.round(H));
    drawScenery(sceneCv.getContext("2d"), st, W, H, F);
    sceneKey = key;
  }
  g.drawImage(sceneCv, 0, 0, W, H);
}

/* ---------- 背景の情景 ----------
   森・街・洞窟・湖畔・神社・雪原。遠景→中景→近景の3層。
   キャラより目立たないよう、輪郭線は使わずシルエットだけで描く。 */
function drawScenery(g, st, W, H, F){
  const r = srnd(1234);
  const horizon = F - H*0.02;

  if(st.id==="forest"){
    g.fillStyle=st.far;                                  // 遠くの梢
    for(let i=0;i<10;i++){ const x=r()*W, h=H*(0.30+r()*0.26);
      g.beginPath(); g.ellipse(x, F-h, 40+r()*26, 26+r()*14, 0, 0, 7); g.fill();
      g.fillRect(x-4, F-h, 8, h); }
    g.fillStyle=st.mid;                                  // 手前の太い幹
    for(let i=0;i<5;i++){ const x=(i+0.5)*W/5 + (r()-0.5)*50, w=14+r()*12, h=H*(0.5+r()*0.3);
      g.fillRect(x-w/2, F-h, w, h);
      g.beginPath(); g.ellipse(x, F-h-4, 52+r()*24, 30+r()*12, 0, 0, 7); g.fill(); }
    g.fillStyle=st.near;                                 // 下草
    for(let i=0;i<26;i++){ const x=r()*W, hh=8+r()*16;
      g.beginPath(); g.moveTo(x, F); g.quadraticCurveTo(x+4, F-hh*0.7, x+2+r()*6, F-hh);
      g.lineTo(x+3, F); g.closePath(); g.fill(); }
    for(let i=0;i<7;i++){ const x=r()*W;                 // 足元の小さいきのこ
      g.fillStyle=st.light; g.globalAlpha=.5;
      g.beginPath(); g.ellipse(x, F-7, 5, 3.4, 0, Math.PI, 0); g.fill();
      g.fillRect(x-1.2, F-7, 2.4, 7); g.globalAlpha=1; }

  } else if(st.id==="town"){
    g.fillStyle=st.far;                                  // 奥のビル
    for(let i=0;i<16;i++){ const w=22+r()*38, x=i*W/16-10, h=H*(0.22+r()*0.34);
      g.fillRect(x, F-h, w, h); }
    g.fillStyle=st.mid;                                  // 手前の建物
    const rows=[];
    for(let i=0;i<7;i++){ const w=48+r()*54, x=i*W/7-14, h=H*(0.30+r()*0.30);
      g.fillRect(x, F-h, w, h); rows.push([x,w,h]); }
    g.fillStyle=st.light;                                // 灯りのついた窓
    rows.forEach(([x,w,h])=>{
      for(let cy=F-h+12; cy<F-14; cy+=16)
        for(let cx=x+7; cx<x+w-8; cx+=13){
          if(r()<0.45){ g.globalAlpha=.35+r()*0.5; g.fillRect(cx, cy, 5, 7); } }
    });
    g.globalAlpha=1;
    [W*0.22, W*0.62].forEach(x=>{                        // 街灯
      g.fillStyle=st.near; g.fillRect(x-2, F-64, 4, 64);
      g.fillStyle=st.light; g.globalAlpha=.85;
      g.beginPath(); g.arc(x, F-68, 5.5, 0, 7); g.fill();
      g.globalAlpha=.13; g.beginPath(); g.arc(x, F-68, 26, 0, 7); g.fill(); g.globalAlpha=1; });

  } else if(st.id==="cave"){
    g.fillStyle=st.far;                                  // 奥の岩肌
    for(let i=0;i<9;i++){ const x=r()*W, y=F-H*(0.2+r()*0.5);
      g.beginPath(); g.ellipse(x, y, 60+r()*50, 34+r()*24, 0, 0, 7); g.fill(); }
    g.fillStyle=st.mid;                                  // 鍾乳石（上から）
    for(let i=0;i<16;i++){ const x=i*W/16+r()*22, w=10+r()*16, h=24+r()*80;
      g.beginPath(); g.moveTo(x-w/2, 0); g.lineTo(x+w/2, 0); g.lineTo(x, h); g.closePath(); g.fill(); }
    g.fillStyle=st.near;                                 // 石筍（下から）
    for(let i=0;i<10;i++){ const x=r()*W, w=12+r()*20, h=14+r()*44;
      g.beginPath(); g.moveTo(x-w/2, F); g.lineTo(x+w/2, F); g.lineTo(x, F-h); g.closePath(); g.fill(); }
    g.fillStyle=st.light; g.globalAlpha=.5;              // 光る菌
    for(let i=0;i<12;i++){ const x=r()*W, y=F-10-r()*H*0.5;
      g.beginPath(); g.arc(x, y, 2+r()*2, 0, 7); g.fill(); }
    g.globalAlpha=1;

  } else if(st.id==="lake"){
    g.fillStyle=st.far;                                  // 遠くの山
    for(let i=0;i<6;i++){ const x=i*W/5-30, w=140+r()*120, h=H*(0.26+r()*0.24);
      g.beginPath(); g.moveTo(x-w/2, horizon); g.lineTo(x, horizon-h); g.lineTo(x+w/2, horizon);
      g.closePath(); g.fill(); }
    g.fillStyle=st.mid;                                  // 水面
    g.fillRect(0, horizon-2, W, F-horizon+2);
    g.strokeStyle=st.light; g.lineWidth=1;               // さざなみ
    for(let i=0;i<16;i++){ const y=horizon+2+r()*(F-horizon-2), x=r()*W, w=14+r()*40;
      g.globalAlpha=.10+r()*0.14; g.beginPath(); g.moveTo(x, y); g.lineTo(x+w, y); g.stroke(); }
    g.globalAlpha=1; g.fillStyle=st.near;                // 岸の葦
    for(let i=0;i<22;i++){ const x=r()*W, h=16+r()*30;
      g.beginPath(); g.moveTo(x, F); g.quadraticCurveTo(x+6, F-h*0.6, x+3+r()*8, F-h);
      g.lineTo(x+2.5, F); g.closePath(); g.fill(); }

  } else if(st.id==="shrine"){
    g.fillStyle=st.far;                                  // 奥の杜
    for(let i=0;i<8;i++){ const x=r()*W, h=H*(0.24+r()*0.24);
      g.beginPath(); g.ellipse(x, F-h, 46+r()*26, 28+r()*12, 0, 0, 7); g.fill(); }
    // 鳥居（中央に大きく）
    const tx=W*0.5, ty=F, tw=W*0.36, th=H*0.52, pw=13;
    g.fillStyle=st.mid;
    g.fillRect(tx-tw/2, ty-th, pw, th); g.fillRect(tx+tw/2-pw, ty-th, pw, th);
    g.beginPath();                                        // 笠木（反りを付ける）
    g.moveTo(tx-tw/2-22, ty-th-4); g.quadraticCurveTo(tx, ty-th-20, tx+tw/2+22, ty-th-4);
    g.lineTo(tx+tw/2+22, ty-th+8); g.quadraticCurveTo(tx, ty-th-8, tx-tw/2-22, ty-th+8);
    g.closePath(); g.fill();
    g.fillRect(tx-tw/2-6, ty-th+26, tw+12, 9);            // 貫
    [W*0.2, W*0.8].forEach(x=>{                           // 石灯籠
      g.fillStyle=st.near; g.fillRect(x-9, F-16, 18, 16); g.fillRect(x-5, F-34, 10, 18);
      g.fillStyle=st.light; g.globalAlpha=.8;
      g.fillRect(x-7, F-46, 14, 12);
      g.globalAlpha=.12; g.beginPath(); g.arc(x, F-40, 24, 0, 7); g.fill(); g.globalAlpha=1;
      g.fillStyle=st.near; g.fillRect(x-11, F-50, 22, 5); });

  } else {                                               // snow
    g.fillStyle=st.far;                                  // 遠くの針葉樹
    for(let i=0;i<12;i++){ const x=r()*W, h=H*(0.16+r()*0.2), w=18+r()*14;
      for(let k=0;k<3;k++){ const kk=k/3;
        g.beginPath();
        g.moveTo(x-w*(1-kk)/2, F-h*kk-h*0.1); g.lineTo(x, F-h*kk-h*0.42);
        g.lineTo(x+w*(1-kk)/2, F-h*kk-h*0.1); g.closePath(); g.fill(); } }
    g.fillStyle=st.mid;                                  // 手前の木立
    for(let i=0;i<5;i++){ const x=(i+0.5)*W/5+(r()-0.5)*60, h=H*(0.3+r()*0.2), w=34+r()*18;
      for(let k=0;k<3;k++){ const kk=k/3;
        g.beginPath();
        g.moveTo(x-w*(1-kk)/2, F-h*kk-h*0.08); g.lineTo(x, F-h*kk-h*0.44);
        g.lineTo(x+w*(1-kk)/2, F-h*kk-h*0.08); g.closePath(); g.fill(); } }
    g.fillStyle=st.near;                                 // 雪の吹きだまり
    for(let i=0;i<8;i++){ const x=r()*W;
      g.beginPath(); g.ellipse(x, F+2, 40+r()*46, 9+r()*8, 0, Math.PI, 0); g.fill(); }
  }
}

const stageFor = lv => STAGES[((lv-1) % STAGES.length + STAGES.length) % STAGES.length];

/* ボスの当たり判定は体の大きさに合わせて広い */
const BOSS_BOX = { halfW: CHAR_W, top: -CHAR_H*3, bot: -4 };

/* ---------- 敵のレベル ----------------------------------------------
   Lv.1 は反応が鈍く滅多にガードしない。Lv.10 でこれまでのCPU
   （react 0.22 / ガード0.72 / 弾0.55）に並ぶ。以降は少しずつ詰める。
--------------------------------------------------------------------- */
function cpuProfile(lv){
  // 0.5乗にしているのは、線形だと Lv1〜6 の差が体感できないため（tools/balance-sim.js levels で実測）
  const t = Math.pow(Math.min(1, Math.max(0, (lv-1)/9)), 0.5);   // Lv1→Lv10 で 0→1
  const over = Math.min(1, Math.max(0, (lv-10)/10));             // Lv10→Lv20 で 0→1
  return {
    react:  0.60 - 0.38*t - 0.10*over,   // 反応の遅れ 0.60 → 0.22 → 0.12
    guard:  0.20 + 0.52*t + 0.15*over,   // 振りかぶりを見てガードする確率
    pGuard: 0.25 + 0.55*t + 0.12*over,   // 飛んでくる弾をガードする確率
    shot:   0.15 + 0.40*t + 0.15*over,   // 撃つ確率
    dmg:    0.75 + 0.25*t,               // 与ダメージ倍率 0.75 → 1.0
    hp:     1.00 + 0.15*over,            // Lv10超えは体力も伸びる
  };
}

/* ---------- ガチャ ---------- */
function rollGacha(){
  const total = GACHA_MISS + WEAPONS.reduce((a,w)=>a+w.weight,0);
  let r = Math.random()*total;
  if((r -= GACHA_MISS) < 0) return null;          // はずれ
  for(const w of WEAPONS){ if((r -= w.weight) < 0) return w; }
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   音 — Web Audio でその場で合成する
   ------------------------------------------------------------------
   音声ファイルは1つも持たない。index.html 1枚で動く（＝URLを渡すだけで
   遊べる）ことがこのゲームの配布手段そのものなので、mp3を並べる代わりに
   オシレータとノイズから作る。ブラウザの自動再生規制があるので、
   AudioContext は最初のタップ／キー入力まで作らない。
   ══════════════════════════════════════════════════════════════════ */
const SND = {
  ctx:null, master:null, musicBus:null, sfxBus:null, noise:null,
  on: (typeof localStorage!=="undefined" && localStorage.getItem("kinoko-mute")==="1") ? false : true,

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.on? 0.9 : 0;
    this.master.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.34; this.musicBus.connect(this.master);
    this.sfxBus   = this.ctx.createGain(); this.sfxBus.gain.value   = 0.85; this.sfxBus.connect(this.master);
    // ホワイトノイズは1本作って使い回す（打撃・胞子の擦れ音の素）
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    this.noise = buf;
  },
  resume(){ this.init(); if(this.ctx && this.ctx.state==="suspended") this.ctx.resume(); },
  setOn(v){
    this.on = v;
    try{ localStorage.setItem("kinoko-mute", v?"0":"1"); }catch(e){}
    if(v){ this.resume(); BGM.start(); }
    if(this.master) this.master.gain.setTargetAtTime(v?0.9:0, this.ctx.currentTime, 0.02);
  },
  when(delay){ return this.ctx.currentTime + (delay||0); },
};

/* ---- 音の素 ---- */
function beep(freq, dur, o={}){
  const S=SND; if(!S.ctx || !S.on) return;
  const t0 = o.at!=null ? o.at : S.when(o.delay);
  const osc = S.ctx.createOscillator(), g = S.ctx.createGain();
  osc.type = o.type || "triangle";
  osc.frequency.setValueAtTime(freq, t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to), t0+dur);
  const v = o.vol==null? 0.3 : o.vol;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack||0.006));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(o.bus || S.sfxBus);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function hiss(dur, o={}){
  const S=SND; if(!S.ctx || !S.on) return;
  const t0 = o.at!=null ? o.at : S.when(o.delay);
  const src = S.ctx.createBufferSource(); src.buffer = S.noise;
  src.playbackRate.value = 0.8 + Math.random()*0.4;
  const f = S.ctx.createBiquadFilter();
  f.type = o.filter || "bandpass";
  f.frequency.setValueAtTime(o.f0||1200, t0);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f1), t0+dur);
  f.Q.value = o.q==null? 1.2 : o.q;
  const g = S.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol==null?0.25:o.vol, t0+(o.attack||0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(o.bus || S.sfxBus);
  src.start(t0); src.stop(t0+dur+0.03);
}

/* ---- BGM ----------------------------------------------------------
   都節音階（0,1,5,7,8半音）の32ステップ・ループ。
   先読みスケジューラで音符を先に予約する（setInterval だけで鳴らすと
   タイミングが揺れるため、Web Audio の時計に載せる）。
   menu → 旋律と低音だけ / fight → 太鼓が入る / tense → 速くなる
------------------------------------------------------------------- */
const TRACKS = {
  // ホーム：都節音階。低速・まばら。太鼓なし
  menu:{ bpm:84, root:220, scale:[0,1,5,7,8], drums:false, hat:false,
    bass:[0,null,null,null, null,null,2,null, 0,null,null,null, null,null,4,null],
    mel:[ 0,null,2,null,  3,null,2,null,   1,null,0,null, null,null,4,null,
          3,null,2,null,  0,null,null,1,   2,null,3,null,  2,null,0,null ] },

  // 戦闘：陽旋（明るい五音）。太鼓が入り、旋律が詰まる
  fight:{ bpm:98, root:220, scale:[0,2,3,7,9], drums:true, hat:true,
    bass:[0,null,0,null, 3,null,null,null, 0,null,0,null, 4,null,4,null],
    mel:[ 4,null,3,2,   4,null,null,3,   2,null,4,null,  3,2,null,null,
          0,null,2,3,   4,null,3,null,   2,3,4,null,     3,null,2,null ] },

  // ボス：一音下げた低い根音。半音を含む不穏な音階。裏拍の太鼓が増える
  boss:{ bpm:106, root:165, scale:[0,1,4,6,8], drums:true, hat:true, heavy:true,
    bass:[0,null,0,0, null,null,0,null, 1,null,1,1, null,null,0,null],
    mel:[ 0,null,null,1,  0,null,4,null,  3,null,null,4,  3,null,1,null,
          0,null,null,1,  0,null,6,null,  4,null,3,null,  1,null,0,null ] },
};

const BGM = {
  timer:null, next:0, step:0, mode:"menu", tense:false, playing:false,

  start(){
    // AudioContext は作らない。最初のタップで wakeAudio() が用意するまで待つ
    if(!SND.ctx || this.playing || !SND.on) return;
    this.playing = true; this.step = 0; this.next = SND.ctx.currentTime + 0.12;
    this.timer = setInterval(()=>this.schedule(), 25);
  },
  stop(){ if(this.timer) clearInterval(this.timer); this.timer=null; this.playing=false; },
  // ホーム / 戦闘 / ボス の3曲。残り15秒は曲を変えず「速くなる」だけ
  setMode(m){ if(m==="tense"){ this.tense = true; return; }
              this.mode = TRACKS[m] ? m : "menu"; this.tense = false; },
  track(){ return TRACKS[this.mode] || TRACKS.menu; },
  bpm(){ return this.track().bpm * (this.tense? 1.14 : 1); },

  schedule(){
    if(!SND.ctx || !SND.on) return;
    const spb = 60/this.bpm()/2;                 // 8分音符ぶんの秒数
    while(this.next < SND.ctx.currentTime + 0.15){
      this.note(this.step, this.next);
      this.step = (this.step+1) % 32;
      this.next += spb;
    }
  },
  freq(deg){
    const T = this.track();
    const oct = Math.floor(deg/5), n = T.scale[((deg%5)+5)%5];
    return T.root * Math.pow(2, n/12 + oct);
  },
  note(i, t){
    const bus = SND.musicBus, T = this.track();
    // 低音
    const b = T.bass[i % T.bass.length];
    if(b!=null) beep(this.freq(b)/2, T.heavy? 0.7 : 0.9,
                     {at:t, type:T.heavy? "sawtooth":"sine", vol:T.heavy? 0.22 : 0.30, bus, attack:0.02});
    // 旋律（琴のつもり）
    const m = T.mel[i];
    if(m!=null){
      beep(this.freq(m+5), 0.42, {at:t, type:"triangle", vol:0.20, bus, attack:0.004});
      beep(this.freq(m+10), 0.22, {at:t, type:"sine", vol:0.06, bus, attack:0.004});
      hiss(0.05, {at:t, f0:3000, f1:1200, q:2.5, vol:0.035, bus});   // 弦の擦れ
    }
    // 太鼓
    if(T.drums && (i%8===0 || i%8===4))
      beep(90, 0.20, {at:t, to:50, type:"sine", vol:0.34, bus, attack:0.003});
    if(T.heavy && i%4===2)                       // ボスは裏拍にも入る
      beep(64, 0.22, {at:t, to:38, type:"sine", vol:0.30, bus, attack:0.003});
    if(this.tense && i%4===2)
      beep(70, 0.14, {at:t, to:45, type:"sine", vol:0.22, bus, attack:0.003});
    if(T.hat && i%2===1)
      hiss(0.05, {at:t, f0:7000, f1:4000, q:1.6, vol:0.045, bus});
  },
};

/* 最初の操作で鳴らし始める（自動再生規制への対応） */
function wakeAudio(){
  SND.resume();
  if(SND.on) BGM.start();
}
["pointerdown","keydown"].forEach(ev=>
  addEventListener(ev, wakeAudio, {once:false, passive:true}));
addEventListener("visibilitychange", ()=>{
  if(!SND.ctx) return;
  if(document.hidden) SND.ctx.suspend(); else if(SND.on) SND.ctx.resume();
});

/* ══════════════════════════════════════════════════════════════════
   きのこの描画
   ------------------------------------------------------------------
   設定画（丸い体・こげ茶の太い輪郭・怒り眉・叫び口・頬の赤み・
   ぽんぽん付きの傘・剣）をベクタで再現している。画像を読み込まないので
   「依存ゼロの単体HTML」のままで、傘の色と柄だけが種ごとに変わる。
     style:"spot"   … 水玉の傘（シイタケ・ベニテングタケ）
     style:"stripe" … 縦縞の傘（マツタケ）
     style:"visor"  … つば付きの帽子型（マイタケ）
     style:"plain"  … 無地（エノキ）
   ══════════════════════════════════════════════════════════════════ */
const ART = {
  line:"#4A3226",              // こげ茶の輪郭。全パーツ共通
  face:"#F8EDCB", faceLo:"#EFDFB4",
  eye:"#33241D", blush:"#EFA49E", mouth:"#E4696D", tooth:"#FFFFFF",
  blade:"#E9E9EF", bladeHi:"#FCFCFE", bladeLo:"#C6C6D0",
};
const BODY_R = 28, BODY_Y = -47, CAP_EDGE = -45, K = 0.88;

/* 刃先が「当たる距離」に届くように、剣の長さを reach から逆算する。
   これまでは全員同じ長さ（世界座標で69）で、reach 105〜148 に対して短すぎた＝
   当たっているのに刃が届いて見えなかった。手は art 座標で x=31 の位置にある。 */
const HAND_X = 31;
const bladeLenFor = reach => Math.round(1.00*reach/K - HAND_X);
SPECIES.forEach(s => { s.bladeLen = bladeLenFor(s.reach); });

function ink(g, w){ g.strokeStyle=ART.line; g.lineWidth=w; g.lineJoin="round"; g.lineCap="round"; }
function paint(g, fill, w){ g.fillStyle=fill; g.fill(); ink(g,w||3); g.stroke(); }

function drawMushroom(g, s, x, y, scale, dir, pose){
  // y = 足元。dir: 1=右向き -1=左向き
  const A = s.art;
  g.save(); g.translate(x,y); g.scale(dir*scale*K, scale*K);

  // 影
  g.save(); g.globalAlpha=.26; g.fillStyle="#000";
  g.beginPath(); g.ellipse(0,0,30,5,0,0,7); g.fill(); g.restore();

  if(pose.ko){ drawKO(g, A); g.restore(); return; }

  // 脚（体の後ろ）
  [[-13,-9,-0.26],[13,-9,0.26]].forEach(([lx,ly,rot])=>{
    g.save(); g.translate(lx,ly); g.rotate(rot);
    g.beginPath(); g.ellipse(0,0,9,10.5,0,0,7); paint(g,A.body,3); g.restore();
  });

  // 奥の腕
  g.beginPath(); g.ellipse(-31,-38,8.5,8,0,0,7); paint(g,A.body,3);

  // つば（マイタケの帽子。後方へ張り出す）
  if(A.style==="visor"){
    g.save(); g.translate(-28,-50); g.rotate(-0.14);
    g.beginPath(); g.ellipse(0,0,17,8,0,0,7); paint(g,A.cap,3); g.restore();
  }

  // 体（顔のベース）
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); paint(g,ART.face,3.2);
  // 下ぶくれの陰
  g.save(); g.clip();
  g.globalAlpha=.35; g.fillStyle=ART.faceLo;
  g.beginPath(); g.ellipse(2,-22,26,14,0,0,7); g.fill(); g.restore();

  drawCap(g, A);
  drawFace(g, pose);

  // 前の腕＋剣
  g.save(); g.translate(HAND_X,-38);
  g.beginPath(); g.ellipse(0,0,8.5,8,0,0,7); paint(g,A.body,3);
  drawSword(g, A.weapon, pose.swing, pose.blade || s.bladeLen);
  g.restore();

  g.restore();
}

/* ---------- 傘（帽子） ---------- */
function drawCap(g, A){
  g.save();
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); g.clip();
  const top = BODY_Y-BODY_R-2;

  if(A.style==="stripe" || A.style==="visor"){
    g.fillStyle=A.trim; g.fillRect(-BODY_R,top,BODY_R*2,CAP_EDGE-top);
    g.fillStyle=A.cap;
    (A.style==="stripe" ? [[-30,12],[-6,12],[18,12]] : [[-6,15]]).forEach(([sx,w])=>
      g.fillRect(sx,top,w,CAP_EDGE-top));
    ink(g,1.8);
    (A.style==="stripe" ? [-18,-6,6,18] : [-6,9]).forEach(sx=>{
      g.beginPath(); g.moveTo(sx,top); g.lineTo(sx,CAP_EDGE-7); g.stroke(); });
    // 帽子のバンド
    g.fillStyle=A.cap; g.fillRect(-BODY_R,CAP_EDGE-8,BODY_R*2,8);
    ink(g,1.8); g.beginPath();
    g.moveTo(-BODY_R,CAP_EDGE-8); g.lineTo(BODY_R,CAP_EDGE-8); g.stroke();
  } else {
    g.fillStyle=A.cap; g.fillRect(-BODY_R,top,BODY_R*2,CAP_EDGE-top);
    if(A.style==="spot"){
      [[-16,-63,5.4,4.9],[3,-70,5.8,5.2],[18,-60,5.2,4.7],[-4,-53,4.6,4.1]]
        .forEach(([sx,sy,rx,ry])=>{
          g.beginPath(); g.ellipse(sx,sy,rx,ry,0,0,7); paint(g,A.trim,2.2); });
    } else { // plain — 傘のふちだけ濃く
      g.fillStyle=A.trim; g.fillRect(-BODY_R,CAP_EDGE-7,BODY_R*2,7);
      ink(g,1.8); g.beginPath();
      g.moveTo(-BODY_R,CAP_EDGE-7); g.lineTo(BODY_R,CAP_EDGE-7); g.stroke();
    }
  }
  g.restore();

  // 傘のふちの線
  const hw = BODY_R*Math.sqrt(1-Math.pow((CAP_EDGE-BODY_Y)/BODY_R,2));
  ink(g,3); g.beginPath(); g.moveTo(-hw,CAP_EDGE); g.lineTo(hw,CAP_EDGE); g.stroke();
  // 体の輪郭を描き直して傘の塗りを閉じる
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); ink(g,3.2); g.stroke();
  // ぽんぽん
  g.beginPath(); g.arc(0,-79,7.5,0,7); paint(g,A.pom,3);
}

/* ---------- 顔 ---------- */
function drawFace(g, pose){
  // 怒り眉（内側が下がる）
  ink(g,4.6);
  g.beginPath(); g.moveTo(-19,-42); g.lineTo(-7,-38.8);
  g.moveTo(7,-38.8); g.lineTo(19,-42); g.stroke();

  // 頬
  g.save(); g.globalAlpha=.92; g.fillStyle=ART.blush;
  g.beginPath(); g.ellipse(-17.5,-25.5,5.4,4.2,0,0,7); g.fill();
  g.beginPath(); g.ellipse(16.5,-25.5,5.4,4.2,0,0,7); g.fill(); g.restore();

  // 目
  [-9,9].forEach(ex=>{
    g.fillStyle=ART.eye; g.beginPath(); g.ellipse(ex,-32.5,4,4.6,0,0,7); g.fill();
    g.fillStyle="#fff"; g.beginPath(); g.arc(ex+1.3,-34.2,1.5,0,7); g.fill();
  });

  // 叫んでいる口（上下の歯＋赤い口内）
  const mw = pose.shout? 8 : 6.8, mh = pose.shout? 11 : 9.5;
  const my = -24-mh/2;
  g.save();
  g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); g.clip();
  g.fillStyle=ART.tooth; g.fillRect(-mw,my,mw*2,mh);
  g.fillStyle=ART.mouth; g.fillRect(-mw,my+mh*0.28,mw*2,mh*0.42);
  g.restore();
  g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); ink(g,2.6); g.stroke();
  ink(g,1.6);
  g.beginPath();
  g.moveTo(-mw,my+mh*0.28); g.lineTo(mw,my+mh*0.28);
  g.moveTo(-mw,my+mh*0.70); g.lineTo(mw,my+mh*0.70); g.stroke();
}

/* ---------- 斧（1体目のボスの得物） ----------
   茶色の柄・青緑の刃・付け根の赤い玉・穂先の赤い突起。刃先が reach に届く長さで描く。 */
function drawAxe(g, A, swing, len){

  g.beginPath(); g.roundRect(-16, -5, len-16, 10, 5); paint(g, ax.haft, 3);
  g.beginPath(); g.roundRect(len*0.34, -6, 16, 12, 3); paint(g, A.cap, 2.6);   // 赤い巻き
  // 刃（内側がえぐれた広い扇）
  const hx = len-46;
  g.beginPath();
  g.moveTo(hx, -12);
  g.quadraticCurveTo(hx+34, -50, len+2, -34);
  g.quadraticCurveTo(len+12, 0, len+2, 34);
  g.quadraticCurveTo(hx+34, 50, hx, 12);
  g.closePath(); paint(g, ax.blade, 3.2);

  g.quadraticCurveTo(len+6, 30, hx+30, 44);

  g.quadraticCurveTo(len+2, -46, len-14, -26); g.closePath(); paint(g, ax.gem, 2.8);

}

/* ---------- ボスの描画：横2キャラ分 × 縦3キャラ分 ----------
   通常キャラを引き伸ばすと間延びするので、別の組み立てにしてある：
   大きな傘＋太く長い柄。顔は柄の上に付く。 */
function drawBoss(g, f, x, y){
  const A = f.s.art, W = CHAR_W, H = CHAR_H*3;      // 126 × 231
  g.save(); g.translate(x, y); g.scale(f.dir, 1);

  // 影
  g.save(); g.globalAlpha=.3; g.fillStyle="#000";
  g.beginPath(); g.ellipse(0,0,W*0.9,9,0,0,7); g.fill(); g.restore();

  if(f.dead){ drawBossKO(g, A, W, H); g.restore(); return; }

  const stipeW = 30, stipeTop = -H*0.62;
  // たてがみ（傘のうしろから放射状に出るとげ）
  if(A.mane){
    const cy = stipeTop+8;
    const N = 17;
    for(let i=0;i<N;i++){
      // 傘のドームに沿って外向きに生やす（左下 → 上 → 右下）
      const a  = Math.PI*(-0.13 + i*1.26/(N-1));
      const px = Math.cos(a)*(W*0.86), py = cy - Math.sin(a)*(H*0.17);
      const len = 34 + (i%3)*9 + Math.sin(i*1.7)*5;
      g.save(); g.translate(px, py); g.rotate(-a);
      g.beginPath();
      g.moveTo(-6, -12); g.quadraticCurveTo(len*0.55, -8, len, 0);
      g.quadraticCurveTo(len*0.55, 8, -6, 12); g.closePath();
      paint(g, A.mane, 3); g.restore();
    }
  }
  // 脚
  [[-20,-8,-0.2],[20,-8,0.2]].forEach(([lx,ly,rot])=>{
    g.save(); g.translate(lx,ly); g.rotate(rot);
    g.beginPath(); g.ellipse(0,0,15,17,0,0,7); paint(g,A.limb||A.body,3.4); g.restore();
  });
  // 奥の腕
  g.beginPath(); g.ellipse(-stipeW-14, stipeTop*0.55, 15, 14, 0, 0, 7); paint(g,A.limb||A.body,3.4);
  // 柄（体）
  g.beginPath(); g.roundRect(-stipeW, stipeTop, stipeW*2, -stipeTop-6, 16);
  paint(g, ART.face, 3.6);
  // 傘
  g.beginPath(); g.ellipse(0, stipeTop+6, W, H*0.19, 0, Math.PI, 0);
  paint(g, A.cap, 3.6);
  g.save();
  g.beginPath(); g.ellipse(0, stipeTop+6, W, H*0.19, 0, Math.PI, 0); g.clip();
  if(A.style==="spot"){
    [[-70,-22,13],[-30,-34,15],[16,-33,14],[58,-20,12],[-6,-12,10]].forEach(([sx,sy,r])=>{
      g.beginPath(); g.ellipse(sx, stipeTop+6+sy, r, r*0.9, 0, 0, 7); paint(g,A.trim,2.6); });
  } else {
    g.fillStyle=A.trim;
    [-96,-40,16,72].forEach(sx=> g.fillRect(sx, stipeTop-40, 24, 50));
  }
  g.restore();
  // 傘のふち
  ink(g,3.6); g.beginPath(); g.moveTo(-W, stipeTop+6); g.lineTo(W, stipeTop+6); g.stroke();

  // 顔（柄の上）。設定画に笑顔のものがあるので2種類ある
  g.save(); g.translate(0, stipeTop+52); g.scale(1.35,1.35);
  const smile = f.s.face === "smile";
  if(!smile){                                   // 怒り眉
    ink(g,5.5);
    g.beginPath(); g.moveTo(-19,-13); g.lineTo(-6,-7); g.moveTo(6,-7); g.lineTo(19,-13); g.stroke();
  }
  g.save(); g.globalAlpha=.9; g.fillStyle=ART.blush;
  g.beginPath(); g.ellipse(-17,10,6,4.6,0,0,7); g.fill();
  g.beginPath(); g.ellipse(17,10,6,4.6,0,0,7); g.fill(); g.restore();
  [-9,9].forEach(ex=>{                          // 笑顔は目が大きい
    g.fillStyle=ART.eye; g.beginPath();
    g.ellipse(ex, smile? -2 : 0, smile? 5.4 : 4.4, smile? 7.0 : 5.2, 0, 0, 7); g.fill();
    g.fillStyle="#fff"; g.beginPath(); g.arc(ex+1.6, smile? -4.6 : -1.8, smile? 2.1 : 1.6, 0, 7); g.fill(); });
  if(smile){                                    // 開いた笑い口（舌つき）
    g.save();
    g.beginPath(); g.moveTo(-11,7); g.quadraticCurveTo(0,26,11,7); g.closePath();
    paint(g, ART.eye, 2.8);
    g.beginPath(); g.moveTo(-11,7); g.quadraticCurveTo(0,26,11,7); g.closePath(); g.clip();
    g.fillStyle=ART.mouth;
    g.beginPath(); g.ellipse(0,22,9,7,0,0,7); g.fill();
    g.restore();
  } else {
    const mw=8, mh=13, my=8;
    g.save(); g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); g.clip();
    g.fillStyle=ART.tooth; g.fillRect(-mw,my,mw*2,mh);
    g.fillStyle=ART.mouth; g.fillRect(-mw,my+mh*0.28,mw*2,mh*0.44); g.restore();
    g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); ink(g,2.6); g.stroke();
  }
  g.restore();

  // 前の腕＋得物（斧を持つボスもいる）
  g.save(); g.translate(stipeW+16, stipeTop*0.55);
  g.beginPath(); g.ellipse(0,0,16,15,0,0,7); paint(g,A.limb||A.body,3.4);
  if(A.axe) drawAxe(g, A, f.swing, f.s.reach - 42);
  else drawSword(g, A.weapon, f.swing, f.s.reach - 46);   // 刃先が reach に届く長さ
  g.restore();

  g.restore();
}
function drawBossKO(g, A, W, H){
