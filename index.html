<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KINOKO BLADE — 胞子紋闘技</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 胞子紋 palette — colours taken from real spore-print classes */
  --ink:#1E1B24;        /* purple-black spore */
  --ink-2:#282433;
  --ink-3:#332E40;
  --cream:#EDE4CC;      /* cream spore */
  --rust:#B06A3B;       /* rust-brown spore — ATTACK */
  --moss:#7C8F4E;       /* moss — GUARD */
  --pink:#D08A92;       /* pink spore — damage */
  --dim:#6E6880;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gothic:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);color:var(--cream);font-family:var(--gothic);
  display:flex;justify-content:center;
  background-image:radial-gradient(circle at 50% 0%,#2A2534 0%,var(--ink) 60%);
  overscroll-behavior:none;
}
#app{width:100%;max-width:760px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}

/* ---- masthead ---- */
.mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink-3);padding-bottom:8px}
.mast h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em}
.mast .sub{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}

/* ---- select screen ---- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.roster{display:flex;flex-direction:column;gap:8px}
.card{
  display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;
  background:var(--ink-2);border:1px solid var(--ink-3);border-left:3px solid var(--accent,var(--dim));
  padding:10px 12px;cursor:pointer;transition:background .15s,transform .1s;
}
.card:hover,.card:focus-visible{background:var(--ink-3);outline:none}
.card:active{transform:translateX(2px)}
.card[aria-selected="true"]{background:var(--ink-3);border-color:var(--cream);border-left-color:var(--accent)}
.card canvas{width:64px;height:64px;display:block}
.card .nm{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.05em}
.card .rl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--accent,var(--dim));margin-left:8px}
.card .sk{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.bar{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--dim)}
.bar i{display:block;height:3px;background:var(--ink);margin-top:3px;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w,50%);background:var(--accent,var(--dim))}

/* ---- arena ---- */
#stage{width:100%;display:block;background:var(--ink-2);border:1px solid var(--ink-3);touch-action:none}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side .who{font-family:var(--display);font-size:14px;letter-spacing:.06em;display:flex;align-items:baseline;gap:6px}
.side .who em{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--dim)}
.side.r{text-align:right}
.side.r .who{justify-content:flex-end}
.hp{height:7px;background:var(--ink-3);margin-top:5px;position:relative;overflow:hidden}
.hp b{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--cream);transition:width .18s ease-out}
.hp.r b{left:auto;right:0}
.hp u{position:absolute;top:0;bottom:0;background:var(--pink);opacity:.5;text-decoration:none;transition:width .5s .15s}
.clock{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.04em;min-width:56px;text-align:center}
.clock.low{color:var(--pink)}

/* ---- controls ---- */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{
  position:relative;border:1px solid var(--ink-3);background:var(--ink-2);color:var(--cream);
  font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.24em;
  padding:16px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;overflow:hidden;transition:background .1s;
}
.pad small{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim)}
.pad.ready{border-color:var(--c);background:linear-gradient(0deg,color-mix(in srgb,var(--c) 16%,var(--ink-2)),var(--ink-2))}
.pad:active{background:var(--c)!important;color:var(--ink)}
.pad:disabled{cursor:default}
.pad canvas{width:42px;height:42px}
#padA{--c:var(--rust)} #padG{--c:var(--moss)}

.btn{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:none;border:1px solid var(--ink-3);color:var(--cream);padding:12px;cursor:pointer;width:100%}
.btn.go{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700}
.btn:hover{border-color:var(--cream)}
.log{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);min-height:14px;text-align:center}
.hide{display:none!important}
.result{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.2em;text-align:center;padding:6px 0}
.keys{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="mast">
    <h1>菌血闘技</h1>
    <span class="sub">Kinoko Blade</span>
  </div>

  <!-- ============ SELECT ============ -->
  <section id="scSelect">
    <p class="eyebrow" style="margin-bottom:8px">子実体を選べ / choose your fruiting body</p>
    <div class="roster" id="roster"></div>
    <div style="height:10px"></div>
    <button class="btn go" id="startBtn">対戦開始</button>
    <p class="keys" style="margin-top:8px">キーボード: F / ← = 攻撃 &nbsp;·&nbsp; J / → = 防御</p>
  </section>

  <!-- ============ FIGHT ============ -->
  <section id="scFight" class="hide">
    <div class="hud">
      <div class="side l">
        <div class="who" id="nmL">—<em>YOU</em></div>
        <div class="hp"><u id="ghL"></u><b id="hpL"></b></div>
      </div>
      <div class="clock" id="clock">90</div>
      <div class="side r">
        <div class="who" id="nmR"><em>CPU</em>—</div>
        <div class="hp r"><u id="ghR"></u><b id="hpR"></b></div>
      </div>
    </div>
    <canvas id="stage" width="640" height="248"></canvas>
    <p class="log" id="log">&nbsp;</p>
    <div class="pads">
      <button class="pad" id="padA"><canvas width="84" height="84"></canvas>攻<small>ATTACK</small></button>
      <button class="pad" id="padG"><canvas width="84" height="84"></canvas>防<small>GUARD</small></button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="scEnd" class="hide">
    <p class="result" id="resultText"></p>
    <p class="log" id="resultSub"></p>
    <div style="height:10px"></div>
    <button class="btn go" id="againBtn">もう一度</button>
    <div style="height:8px"></div>
    <button class="btn" id="backBtn">きのこを選び直す</button>
  </section>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   BALANCE TABLE  —  すべての戦略的パラメータはここに集約
   ------------------------------------------------------------------
   設計意図:
     speed が高い  → 遭遇回数が増える = 相手のゲージ充填を「飢えさせる」
     speed が低い  → 遭遇は稀 = 1回の交錯を必ず決めきる必要がある
   つまり速度は攻撃力ではなく「テンポ支配力」。
   ゲージ秒数は speed とゆるやかに逆相関させつつ、
   atkGauge と guardGauge を独立させることで型を分けている。
   ══════════════════════════════════════════════════════════════════ */
const SPECIES = [
  {
    id:"shiitake", name:"シイタケ", role:"BALANCE", skill:"傘割り",
    note:"基準値。守りが1.2秒で回るので、様子見と差し込みを両立できる。",
    hp:104, speed:105, dmg:16, reach:134,
    atkGauge:2.0, guardGauge:1.2,
    windup:0.26, active:0.14, recover:0.32,
    guardTime:0.70, parryWindow:0.20,
    art:{ style:"spot", body:"#9BCDEE", cap:"#6FB4E3", pom:"#B7A5E8", trim:"#FAF3E2", weapon:"#B7A5E8" },
    accent:"#8FC8EC",
  },
  {
    id:"enoki", name:"エノキ", role:"RUSH", skill:"束ね突き",
    note:"最速。遭遇回数を強引に増やして重いきのこのゲージを枯らす。振りが0.14秒で読まれにくい。",
    hp:88, speed:165, dmg:13, reach:118,
    atkGauge:1.1, guardGauge:0.9,
    windup:0.14, active:0.10, recover:0.20,
    guardTime:0.52, parryWindow:0.19,
    art:{ style:"plain", body:"#EFE9D8", cap:"#FBF7EC", pom:"#DCD5C2", trim:"#D8D0BC", weapon:"#D3CBB6" },
    accent:"#E4DCC6",
  },
  {
    id:"benitengu", name:"ベニテングタケ", role:"VENOM", skill:"紅の一閃",
    note:"最遅・最重。命中で猛毒6秒。振りかぶり0.46秒は丸見え、外せば3.2秒の空白。",
    hp:70, speed:62, dmg:23, reach:136,
    atkGauge:3.2, guardGauge:2.6,
    windup:0.46, active:0.18, recover:0.56,
    guardTime:0.62, parryWindow:0.14,
    poison:{dps:1.5, dur:6},
    art:{ style:"spot", body:"#F6B3C6", cap:"#EF93AC", pom:"#F2A0B7", trim:"#FBF1D8", weapon:"#EF93AC" },
    accent:"#F4A8BE",
  },
  {
    id:"maitake", name:"マイタケ", role:"WALL", skill:"舞い返し",
    note:"防御ゲージが1.05秒で回る鉄壁。ジャスト防御で6点を反射する。攻めは2.8秒に一度だけ。",
    hp:132, speed:70, dmg:15, reach:122,
    atkGauge:2.8, guardGauge:1.05,
    windup:0.32, active:0.15, recover:0.40,
    guardTime:0.90, parryWindow:0.22,
    reflect:6,
    art:{ style:"visor", body:"#AFD883", cap:"#96C95F", pom:"#96C95F", trim:"#FAF6E6", weapon:"#96C95F" },
    accent:"#A9D479",
  },
  {
    id:"matsutake", name:"マツタケ", role:"TECHNIC", skill:"香気斬り",
    note:"ジャスト防御の受付が最長0.24秒。成功すれば攻撃ゲージが即全快し、そのまま斬り返せる。",
    hp:74, speed:118, dmg:15, reach:126,
    atkGauge:2.8, guardGauge:2.4,
    windup:0.20, active:0.12, recover:0.30,
    guardTime:0.56, parryWindow:0.24,
    parryRefund:true,
    art:{ style:"stripe", body:"#C3B2EF", cap:"#AE99E7", pom:"#AE99E7", trim:"#FAF5E8", weapon:"#AE99E7" },
    accent:"#BCA9EC",
  },
];

const RULES = {
  arenaW:640, arenaH:248, floorY:196,
  wallL:44, wallR:596,
  bodyGap:62,          // これ以下に近づくと衝突 → 互いに反転
  blockChip:0.35, chipCap:5,  // 通常ガードで通る削り（割合＋上限）。籠城対策かつ低HP溶かし防止
  parryStun:0.65,       // パリィされた側の硬直
  hurtTime:0.25,
  knockback:26,
  roundTime:90,        // 時間切れは残りHP割合で判定
  cpuReact:0.22,       // CPUの反応遅れ
};

/* ══════════════════════════════════════════════════════════════════
   きのこの描画
   ------------------------------------------------------------------
   設定画（丸い体・こげ茶の太い輪郭・怒り眉・叫び口・頬の赤み・
   ぽんぽん付きの傘・剣）をベクタで再現している。画像を読み込まないので
   「依存ゼロの単体HTML」のままで、傘の色と柄だけが種ごとに変わる。
     style:"spot"   … 水玉の傘（シイタケ・ベニテングタケ）
     style:"stripe" … 縦縞の傘（マツタケ）
     style:"visor"  … つば付きの帽子型（マイタケ）
     style:"plain"  … 無地（エノキ）
   ══════════════════════════════════════════════════════════════════ */
const ART = {
  line:"#4A3226",              // こげ茶の輪郭。全パーツ共通
  face:"#F8EDCB", faceLo:"#EFDFB4",
  eye:"#33241D", blush:"#EFA49E", mouth:"#E4696D", tooth:"#FFFFFF",
  blade:"#E9E9EF", bladeHi:"#FCFCFE", bladeLo:"#C6C6D0",
};
const BODY_R = 28, BODY_Y = -47, CAP_EDGE = -45, K = 0.78;

function ink(g, w){ g.strokeStyle=ART.line; g.lineWidth=w; g.lineJoin="round"; g.lineCap="round"; }
function paint(g, fill, w){ g.fillStyle=fill; g.fill(); ink(g,w||3); g.stroke(); }

function drawMushroom(g, s, x, y, scale, dir, pose){
  // y = 足元。dir: 1=右向き -1=左向き
  const A = s.art;
  g.save(); g.translate(x,y); g.scale(dir*scale*K, scale*K);

  // 影
  g.save(); g.globalAlpha=.26; g.fillStyle="#000";
  g.beginPath(); g.ellipse(0,0,30,5,0,0,7); g.fill(); g.restore();

  if(pose.ko){ drawKO(g, A); g.restore(); return; }

  // 脚（体の後ろ）
  [[-13,-9,-0.26],[13,-9,0.26]].forEach(([lx,ly,rot])=>{
    g.save(); g.translate(lx,ly); g.rotate(rot);
    g.beginPath(); g.ellipse(0,0,9,10.5,0,0,7); paint(g,A.body,3); g.restore();
  });

  // 奥の腕
  g.beginPath(); g.ellipse(-31,-38,8.5,8,0,0,7); paint(g,A.body,3);

  // つば（マイタケの帽子。後方へ張り出す）
  if(A.style==="visor"){
    g.save(); g.translate(-28,-50); g.rotate(-0.14);
    g.beginPath(); g.ellipse(0,0,17,8,0,0,7); paint(g,A.cap,3); g.restore();
  }

  // 体（顔のベース）
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); paint(g,ART.face,3.2);
  // 下ぶくれの陰
  g.save(); g.clip();
  g.globalAlpha=.35; g.fillStyle=ART.faceLo;
  g.beginPath(); g.ellipse(2,-22,26,14,0,0,7); g.fill(); g.restore();

  drawCap(g, A);
  drawFace(g, pose);

  // 前の腕＋剣
  g.save(); g.translate(31,-38);
  g.beginPath(); g.ellipse(0,0,8.5,8,0,0,7); paint(g,A.body,3);
  drawSword(g, A.weapon, pose.swing);
  g.restore();

  g.restore();
}

/* ---------- 傘（帽子） ---------- */
function drawCap(g, A){
  g.save();
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); g.clip();
  const top = BODY_Y-BODY_R-2;

  if(A.style==="stripe" || A.style==="visor"){
    g.fillStyle=A.trim; g.fillRect(-BODY_R,top,BODY_R*2,CAP_EDGE-top);
    g.fillStyle=A.cap;
    (A.style==="stripe" ? [[-30,12],[-6,12],[18,12]] : [[-6,15]]).forEach(([sx,w])=>
      g.fillRect(sx,top,w,CAP_EDGE-top));
    ink(g,1.8);
    (A.style==="stripe" ? [-18,-6,6,18] : [-6,9]).forEach(sx=>{
      g.beginPath(); g.moveTo(sx,top); g.lineTo(sx,CAP_EDGE-7); g.stroke(); });
    // 帽子のバンド
    g.fillStyle=A.cap; g.fillRect(-BODY_R,CAP_EDGE-8,BODY_R*2,8);
    ink(g,1.8); g.beginPath();
    g.moveTo(-BODY_R,CAP_EDGE-8); g.lineTo(BODY_R,CAP_EDGE-8); g.stroke();
  } else {
    g.fillStyle=A.cap; g.fillRect(-BODY_R,top,BODY_R*2,CAP_EDGE-top);
    if(A.style==="spot"){
      [[-16,-63,5.4,4.9],[3,-70,5.8,5.2],[18,-60,5.2,4.7],[-4,-53,4.6,4.1]]
        .forEach(([sx,sy,rx,ry])=>{
          g.beginPath(); g.ellipse(sx,sy,rx,ry,0,0,7); paint(g,A.trim,2.2); });
    } else { // plain — 傘のふちだけ濃く
      g.fillStyle=A.trim; g.fillRect(-BODY_R,CAP_EDGE-7,BODY_R*2,7);
      ink(g,1.8); g.beginPath();
      g.moveTo(-BODY_R,CAP_EDGE-7); g.lineTo(BODY_R,CAP_EDGE-7); g.stroke();
    }
  }
  g.restore();

  // 傘のふちの線
  const hw = BODY_R*Math.sqrt(1-Math.pow((CAP_EDGE-BODY_Y)/BODY_R,2));
  ink(g,3); g.beginPath(); g.moveTo(-hw,CAP_EDGE); g.lineTo(hw,CAP_EDGE); g.stroke();
  // 体の輪郭を描き直して傘の塗りを閉じる
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); ink(g,3.2); g.stroke();
  // ぽんぽん
  g.beginPath(); g.arc(0,-79,7.5,0,7); paint(g,A.pom,3);
}

/* ---------- 顔 ---------- */
function drawFace(g, pose){
  // 怒り眉（内側が下がる）
  ink(g,4.6);
  g.beginPath(); g.moveTo(-19,-42); g.lineTo(-7,-38.8);
  g.moveTo(7,-38.8); g.lineTo(19,-42); g.stroke();

  // 頬
  g.save(); g.globalAlpha=.92; g.fillStyle=ART.blush;
  g.beginPath(); g.ellipse(-17.5,-25.5,5.4,4.2,0,0,7); g.fill();
  g.beginPath(); g.ellipse(16.5,-25.5,5.4,4.2,0,0,7); g.fill(); g.restore();

  // 目
  [-9,9].forEach(ex=>{
    g.fillStyle=ART.eye; g.beginPath(); g.ellipse(ex,-32.5,4,4.6,0,0,7); g.fill();
    g.fillStyle="#fff"; g.beginPath(); g.arc(ex+1.3,-34.2,1.5,0,7); g.fill();
  });

  // 叫んでいる口（上下の歯＋赤い口内）
  const mw = pose.shout? 8 : 6.8, mh = pose.shout? 11 : 9.5;
  const my = -24-mh/2;
  g.save();
  g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); g.clip();
  g.fillStyle=ART.tooth; g.fillRect(-mw,my,mw*2,mh);
  g.fillStyle=ART.mouth; g.fillRect(-mw,my+mh*0.28,mw*2,mh*0.42);
  g.restore();
  g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); ink(g,2.6); g.stroke();
  ink(g,1.6);
  g.beginPath();
  g.moveTo(-mw,my+mh*0.28); g.lineTo(mw,my+mh*0.28);
  g.moveTo(-mw,my+mh*0.70); g.lineTo(mw,my+mh*0.70); g.stroke();
}

/* ---------- 剣 ---------- */
function drawSword(g, col, swing){
  g.save(); g.rotate(-1.05 + swing*1.9);
  // 刀身
  g.beginPath();
  g.moveTo(7,-5.5); g.lineTo(38,-5.5); g.lineTo(47,0); g.lineTo(38,5.5); g.lineTo(7,5.5); g.closePath();
  paint(g,ART.blade,2.8);
  g.strokeStyle=ART.bladeHi; g.lineWidth=2.2; g.lineCap="round";
  g.beginPath(); g.moveTo(11,-2); g.lineTo(37,-2); g.stroke();
  g.strokeStyle=ART.bladeLo; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(11,3); g.lineTo(36,3); g.stroke();
  // 鍔・柄・柄頭
  g.beginPath(); g.roundRect(0,-11,7,22,2.5); paint(g,col,2.8);
  g.beginPath(); g.roundRect(-12,-4,13,8,3); paint(g,col,2.8);
  g.beginPath(); g.arc(-14,0,5,0,7); paint(g,col,2.8);
  g.restore();
}

/* ---------- 撃沈（KO） ---------- */
function drawKO(g, A){
  g.save(); g.translate(0,-26); g.scale(1,0.82);
  // 下へ広がる裂片
  [-2.05,-1.3,-0.45,0.45,1.3,2.05].forEach(a=>{
    g.save(); g.rotate(a);
    g.beginPath();
    g.moveTo(-6,4);
    g.quadraticCurveTo(-12,32,-13,52);
    g.lineTo(9,54);
    g.quadraticCurveTo(9,30,7,4);
    g.closePath();
    paint(g,A.body,3); g.restore();
  });
  // ぎざぎざの冠
  g.beginPath();
  g.moveTo(-26,-4); g.lineTo(-21,-29); g.lineTo(-10,-15); g.lineTo(-1,-35);
  g.lineTo(8,-15); g.lineTo(18,-29); g.lineTo(23,-6); g.closePath();
  paint(g,A.body,3);
  // 顔
  g.beginPath(); g.ellipse(0,0,22,20,0,0,7); paint(g,ART.face,3);
  // ×目
  ink(g,3);
  [-9,9].forEach(ex=>{ g.beginPath();
    g.moveTo(ex-4.5,-7.5); g.lineTo(ex+4.5,-1.5);
    g.moveTo(ex+4.5,-7.5); g.lineTo(ex-4.5,-1.5); g.stroke(); });
  // 気の抜けた口
  ink(g,2.2); g.beginPath();
  g.moveTo(-6,6); g.quadraticCurveTo(0,11,6,6); g.stroke();
  // 頬
  g.save(); g.globalAlpha=.9; g.fillStyle=ART.blush;
  g.beginPath(); g.ellipse(-15,4,5.5,4.2,0,0,7); g.fill();
  g.beginPath(); g.ellipse(15,4,5.5,4.2,0,0,7); g.fill(); g.restore();
  g.restore();
}

/* ---------- 胞子紋ゲージ（シグネチャ要素） ---------- */
function drawSporeGauge(g, cx, cy, r, pct, color, dimColor){
  g.save(); g.translate(cx,cy);
  const N=32;
  for(let i=0;i<N;i++){
    const a0 = -Math.PI/2 + i/N*Math.PI*2, a1 = a0 + (Math.PI*2/N)*0.66;
    const on = (i/N) < pct;
    g.strokeStyle = on? color : dimColor;
    g.lineWidth = on? 2.4 : 1.6;
    g.beginPath(); g.arc(0,0,r,a0,a1); g.stroke();
  }
  g.strokeStyle = pct>=1? color : dimColor; g.lineWidth=1;
  g.beginPath(); g.arc(0,0,r*0.42,0,7); g.stroke();
  if(pct>=1){ g.fillStyle=color; g.beginPath(); g.arc(0,0,r*0.22,0,7); g.fill(); }
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════
   FIGHTER
   ══════════════════════════════════════════════════════════════════ */
class Fighter{
  constructor(spec, x, dir, isPlayer){
    this.s = spec; this.x = x; this.dir = dir; this.isPlayer = isPlayer;
    this.hp = spec.hp; this.maxHp = spec.hp;
    this.atk = 0; this.grd = 0;              // 0..1 ゲージ
    this.state = "walk"; this.t = 0;         // 状態内経過秒
    this.hitDone = false; this.poison = 0; this.poisonDps = 0;
    this.flash = 0; this.swing = 0;
  }
  get busy(){ return this.state!=="walk"; }
  get ready(){ return {a:this.atk>=1, g:this.grd>=1}; }

  tryAttack(){ if(this.state!=="walk"||this.atk<1) return false;
    this.atk=0; this.state="windup"; this.t=0; this.hitDone=false; return true; }
  tryGuard(){ if(this.state!=="walk"||this.grd<1) return false;
    this.grd=0; this.state="guard"; this.t=0; return true; }

  update(dt, foe){
    this.t += dt; this.flash = Math.max(0, this.flash-dt*4);
    if(this.poison>0){ this.poison-=dt; this.hp = Math.max(0, this.hp - this.poisonDps*dt); }

    const S=this.s;
    if(this.state==="walk"){
      // ゲージは「歩いている間だけ」溜まる → 行動には常に機会費用がある
      this.atk = Math.min(1, this.atk + dt/S.atkGauge);
      this.grd = Math.min(1, this.grd + dt/S.guardGauge);
      this.x += this.dir * S.speed * dt;
      if(this.x <= RULES.wallL){ this.x = RULES.wallL; this.dir = 1; }
      if(this.x >= RULES.wallR){ this.x = RULES.wallR; this.dir = -1; }
      this.swing = 0;
    }
    else if(this.state==="windup"){ this.swing = -(this.t/S.windup)*0.55;
      if(this.t>=S.windup){ this.state="active"; this.t=0; } }
    else if(this.state==="active"){ this.swing = 0.35 + (this.t/S.active)*0.65;
      if(this.t>=S.active){ this.state="recover"; this.t=0; } }
    else if(this.state==="recover"){ this.swing = 1.0 - (this.t/S.recover);
      if(this.t>=S.recover){ this.state="walk"; this.t=0; } }
    else if(this.state==="guard"){ this.swing = -0.15;
      if(this.t>=S.guardTime){ this.state="walk"; this.t=0; } }
    else if(this.state==="stun"||this.state==="hurt"){
      this.swing *= 0.9;
      const lim = this.state==="stun"? RULES.parryStun : RULES.hurtTime;
      if(this.t>=lim){ this.state="walk"; this.t=0; } }
  }
  facing(foe){ return Math.sign(foe.x - this.x) === this.dir; }
  takeHit(dmg){ this.hp = Math.max(0, this.hp - dmg); this.flash = 1; }
}

/* ══════════════════════════════════════════════════════════════════
   GAME
   ══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cv = $("stage"), g = cv.getContext("2d");
let P, C, timeLeft, running=false, last=0, logT=0, cpuTimer=0, cpuIntent=null;
let pick = 0, cpuPick = 1;

function begin(){
  P = new Fighter(SPECIES[pick], 200, 1, true);
  C = new Fighter(SPECIES[cpuPick], 440, -1, false);
  timeLeft = RULES.roundTime; running = true; logT=0; cpuTimer=0; cpuIntent=null;
  $("nmL").innerHTML = P.s.name + '<em>YOU</em>';
  $("nmR").innerHTML = '<em>CPU</em>' + C.s.name;
  show("scFight"); say("交錯を待て");
  last = performance.now(); requestAnimationFrame(loop);
}

function loop(now){
  if(!running) return;
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  step(dt); render(); requestAnimationFrame(loop);
}

function step(dt){
  timeLeft -= dt;
  logT = Math.max(0, logT-dt);
  cpuThink(dt);

  P.update(dt, C); C.update(dt, P);

  // ── 衝突：歩行中の者は互いに反転
  const d = Math.abs(P.x - C.x);
  if(d < RULES.bodyGap){
    const s = Math.sign(P.x - C.x) || 1;
    if(P.state==="walk") P.dir = s;
    if(C.state==="walk") C.dir = -s;
    P.x += s*1.6; C.x -= s*1.6;
  }

  // ── 判定
  resolve(P, C); resolve(C, P);

  // ── 決着
  if(P.hp<=0 || C.hp<=0 || timeLeft<=0) finish();
}

function resolve(a, b){
  if(a.state!=="active" || a.hitDone) return;
  const dist = Math.abs(a.x-b.x);
  if(dist > a.s.reach || !a.facing(b)) return;
  a.hitDone = true;
  const kb = Math.sign(b.x-a.x)*RULES.knockback;

  if(b.state==="guard"){
    if(b.t <= b.s.parryWindow){                     // ジャスト防御
      a.state="stun"; a.t=0; a.swing=0;
      if(b.s.reflect){ a.takeHit(b.s.reflect); say(`${b.s.name} 舞い返し！ ${b.s.reflect}反射`); }
      else if(b.s.parryRefund){ b.atk = 1; say(`${b.s.name} 香気斬り！ 攻撃ゲージ全快`); }
      else say(`ジャスト防御！ ${a.s.name} 硬直`);
      b.flash = .6;
    } else {                                        // 通常ガード（削りは通る）
      const chip = Math.min(a.s.dmg*RULES.blockChip, RULES.chipCap);
      b.takeHit(chip); b.x = clampX(b.x+kb*0.5);
      say(`ガード ${chip.toFixed(1)} 削り`);
    }
    return;
  }
  b.takeHit(a.s.dmg); b.state="hurt"; b.t=0; b.x = clampX(b.x+kb);
  if(a.s.poison){ b.poison = a.s.poison.dur; b.poisonDps = a.s.poison.dps;
    say(`${a.s.skill} 命中 ${a.s.dmg} + 猛毒`); }
  else say(`${a.s.skill} 命中 ${a.s.dmg}`);
}
const clampX = x => Math.max(RULES.wallL, Math.min(RULES.wallR, x));
function say(t){ $("log").textContent = t; logT = 1.6; }

/* ---------- CPU ---------- */
function cpuThink(dt){
  cpuTimer -= dt;
  if(C.state!=="walk") return;
  if(cpuTimer>0) return;
  cpuTimer = RULES.cpuReact*(0.7+Math.random()*0.6);

  const dist = Math.abs(P.x-C.x);
  const closing = C.facing(P);

  // 相手の振りかぶりを見てから防御
  if(P.state==="windup" && C.grd>=1 && dist < P.s.reach+60){
    const remain = P.s.windup - P.t;
    if(remain < C.s.parryWindow*0.9 + 0.06 && Math.random() < 0.72){ C.tryGuard(); return; }
  }
  // 間合いに入る時刻を予測して振る
  if(C.atk>=1 && closing){
    const rel = P.state==="walk" && !P.facing(C) ? C.s.speed - P.s.speed : C.s.speed + P.s.speed;
    const tta = (dist - C.s.reach*0.82) / Math.max(20, rel);
    if(tta <= C.s.windup + 0.05 && tta > -0.10) C.tryAttack();
  }
}

/* ---------- 描画 ---------- */
function render(){
  const W=RULES.arenaW, H=RULES.arenaH, F=RULES.floorY;
  g.clearRect(0,0,W,H);
  g.fillStyle="#282433"; g.fillRect(0,0,W,H);

  // 背景：胞子紋の同心円
  g.save(); g.globalAlpha=.30; g.strokeStyle="#332E40"; g.lineWidth=1;
  for(let r=30;r<300;r+=26){ g.beginPath(); g.arc(W/2,F,r,Math.PI,0); g.stroke(); }
  g.restore();

  // 床
  g.strokeStyle="#4A4356"; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,F+.5); g.lineTo(W,F+.5); g.stroke();
  g.fillStyle="#211E29"; g.fillRect(0,F+1,W,H-F);
  // 壁の目盛
  g.strokeStyle="#3A3547";
  [RULES.wallL,RULES.wallR].forEach(x=>{ g.beginPath(); g.moveTo(x,F-70); g.lineTo(x,F); g.stroke(); });

  // 間合いリング（プレイヤーが振れる距離）
  if(P.ready.a && P.state==="walk"){
    g.save(); g.globalAlpha=.22; g.strokeStyle="#B06A3B"; g.setLineDash([3,5]); g.lineWidth=1;
    g.beginPath(); g.moveTo(P.x+P.dir*P.s.reach, F-58); g.lineTo(P.x+P.dir*P.s.reach, F); g.stroke();
    g.restore();
  }

  [C,P].forEach(f=>{
    if(f.flash>0){ g.save(); g.globalAlpha=Math.min(.55,f.flash);
      g.fillStyle="#D08A92"; g.beginPath(); g.arc(f.x,F-30,34,0,7); g.fill(); g.restore(); }
    if(f.state==="guard"){
      const just = f.t<=f.s.parryWindow;
      g.save(); g.strokeStyle= just? "#EDE4CC":"#7C8F4E";
      g.lineWidth= just?2.5:1.5; g.globalAlpha= just?.95:.6;
      g.beginPath(); g.arc(f.x, F-30, 32, f.dir>0? -1.4:1.75, f.dir>0? 1.4:4.55); g.stroke(); g.restore();
    }
    if(f.state==="stun"){ g.fillStyle="#D08A92"; g.font="600 13px "+getComputedStyle(document.body).fontFamily;
      g.textAlign="center"; g.fillText("★", f.x, F-78); }
    if(f.poison>0){ g.save(); g.globalAlpha=.5; g.fillStyle="#7C8F4E";
      for(let i=0;i<3;i++){ const p=(performance.now()/700+i/3)%1;
        g.beginPath(); g.arc(f.x-8+i*8, F-16-p*54, 2.2, 0, 7); g.fill(); } g.restore(); }
    drawMushroom(g, f.s, f.x, F, 1, f.dir, {
      swing:f.swing, ko:f.hp<=0,
      shout:f.state==="windup"||f.state==="active"||f.state==="hurt",
    });
  });

  // ラベル
  g.font="500 9px ui-monospace,monospace"; g.textAlign="center";
  g.fillStyle="#6E6880"; g.fillText("YOU", P.x, RULES.floorY+16);

  // HUD
  $("hpL").style.width = (P.hp/P.maxHp*100)+"%";
  $("hpR").style.width = (C.hp/C.maxHp*100)+"%";
  $("clock").textContent = Math.max(0,Math.ceil(timeLeft));
  $("clock").classList.toggle("low", timeLeft<=15);
  if(logT<=0) $("log").innerHTML="&nbsp;";
  paintPad("padA", P.atk, "#B06A3B");
  paintPad("padG", P.grd, "#7C8F4E");
}
function paintPad(id, pct, col){
  const el=$(id), c=el.querySelector("canvas"), x=c.getContext("2d");
  x.clearRect(0,0,84,84); drawSporeGauge(x,42,42,30,pct,col,"#3A3547");
  el.classList.toggle("ready", pct>=1);
}

/* ---------- 決着 ---------- */
function finish(){
  if(!running) return;
  running=false;
  // 撃沈の姿勢を1フレーム描いてから結果へ（時間切れは待たせない）
  const ko = P.hp<=0 || C.hp<=0;
  render();
  setTimeout(showResult, ko? 1100 : 260);
}
function showResult(){
  const pr=P.hp/P.maxHp, cr=C.hp/C.maxHp;
  const win = C.hp<=0 && P.hp>0 ? 1 : P.hp<=0 && C.hp>0 ? -1 : (pr>cr?1:pr<cr?-1:0);
  $("resultText").textContent = win>0? "勝　利" : win<0? "敗　北" : "引　分";
  $("resultText").style.color = win>0? "var(--cream)" : win<0? "var(--pink)" : "var(--dim)";
  $("resultSub").textContent =
    `${P.s.name} ${Math.round(P.hp)}/${P.maxHp}  ―  ${C.s.name} ${Math.round(C.hp)}/${C.maxHp}` +
    (timeLeft<=0 ? "  (時間切れ判定)" : "");
  show("scEnd");
}

/* ══════════════════════════════════════════════════════════════════
   SELECT UI
   ══════════════════════════════════════════════════════════════════ */
function buildRoster(){
  const max = {speed:165, hp:132, dmg:23};
  $("roster").innerHTML = "";
  SPECIES.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="card"; el.tabIndex=0; el.setAttribute("role","option");
    el.setAttribute("aria-selected", i===pick);
    el.style.setProperty("--accent", s.accent);
    el.innerHTML = `
      <canvas width="128" height="128"></canvas>
      <div>
        <div class="nm">${s.name}<span class="rl">${s.role}</span></div>
        <div class="sk">技: ${s.skill} — ${s.note}</div>
        <div class="bars">
          ${bar("速度", s.speed/max.speed)}
          ${bar("体力", s.hp/max.hp)}
          ${bar("攻撃", s.dmg/max.dmg)}
          ${bar("攻ゲージ", 1 - (s.atkGauge-1.1)/2.1, s.atkGauge.toFixed(1)+"s")}
        </div>
      </div>`;
    const cx = el.querySelector("canvas").getContext("2d");
    cx.scale(2,2); drawMushroom(cx, s, 29, 60, 0.85, 1, {swing:0.15});
    el.onclick = ()=>{ pick=i; refreshSel(); };
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick=i; refreshSel(); } };
    $("roster").appendChild(el);
  });
}
const bar = (label, v, txt) =>
  `<div class="bar">${txt?label+" "+txt:label}<i style="--w:${Math.max(6,Math.min(100,v*100))}%"></i></div>`;
function refreshSel(){
  [...$("roster").children].forEach((el,i)=> el.setAttribute("aria-selected", i===pick));
}
function show(id){ ["scSelect","scFight","scEnd"].forEach(s=> $(s).classList.toggle("hide", s!==id)); }

/* ---------- 入力 ---------- */
function attack(){ if(running && !P.tryAttack() && P.state==="walk") say("ゲージ不足"); }
function guard(){ if(running && !P.tryGuard() && P.state==="walk") say("ゲージ不足"); }
["pointerdown"].forEach(ev=>{
  $("padA").addEventListener(ev, e=>{ e.preventDefault(); attack(); });
  $("padG").addEventListener(ev, e=>{ e.preventDefault(); guard(); });
});
addEventListener("keydown", e=>{
  if(e.repeat) return;
  if(e.key==="f"||e.key==="F"||e.key==="ArrowLeft"){ e.preventDefault(); attack(); }
  if(e.key==="j"||e.key==="J"||e.key==="ArrowRight"){ e.preventDefault(); guard(); }
});
$("startBtn").onclick = ()=>{ cpuPick = (pick + 1 + Math.floor(Math.random()*4)) % 5; begin(); };
$("againBtn").onclick = ()=>{ cpuPick = (pick + 1 + Math.floor(Math.random()*4)) % 5; begin(); };
$("backBtn").onclick  = ()=> show("scSelect");

buildRoster();
</script>
