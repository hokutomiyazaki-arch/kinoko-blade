<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KINOKO BLADE — 胞子紋闘技</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 外部フォントは描画も script もブロックさせない。
     読み込めない回線・環境でもゲームは即座に始まり、フォントだけ後から差し替わる -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Roboto+Mono:wght@400;500;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  /* 胞子紋 palette — colours taken from real spore-print classes */
  --ink:#1E1B24;        /* purple-black spore */
  --ink-2:#282433;
  --ink-3:#332E40;
  --cream:#EDE4CC;      /* cream spore */
  --rust:#B06A3B;       /* rust-brown spore — ATTACK */
  --moss:#7C8F4E;       /* moss — GUARD */
  --ochre:#C6A24A;      /* ochre spore — SHOT */
  --pink:#D08A92;       /* pink spore — damage */
  --dim:#6E6880;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"Roboto Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --gothic:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink);color:var(--cream);font-family:var(--gothic);
  display:flex;justify-content:center;
  background-image:radial-gradient(circle at 50% 0%,#2A2534 0%,var(--ink) 60%);
  overscroll-behavior:none;overflow:hidden;
}
/* 画面いっぱいに使う。闘技場は残った高さを全部取る */
#app{
  width:100%;max-width:1180px;height:100dvh;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
}
#app > section{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#scSelect{overflow:hidden}
#scEnd{justify-content:center}

/* ---- masthead ---- */
.mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink-3);padding-bottom:6px;flex:0 0 auto}
.mast h1{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.14em}
.mast .sub{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.mastR{display:flex;align-items:center;gap:10px}
.snd{
  font-size:13px;line-height:1;width:28px;height:24px;cursor:pointer;
  background:none;border:1px solid var(--ink-3);color:var(--cream);
}
.snd[aria-pressed="false"]{color:var(--dim);text-decoration:line-through}
.snd:hover{border-color:var(--cream)}

/* ---- select screen ---- */
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.roster{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.card{
  display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;
  background:var(--ink-2);border:1px solid var(--ink-3);border-left:3px solid var(--accent,var(--dim));
  padding:10px 12px;cursor:pointer;transition:background .15s,transform .1s;
}
.card:hover,.card:focus-visible{background:var(--ink-3);outline:none}
.card:active{transform:translateX(2px)}
.card[aria-selected="true"]{background:var(--ink-3);border-color:var(--cream);border-left-color:var(--accent)}
.card canvas{width:64px;height:64px;display:block}
.card .nm{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.05em}
.card .rl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--accent,var(--dim));margin-left:8px}
.card .sk{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin-top:6px}
.bar{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--dim)}
.bar i{display:block;height:3px;background:var(--ink);margin-top:3px;position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w,50%);background:var(--accent,var(--dim))}

/* ---- arena ---- */
.arena{flex:1;min-height:120px;position:relative;border:1px solid var(--ink-3);background:var(--ink-2);overflow:hidden}
#stage{position:absolute;inset:0;display:block;touch-action:none}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;flex:0 0 auto}
.side .who{font-family:var(--display);font-size:14px;letter-spacing:.06em;display:flex;align-items:baseline;gap:6px}
.side .who em{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--dim)}
.side.r{text-align:right}
.side.r .who{justify-content:flex-end}
.hp{height:7px;background:var(--ink-3);margin-top:5px;position:relative;overflow:hidden}
.hp b{position:absolute;top:0;bottom:0;left:0;width:100%;background:var(--cream);transition:width .18s ease-out}
.hp.r b{left:auto;right:0}
.hp u{position:absolute;top:0;bottom:0;background:var(--pink);opacity:.5;text-decoration:none;transition:width .5s .15s}
.clock{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:.04em;min-width:56px;text-align:center}
.clock.low{color:var(--pink)}

/* ---- controls ---- 3つのゲージを横一列に並べる ---- */
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:0 0 auto}
.pad{
  position:relative;border:1px solid var(--ink-3);background:var(--ink-2);color:var(--cream);
  font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.2em;
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;overflow:hidden;transition:background .1s;
}
.pad small{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--dim)}
.pad.ready{border-color:var(--c);background:linear-gradient(0deg,color-mix(in srgb,var(--c) 16%,var(--ink-2)),var(--ink-2))}
.pad:active{background:var(--c)!important;color:var(--ink)}
.pad:disabled{cursor:default}
.pad canvas{width:38px;height:38px}
#padA{--c:var(--rust)} #padG{--c:var(--moss)} #padS{--c:var(--ochre)} #padW{--c:var(--cream)}
.pads{grid-template-columns:repeat(4,1fr)}
.pad .wmark{font-family:var(--display);font-size:20px;line-height:38px;height:38px;color:var(--w,var(--dim))}
.pad:disabled{opacity:.45}

/* ---- 手持ち（5枠。使うと消える） ---- */
.bag{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:0 0 auto}
.bag button{
  font-family:var(--display);font-size:15px;padding:6px 2px;cursor:pointer;
  background:var(--ink-2);border:1px solid var(--ink-3);color:var(--dim);
}
.bag button.has{color:var(--w);border-color:var(--w)}
.bag button.sel{background:var(--ink-3);outline:1px solid var(--cream)}
.bag button:disabled{cursor:default}

/* ---- 選択画面の状態表示 ---- */
.status{
  display:flex;align-items:center;gap:10px;flex:0 0 auto;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--dim);
  border-bottom:1px solid var(--ink-3);padding-bottom:6px;margin-bottom:6px;flex-wrap:wrap;
}
.status b{color:var(--cream);font-weight:700;font-size:12px}
.status .slot{font-family:var(--display);font-size:13px;color:var(--dim)}
.status .reset{margin-left:auto;background:none;border:1px solid var(--ink-3);color:var(--dim);
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:3px 8px;cursor:pointer}
.status .reset:hover{border-color:var(--pink);color:var(--pink)}

/* ---- ガチャ ---- */
.gacha{border:1px solid var(--ink-3);background:var(--ink-2);padding:12px;margin-top:8px}
.gslot{
  font-family:var(--display);font-size:40px;text-align:center;height:64px;line-height:64px;
  color:var(--dim);letter-spacing:.1em;
}
.gname{font-family:var(--display);font-size:16px;text-align:center;letter-spacing:.08em;min-height:22px}
.gdesc{font-size:11px;color:var(--dim);text-align:center;line-height:1.6;min-height:34px;margin-bottom:8px}

.btn{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:none;border:1px solid var(--ink-3);color:var(--cream);padding:12px;cursor:pointer;width:100%}
.btn.go{background:var(--cream);color:var(--ink);border-color:var(--cream);font-weight:700}
.btn:hover{border-color:var(--cream)}
.log{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);min-height:14px;text-align:center}
.hide{display:none!important}
.result{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.2em;text-align:center;padding:6px 0}
.keys{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="mast">
    <h1>菌血闘技</h1>
    <div class="mastR">
      <button id="sndBtn" class="snd" aria-pressed="true" aria-label="音のオン/オフ" title="音のオン/オフ">♪</button>
      <span class="sub">Kinoko Blade</span>
    </div>
  </div>

  <!-- ============ SELECT ============ -->
  <section id="scSelect">
    <p class="eyebrow" style="flex:0 0 auto">子実体を選べ / choose your fruiting body</p>
    <div class="status" id="status"></div>
    <div class="roster" id="roster"></div>
    <button class="btn go" id="startBtn">対戦開始</button>
    <p class="keys" style="margin-top:8px">キーボード: F / ← = 攻撃 &nbsp;·&nbsp; J / → = 防御 &nbsp;·&nbsp; K / ↑ / space = 飛び道具 &nbsp;·&nbsp; L / ↓ = スペシャル</p>
  </section>

  <!-- ============ FIGHT ============ -->
  <section id="scFight" class="hide">
    <div class="hud">
      <div class="side l">
        <div class="who" id="nmL">—<em>YOU</em></div>
        <div class="hp"><u id="ghL"></u><b id="hpL"></b></div>
      </div>
      <div class="clock" id="clock">90</div>
      <div class="side r">
        <div class="who" id="nmR"><em>CPU</em>—</div>
        <div class="hp r"><u id="ghR"></u><b id="hpR"></b></div>
      </div>
    </div>
    <div class="arena"><canvas id="stage"></canvas></div>
    <p class="log" id="log">&nbsp;</p>
    <div class="bag" id="bag"></div>
    <div class="pads">
      <button class="pad" id="padA"><canvas width="84" height="84"></canvas>攻<small>ATTACK</small></button>
      <button class="pad" id="padG"><canvas width="84" height="84"></canvas>防<small>GUARD</small></button>
      <button class="pad" id="padS"><canvas width="84" height="84"></canvas>飛<small>SHOT</small></button>
      <button class="pad" id="padW"><span class="wmark" id="wmark">―</span>特<small>SPECIAL</small></button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="scEnd" class="hide">
    <p class="result" id="resultText"></p>
    <p class="log" id="resultSub"></p>
    <div id="gachaBox" class="gacha hide">
      <p class="eyebrow" style="text-align:center">勝利報酬 / GACHA</p>
      <div class="gslot" id="gslot">?</div>
      <p class="gname" id="gname">&nbsp;</p>
      <p class="gdesc" id="gdesc">&nbsp;</p>
      <button class="btn go" id="gachaBtn">ガチャを回す</button>
    </div>
    <div style="height:10px"></div>
    <button class="btn go" id="againBtn">もう一度</button>
    <div style="height:8px"></div>
    <button class="btn" id="backBtn">きのこを選び直す</button>
  </section>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   BALANCE TABLE  —  すべての戦略的パラメータはここに集約
   ------------------------------------------------------------------
   設計意図:
     speed が高い  → 遭遇回数が増える = 相手のゲージ充填を「飢えさせる」
     speed が低い  → 遭遇は稀 = 1回の交錯を必ず決めきる必要がある
   つまり速度は攻撃力ではなく「テンポ支配力」。
   ゲージ秒数は speed とゆるやかに逆相関させつつ、
   atkGauge / guardGauge / shot.gauge を独立させることで型を分けている。

   飛び道具（shot）は全員が持つ。移動が自動＝避けられないので、
   飛び道具に対する答えは「防御」しかない。これが防御の存在意義。
     kind:"bolt" 直進 / "dart" 高速で小さい / "wave" 上下に蛇行
     kind:"lob"  山なり（近距離は頭上を素通りする＝置き技）
     kind:"mist" 低速で減速しながら居座る（毒つき）
   ══════════════════════════════════════════════════════════════════ */

const RULES = {
  // 闘技場は横を詰めた（壁間 396）。画面には目一杯に拡大して描く
  arenaW:560, arenaH:216, floorY:172,

/* ══════════════════════════════════════════════════════════════════
   スペシャル武器 — 勝利のガチャで手に入る使い切りの技
   ------------------------------------------------------------------
   ゲージではなく「所持数」で撃つ。1回使うと消える。手持ちは5個まで。
   通常技より明確に強いが、有限なので「どの試合のどの場面で使うか」が
   選択になる。CPUは持たない（勝った側への報酬なので非対称でよい）。
   ══════════════════════════════════════════════════════════════════ */
const WEAPONS = [
  { id:"storm", name:"胞子嵐", role:"SPORE STORM", mark:"嵐", weight:20, color:"#C6A24A",

    kind:"single", windup:0.36, recover:0.46,
    shot:{ name:"猛毒雲", kind:"mist", dmg:10, speed:150, r:22, life:4.0, poison:{dps:3.0,dur:6} } },

    kind:"strike", windup:0.30, recover:0.38, dmg:22 },
];
const GACHA_MISS = 30;                       // 「はずれ」の重み（＝全体の約30%）
const BAG_MAX = 5;
const wep = id => WEAPONS.find(w=>w.id===id);

/* ---------- 保存（レベルと手持ち） ---------- */
const SAVE = {
  level: 1, bag: [],
  load(){
    try{
      const lv = parseInt(localStorage.getItem("kinoko-level"),10);
      if(lv>=1) this.level = Math.min(99, lv);
      const bag = JSON.parse(localStorage.getItem("kinoko-bag")||"[]");
      if(Array.isArray(bag)) this.bag = bag.filter(id=>wep(id)).slice(0,BAG_MAX);
    }catch(e){}
  },
  save(){
    try{
      localStorage.setItem("kinoko-level", String(this.level));
      localStorage.setItem("kinoko-bag", JSON.stringify(this.bag));
    }catch(e){}
  },
  reset(){ this.level=1; this.bag=[]; this.save(); },
};

/* ---------- 敵のレベル ----------------------------------------------
   Lv.1 は反応が鈍く滅多にガードしない。Lv.10 でこれまでのCPU
   （react 0.22 / ガード0.72 / 弾0.55）に並ぶ。以降は少しずつ詰める。
--------------------------------------------------------------------- */
function cpuProfile(lv){
  // 0.5乗にしているのは、線形だと Lv1〜6 の差が体感できないため（tools/balance-sim.js levels で実測）
  const t = Math.pow(Math.min(1, Math.max(0, (lv-1)/9)), 0.5);   // Lv1→Lv10 で 0→1
  const over = Math.min(1, Math.max(0, (lv-10)/10));             // Lv10→Lv20 で 0→1
  return {
    react:  0.60 - 0.38*t - 0.10*over,   // 反応の遅れ 0.60 → 0.22 → 0.12
    guard:  0.20 + 0.52*t + 0.15*over,   // 振りかぶりを見てガードする確率
    pGuard: 0.25 + 0.55*t + 0.12*over,   // 飛んでくる弾をガードする確率
    shot:   0.15 + 0.40*t + 0.15*over,   // 撃つ確率
    dmg:    0.75 + 0.25*t,               // 与ダメージ倍率 0.75 → 1.0
    hp:     1.00 + 0.15*over,            // Lv10超えは体力も伸びる
  };
}

/* ---------- ガチャ ---------- */
function rollGacha(){
  const total = GACHA_MISS + WEAPONS.reduce((a,w)=>a+w.weight,0);
  let r = Math.random()*total;
  if((r -= GACHA_MISS) < 0) return null;          // はずれ
  for(const w of WEAPONS){ if((r -= w.weight) < 0) return w; }
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   音 — Web Audio でその場で合成する
   ------------------------------------------------------------------
   音声ファイルは1つも持たない。index.html 1枚で動く（＝URLを渡すだけで
   遊べる）ことがこのゲームの配布手段そのものなので、mp3を並べる代わりに
   オシレータとノイズから作る。ブラウザの自動再生規制があるので、
   AudioContext は最初のタップ／キー入力まで作らない。
   ══════════════════════════════════════════════════════════════════ */
const SND = {
  ctx:null, master:null, musicBus:null, sfxBus:null, noise:null,
  on: (typeof localStorage!=="undefined" && localStorage.getItem("kinoko-mute")==="1") ? false : true,

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.on? 0.9 : 0;
    this.master.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.34; this.musicBus.connect(this.master);
    this.sfxBus   = this.ctx.createGain(); this.sfxBus.gain.value   = 0.85; this.sfxBus.connect(this.master);
    // ホワイトノイズは1本作って使い回す（打撃・胞子の擦れ音の素）
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    this.noise = buf;
  },
  resume(){ this.init(); if(this.ctx && this.ctx.state==="suspended") this.ctx.resume(); },
  setOn(v){
    this.on = v;
    try{ localStorage.setItem("kinoko-mute", v?"0":"1"); }catch(e){}
    if(v){ this.resume(); BGM.start(); }
    if(this.master) this.master.gain.setTargetAtTime(v?0.9:0, this.ctx.currentTime, 0.02);
  },
  when(delay){ return this.ctx.currentTime + (delay||0); },
};

/* ---- 音の素 ---- */
function beep(freq, dur, o={}){
  const S=SND; if(!S.ctx || !S.on) return;
  const t0 = o.at!=null ? o.at : S.when(o.delay);
  const osc = S.ctx.createOscillator(), g = S.ctx.createGain();
  osc.type = o.type || "triangle";
  osc.frequency.setValueAtTime(freq, t0);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to), t0+dur);
  const v = o.vol==null? 0.3 : o.vol;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack||0.006));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(o.bus || S.sfxBus);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function hiss(dur, o={}){
  const S=SND; if(!S.ctx || !S.on) return;
  const t0 = o.at!=null ? o.at : S.when(o.delay);
  const src = S.ctx.createBufferSource(); src.buffer = S.noise;
  src.playbackRate.value = 0.8 + Math.random()*0.4;
  const f = S.ctx.createBiquadFilter();
  f.type = o.filter || "bandpass";
  f.frequency.setValueAtTime(o.f0||1200, t0);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f1), t0+dur);
  f.Q.value = o.q==null? 1.2 : o.q;
  const g = S.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol==null?0.25:o.vol, t0+(o.attack||0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(o.bus || S.sfxBus);
  src.start(t0); src.stop(t0+dur+0.03);
}

/* ---- BGM ----------------------------------------------------------
   都節音階（0,1,5,7,8半音）の32ステップ・ループ。
   先読みスケジューラで音符を先に予約する（setInterval だけで鳴らすと
   タイミングが揺れるため、Web Audio の時計に載せる）。
   menu → 旋律と低音だけ / fight → 太鼓が入る / tense → 速くなる
------------------------------------------------------------------- */
const BGM = {
  timer:null, next:0, step:0, mode:"menu", playing:false,
  scale:[0,1,5,7,8], root:220,
  mel:[ 0,null,2,null,  3,null,2,null,   1,null,0,null, null,null,4,null,
        3,null,2,null,  0,null,null,1,   2,null,3,null,  2,null,0,null ],

  start(){
    // AudioContext は作らない。最初のタップで wakeAudio() が用意するまで待つ
    if(!SND.ctx || this.playing || !SND.on) return;
    this.playing = true; this.step = 0; this.next = SND.ctx.currentTime + 0.12;
    this.timer = setInterval(()=>this.schedule(), 25);
  },
  stop(){ if(this.timer) clearInterval(this.timer); this.timer=null; this.playing=false; },
  setMode(m){ this.mode = m; },
  bpm(){ return this.mode==="tense" ? 112 : this.mode==="fight" ? 96 : 84; },

  schedule(){
    if(!SND.ctx || !SND.on) return;
    const spb = 60/this.bpm()/2;                 // 8分音符ぶんの秒数
    while(this.next < SND.ctx.currentTime + 0.15){
      this.note(this.step, this.next);
      this.step = (this.step+1) % 32;
      this.next += spb;
    }
  },
  freq(deg){
    const oct = Math.floor(deg/5), n = this.scale[((deg%5)+5)%5];
    return this.root * Math.pow(2, n/12 + oct);
  },
  note(i, t){
    const bus = SND.musicBus, fight = this.mode!=="menu";
    // 低音（1小節=8ステップの頭）
    if(i%8===0) beep(this.freq(0)/2, 0.9, {at:t, type:"sine", vol:0.30, bus, attack:0.02});
    if(i%16===8) beep(this.freq(2)/2, 0.7, {at:t, type:"sine", vol:0.24, bus, attack:0.02});
    // 旋律（琴のつもり）
    const m = this.mel[i];
    if(m!=null){
      beep(this.freq(m+5), 0.42, {at:t, type:"triangle", vol:0.20, bus, attack:0.004});
      beep(this.freq(m+10), 0.22, {at:t, type:"sine", vol:0.06, bus, attack:0.004});
      hiss(0.05, {at:t, f0:3000, f1:1200, q:2.5, vol:0.035, bus});   // 弦の擦れ
    }
    // 太鼓（戦闘中のみ）
    if(fight && (i%8===0 || i%8===4))
      beep(90, 0.20, {at:t, to:50, type:"sine", vol:0.34, bus, attack:0.003});
    if(this.mode==="tense" && i%4===2)
      beep(70, 0.14, {at:t, to:45, type:"sine", vol:0.22, bus, attack:0.003});
    if(fight && i%2===1)
      hiss(0.05, {at:t, f0:7000, f1:4000, q:1.6, vol:0.045, bus});
  },
};

/* 最初の操作で鳴らし始める（自動再生規制への対応） */
function wakeAudio(){
  SND.resume();
  if(SND.on) BGM.start();
}
["pointerdown","keydown"].forEach(ev=>
  addEventListener(ev, wakeAudio, {once:false, passive:true}));
addEventListener("visibilitychange", ()=>{
  if(!SND.ctx) return;
  if(document.hidden) SND.ctx.suspend(); else if(SND.on) SND.ctx.resume();
});

/* ══════════════════════════════════════════════════════════════════
   きのこの描画
   ------------------------------------------------------------------
   設定画（丸い体・こげ茶の太い輪郭・怒り眉・叫び口・頬の赤み・
   ぽんぽん付きの傘・剣）をベクタで再現している。画像を読み込まないので
   「依存ゼロの単体HTML」のままで、傘の色と柄だけが種ごとに変わる。
     style:"spot"   … 水玉の傘（シイタケ・ベニテングタケ）
     style:"stripe" … 縦縞の傘（マツタケ）
     style:"visor"  … つば付きの帽子型（マイタケ）
     style:"plain"  … 無地（エノキ）
   ══════════════════════════════════════════════════════════════════ */
const ART = {
  line:"#4A3226",              // こげ茶の輪郭。全パーツ共通
  face:"#F8EDCB", faceLo:"#EFDFB4",
  eye:"#33241D", blush:"#EFA49E", mouth:"#E4696D", tooth:"#FFFFFF",
  blade:"#E9E9EF", bladeHi:"#FCFCFE", bladeLo:"#C6C6D0",
};
const BODY_R = 28, BODY_Y = -47, CAP_EDGE = -45, K = 0.88;

function ink(g, w){ g.strokeStyle=ART.line; g.lineWidth=w; g.lineJoin="round"; g.lineCap="round"; }
function paint(g, fill, w){ g.fillStyle=fill; g.fill(); ink(g,w||3); g.stroke(); }

function drawMushroom(g, s, x, y, scale, dir, pose){
  // y = 足元。dir: 1=右向き -1=左向き
  const A = s.art;
  g.save(); g.translate(x,y); g.scale(dir*scale*K, scale*K);

  // 影
  g.save(); g.globalAlpha=.26; g.fillStyle="#000";
  g.beginPath(); g.ellipse(0,0,30,5,0,0,7); g.fill(); g.restore();

  if(pose.ko){ drawKO(g, A); g.restore(); return; }

  // 脚（体の後ろ）
  [[-13,-9,-0.26],[13,-9,0.26]].forEach(([lx,ly,rot])=>{
    g.save(); g.translate(lx,ly); g.rotate(rot);
    g.beginPath(); g.ellipse(0,0,9,10.5,0,0,7); paint(g,A.body,3); g.restore();
  });

  // 奥の腕
  g.beginPath(); g.ellipse(-31,-38,8.5,8,0,0,7); paint(g,A.body,3);

  // つば（マイタケの帽子。後方へ張り出す）
  if(A.style==="visor"){
    g.save(); g.translate(-28,-50); g.rotate(-0.14);
    g.beginPath(); g.ellipse(0,0,17,8,0,0,7); paint(g,A.cap,3); g.restore();
  }

  // 体（顔のベース）
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); paint(g,ART.face,3.2);
  // 下ぶくれの陰
  g.save(); g.clip();
  g.globalAlpha=.35; g.fillStyle=ART.faceLo;
  g.beginPath(); g.ellipse(2,-22,26,14,0,0,7); g.fill(); g.restore();

  drawCap(g, A);
  drawFace(g, pose);

  // 前の腕＋剣
  g.save(); g.translate(31,-38);
  g.beginPath(); g.ellipse(0,0,8.5,8,0,0,7); paint(g,A.body,3);
  drawSword(g, A.weapon, pose.swing);
  g.restore();

  g.restore();
}

/* ---------- 傘（帽子） ---------- */
function drawCap(g, A){
  g.save();
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); g.clip();
  const top = BODY_Y-BODY_R-2;

  if(A.style==="stripe" || A.style==="visor"){
    g.fillStyle=A.trim; g.fillRect(-BODY_R,top,BODY_R*2,CAP_EDGE-top);
    g.fillStyle=A.cap;
    (A.style==="stripe" ? [[-30,12],[-6,12],[18,12]] : [[-6,15]]).forEach(([sx,w])=>
      g.fillRect(sx,top,w,CAP_EDGE-top));
    ink(g,1.8);
    (A.style==="stripe" ? [-18,-6,6,18] : [-6,9]).forEach(sx=>{
      g.beginPath(); g.moveTo(sx,top); g.lineTo(sx,CAP_EDGE-7); g.stroke(); });
    // 帽子のバンド
    g.fillStyle=A.cap; g.fillRect(-BODY_R,CAP_EDGE-8,BODY_R*2,8);
    ink(g,1.8); g.beginPath();
    g.moveTo(-BODY_R,CAP_EDGE-8); g.lineTo(BODY_R,CAP_EDGE-8); g.stroke();
  } else {
    g.fillStyle=A.cap; g.fillRect(-BODY_R,top,BODY_R*2,CAP_EDGE-top);
    if(A.style==="spot"){
      [[-16,-63,5.4,4.9],[3,-70,5.8,5.2],[18,-60,5.2,4.7],[-4,-53,4.6,4.1]]
        .forEach(([sx,sy,rx,ry])=>{
          g.beginPath(); g.ellipse(sx,sy,rx,ry,0,0,7); paint(g,A.trim,2.2); });
    } else { // plain — 傘のふちだけ濃く
      g.fillStyle=A.trim; g.fillRect(-BODY_R,CAP_EDGE-7,BODY_R*2,7);
      ink(g,1.8); g.beginPath();
      g.moveTo(-BODY_R,CAP_EDGE-7); g.lineTo(BODY_R,CAP_EDGE-7); g.stroke();
    }
  }
  g.restore();

  // 傘のふちの線
  const hw = BODY_R*Math.sqrt(1-Math.pow((CAP_EDGE-BODY_Y)/BODY_R,2));
  ink(g,3); g.beginPath(); g.moveTo(-hw,CAP_EDGE); g.lineTo(hw,CAP_EDGE); g.stroke();
  // 体の輪郭を描き直して傘の塗りを閉じる
  g.beginPath(); g.ellipse(0,BODY_Y,BODY_R,BODY_R,0,0,7); ink(g,3.2); g.stroke();
  // ぽんぽん
  g.beginPath(); g.arc(0,-79,7.5,0,7); paint(g,A.pom,3);
}

/* ---------- 顔 ---------- */
function drawFace(g, pose){
  // 怒り眉（内側が下がる）
  ink(g,4.6);
  g.beginPath(); g.moveTo(-19,-42); g.lineTo(-7,-38.8);
  g.moveTo(7,-38.8); g.lineTo(19,-42); g.stroke();

  // 頬
  g.save(); g.globalAlpha=.92; g.fillStyle=ART.blush;
  g.beginPath(); g.ellipse(-17.5,-25.5,5.4,4.2,0,0,7); g.fill();
  g.beginPath(); g.ellipse(16.5,-25.5,5.4,4.2,0,0,7); g.fill(); g.restore();

  // 目
  [-9,9].forEach(ex=>{
    g.fillStyle=ART.eye; g.beginPath(); g.ellipse(ex,-32.5,4,4.6,0,0,7); g.fill();
    g.fillStyle="#fff"; g.beginPath(); g.arc(ex+1.3,-34.2,1.5,0,7); g.fill();
  });

  // 叫んでいる口（上下の歯＋赤い口内）
  const mw = pose.shout? 8 : 6.8, mh = pose.shout? 11 : 9.5;
  const my = -24-mh/2;
  g.save();
  g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); g.clip();
  g.fillStyle=ART.tooth; g.fillRect(-mw,my,mw*2,mh);
  g.fillStyle=ART.mouth; g.fillRect(-mw,my+mh*0.28,mw*2,mh*0.42);
  g.restore();
  g.beginPath(); g.roundRect(-mw,my,mw*2,mh,3); ink(g,2.6); g.stroke();
  ink(g,1.6);
  g.beginPath();
  g.moveTo(-mw,my+mh*0.28); g.lineTo(mw,my+mh*0.28);

}

/* ---------- 胞子紋ゲージ（シグネチャ要素） ---------- */
function drawSporeGauge(g, cx, cy, r, pct, color, dimColor){
  g.save(); g.translate(cx,cy);
  const N=32;
  for(let i=0;i<N;i++){
    const a0 = -Math.PI/2 + i/N*Math.PI*2, a1 = a0 + (Math.PI*2/N)*0.66;
    const on = (i/N) < pct;
    g.strokeStyle = on? color : dimColor;
    g.lineWidth = on? 2.4 : 1.6;
    g.beginPath(); g.arc(0,0,r,a0,a1); g.stroke();
  }
  g.strokeStyle = pct>=1? color : dimColor; g.lineWidth=1;
  g.beginPath(); g.arc(0,0,r*0.42,0,7); g.stroke();
  if(pct>=1){ g.fillStyle=color; g.beginPath(); g.arc(0,0,r*0.22,0,7); g.fill(); }
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════
   FIGHTER
   ══════════════════════════════════════════════════════════════════ */
class Fighter{
  constructor(spec, x, dir, isPlayer){
    this.s = spec; this.x = x; this.dir = dir; this.isPlayer = isPlayer;
    this.hp = spec.hp; this.maxHp = spec.hp;
    this.atk = 0; this.grd = 0; this.sht = 0; // 0..1 ゲージ（攻・防・飛）
    this.state = "walk"; this.t = 0;         // 状態内経過秒
    this.hitDone = false; this.shotDone = false;
    this.poison = 0; this.poisonDps = 0;
    this.flash = 0; this.swing = 0; this.hurtLim = RULES.hurtTime;
    this.stunLim = RULES.parryStun;
    this.dmgScale = 1;                 // 敵のレベルで与ダメージが変わる
    this.special = null;               // 使用中のスペシャル武器
    this.wasReady = {atk:false, grd:false, sht:false};   // 満タンになった瞬間だけ鳴らす
  }
  get busy(){ return this.state!=="walk"; }
  get ready(){ return {a:this.atk>=1, g:this.grd>=1, s:this.sht>=1}; }

  tryAttack(){ if(this.state!=="walk"||this.atk<1) return false;
    this.atk=0; this.state="windup"; this.t=0; this.hitDone=false; SFX.swing(); return true; }
  tryGuard(){ if(this.state!=="walk"||this.grd<1) return false;
    this.grd=0; this.state="guard"; this.t=0; SFX.guard(); return true; }
  tryShot(){ if(this.state!=="walk"||this.sht<1) return false;
    this.sht=0; this.state="cast"; this.t=0; this.shotDone=false; return true; }
  // スペシャルはゲージを使わない。使い切りなので所持数が代わりの制約
  trySpecial(w){ if(this.state!=="walk"||!w) return false;
    this.special = w; this.t = 0; this.hitDone = false; this.shotDone = false;
    this.state = (w.kind==="melee") ? "spWind" : "spCast";
    SFX.special(w.id); return true; }

  update(dt, foe){
    this.t += dt; this.flash = Math.max(0, this.flash-dt*4);
    if(this.poison>0){ this.poison-=dt; this.hp = Math.max(0, this.hp - this.poisonDps*dt); }

    const S=this.s;
    if(this.state==="walk"){
      // ゲージは「歩いている間だけ」溜まる → 行動には常に機会費用がある
      this.atk = Math.min(1, this.atk + dt/S.atkGauge);
      this.grd = Math.min(1, this.grd + dt/S.guardGauge);
      this.sht = Math.min(1, this.sht + dt/S.shot.gauge);
      this.x += this.dir * S.speed * dt;
      if(this.x <= RULES.wallL){ this.x = RULES.wallL; this.dir = 1; }
      if(this.x >= RULES.wallR){ this.x = RULES.wallR; this.dir = -1; }
      this.swing = 0;
    }
    else if(this.state==="windup"){ this.swing = -(this.t/S.windup)*0.55;
      if(this.t>=S.windup){ this.state="active"; this.t=0; } }
    else if(this.state==="active"){ this.swing = 0.35 + (this.t/S.active)*0.65;
      if(this.t>=S.active){ this.state="recover"; this.t=0; } }
    else if(this.state==="recover"){ this.swing = 1.0 - (this.t/S.recover);
      if(this.t>=S.recover){ this.state="walk"; this.t=0; } }
    else if(this.state==="cast"){ this.swing = -0.35 - (this.t/S.shot.windup)*0.25;
      if(this.t>=S.shot.windup){                 // 撃つ
        if(!this.shotDone){ this.shotDone=true; shots.push(new Shot(this)); SFX.shot(S.shot.kind); }
        this.state="castRec"; this.t=0; } }
    else if(this.state==="castRec"){ this.swing = -0.6 + (this.t/S.shot.recover)*0.6;
      if(this.t>=S.shot.recover){ this.state="walk"; this.t=0; } }
    // スペシャル：大振り（melee）
    else if(this.state==="spWind"){ const w=this.special;
      this.swing = -(this.t/w.windup)*0.8;
      if(this.t>=w.windup){ this.state="spActive"; this.t=0; } }
    else if(this.state==="spActive"){ const w=this.special;
      this.swing = 0.4 + (this.t/w.active)*0.8;
      if(this.t>=w.active){ this.state="spRec"; this.t=0; } }
    // スペシャル：弾・落雷（cast）
    else if(this.state==="spCast"){ const w=this.special;
      this.swing = -0.45 - (this.t/w.windup)*0.3;
      if(this.t>=w.windup){
        if(!this.shotDone){ this.shotDone=true; fireSpecial(this, w); }
        this.state="spRec"; this.t=0; } }
    else if(this.state==="spRec"){ const w=this.special;
      this.swing = (this.swing||0)*0.86;
      if(this.t>=w.recover){ this.state="walk"; this.t=0; this.special=null; } }
    else if(this.state==="guard"){ this.swing = -0.15;
      if(this.t>=S.guardTime){ this.state="walk"; this.t=0; } }
    else if(this.state==="stun"||this.state==="hurt"){
      this.swing *= 0.9;
      const lim = this.state==="stun"? this.stunLim : this.hurtLim;
      if(this.t>=lim){ this.state="walk"; this.t=0; } }
  }
  facing(foe){ return Math.sign(foe.x - this.x) === this.dir; }
  takeHit(dmg){ this.hp = Math.max(0, this.hp - dmg); this.flash = 1; }
  hurt(dur){ this.state="hurt"; this.t=0; this.hurtLim=dur; }
  stun(dur){ this.state="stun"; this.t=0; this.stunLim=dur; this.special=null; }
}

/* ══════════════════════════════════════════════════════════════════
   飛び道具
   ------------------------------------------------------------------
   移動が自動なので弾は「避ける」ことができない。答えは防御だけ。
   通常ガードなら削りが通り、ジャスト防御なら完全に消える。
   ══════════════════════════════════════════════════════════════════ */
let shots = [];
class Shot{
  constructor(owner, spec){
    const S = spec || owner.s.shot;
    this.s = S; this.owner = owner; this.dir = owner.dir;
    this.x = owner.x + owner.dir*24;
    this.dy = RULES.muzzleY;            // 床からの高さ（上が負）。画面比が変わっても効く
    this.vx = owner.dir * S.speed;
    this.vy = S.kind==="lob" ? -S.up : 0;
    this.t = 0; this.dead = false;
  }
  update(dt){
    this.t += dt;
    if(this.s.kind==="lob"){ this.vy += RULES.gravity*dt; this.dy += this.vy*dt; }
    else if(this.s.kind==="wave"){ this.dy = RULES.muzzleY + Math.sin(this.t*this.s.freq)*this.s.amp; }
    else if(this.s.kind==="mist"){ this.vx *= Math.pow(0.30, dt); this.dy -= 5*dt; }
    this.x += this.vx*dt;
    if(this.t >= this.s.life) this.dead = true;
    if(this.x < RULES.wallL-16 || this.x > RULES.wallR+16) this.dead = true;
    if(this.dy > -3) this.dead = true;   // 山なり弾は地面で消える
  }
  hits(f){
    if(f===this.owner) return false;
    return Math.abs(this.x - f.x) < RULES.hitHalfW + this.s.r*0.5
        && this.dy > RULES.hitTop && this.dy < RULES.hitBot;
  }
}

/* ---------- スペシャルの発動処理 ---------- */
let bolts = [];      // 落雷の演出（見た目だけ。判定は発動時に済んでいる）
function fireSpecial(f, w){
  if(w.kind==="burst"){
    // 扇状に5発。上下にばらけるので全部ガードするのは難しい
    for(let i=0;i<w.n;i++){
      const sh = new Shot(f, w.shot);
      sh.dy = RULES.muzzleY - 16 + i*8;
      sh.vx = f.dir * (w.shot.speed * (0.82 + i*0.09));
      shots.push(sh);
    }
  } else if(w.kind==="single"){
    shots.push(new Shot(f, w.shot));
  } else if(w.kind==="strike"){
    // 距離に関係なく相手の真上から落ちる。ガードには完全に消される
    const foe = (f===P)? C : P;
    bolts.push({x:foe.x, t:0});
    if(foe.state==="guard"){ foe.grd = Math.min(1, foe.grd + RULES.shotParryRefund); SFX.block();
      say(`${w.name}をガード！ 完全に防いだ`); }
    else { foe.takeHit(w.dmg * f.dmgScale); foe.hurt(RULES.hurtTime); SFX.thunder();
      say(`${w.name} 直撃 ${Math.round(w.dmg*f.dmgScale)}`); }
  }
}

/* ══════════════════════════════════════════════════════════════════
   GAME
   ══════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const cv = $("stage"), g = cv.getContext("2d");
let P, C, timeLeft, running=false, last=0, logT=0, cpuTimer=0, cpuIntent=null;
let pick = 0, cpuPick = 1, lastSec = 0, selSlot = 0, resultShown = false;
let cpuProf = cpuProfile(SAVE.level);

function begin(){
  P = new Fighter(SPECIES[pick], RULES.wallL+80, 1, true);
  C = new Fighter(SPECIES[cpuPick], RULES.wallR-80, -1, false);
  cpuProf = cpuProfile(SAVE.level);
  C.dmgScale = cpuProf.dmg;
  C.maxHp = Math.round(C.maxHp * cpuProf.hp); C.hp = C.maxHp;
  shots = []; bolts = []; selSlot = 0; resultShown = false;
  timeLeft = RULES.roundTime; running = true; logT=0; cpuTimer=0; cpuIntent=null;
  $("nmL").innerHTML = P.s.name + '<em>YOU</em>';
  $("nmR").innerHTML = `<em>Lv.${SAVE.level}</em>` + C.s.name;
  renderBag();
  show("scFight"); fitStage(); say("交錯を待て");
  lastSec = RULES.roundTime; BGM.setMode("fight"); BGM.start();
  last = performance.now(); requestAnimationFrame(loop);
}

function loop(now){
  if(!running) return;
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  step(dt); render(); requestAnimationFrame(loop);
}

function step(dt){
  timeLeft -= dt;
  logT = Math.max(0, logT-dt);
  cpuThink(dt);

  P.update(dt, C); C.update(dt, P);

  // ゲージが満タンになった瞬間だけ合図を鳴らす（3本を音の高さで区別）
  ["atk","grd","sht"].forEach(k=>{
    const full = P[k]>=1;
    if(full && !P.wasReady[k]) SFX.ready(k);
    P.wasReady[k] = full;
  });
  // 残り5秒の秒読み。BGMも締めに入る
  const sec = Math.ceil(timeLeft);
  if(sec!==lastSec){ if(sec<=5 && sec>0) SFX.tick(); lastSec = sec; }
  if(timeLeft<=15 && BGM.mode==="fight") BGM.setMode("tense");

  // ── 衝突：歩行中の者は互いに反転
  const d = Math.abs(P.x - C.x);
  if(d < RULES.bodyGap){
    const s = Math.sign(P.x - C.x) || 1;
    if(P.state==="walk") P.dir = s;
    if(C.state==="walk") C.dir = -s;
    P.x += s*1.6; C.x -= s*1.6;
  }

  // ── 判定
  resolve(P, C); resolve(C, P);
  stepShots(dt);

  // ── 決着
  if(P.hp<=0 || C.hp<=0 || timeLeft<=0) finish();
}

/* ---------- 飛び道具の進行と当たり ---------- */
function stepShots(dt){
  for(const sh of shots){
    sh.update(dt);
    if(sh.dead) continue;
    for(const f of [P,C]){ if(sh.hits(f)){ hitByShot(sh, f); break; } }
  }
  // 弾同士の相殺（撃ち合いに意味を持たせる）
  for(let i=0;i<shots.length;i++) for(let j=i+1;j<shots.length;j++){
    const a=shots[i], b=shots[j];
    if(a.dead||b.dead||a.owner===b.owner) continue;
    if(Math.abs(a.x-b.x) < a.s.r+b.s.r && Math.abs(a.dy-b.dy) < a.s.r+b.s.r){
      a.dead=b.dead=true; SFX.cancel(); say("弾が相殺");
    }
  }
  shots = shots.filter(s=>!s.dead);
  for(const b of bolts) b.t += dt;
  bolts = bolts.filter(b=>b.t < 0.35);
}

function hitByShot(sh, f){
  sh.dead = true;
  const S = sh.s;
  if(f.state==="guard"){
    // 受け切ると防御ゲージが一部戻る＝弾の連射だけでは防御を枯らせない
    if(f.t <= f.s.parryWindow){
      f.flash=.6; f.grd = Math.min(1, f.grd + RULES.shotParryRefund);
      SFX.parry(); say(`ジャスト防御！ ${S.name}を消した`); return; }
    const chip = Math.min(S.dmg*RULES.blockChip, RULES.chipCap);
    f.takeHit(chip); f.grd = Math.min(1, f.grd + RULES.shotBlockRefund);
    SFX.block(); say(`${S.name}をガード ${chip.toFixed(1)} 削り`);
    return;
  }
  const dmg = S.dmg * sh.owner.dmgScale;
  f.takeHit(dmg); SFX.hit(dmg);
  f.x = clampX(f.x + Math.sign(sh.vx||sh.dir)*RULES.shotKnock);
  if(S.bind){ f.stun(S.bind); say(`${S.name} 命中！ ${S.bind}秒 動きを止めた`); }
  else f.hurt(RULES.shotHurt);
  if(S.poison){ f.poison = S.poison.dur; f.poisonDps = S.poison.dps;
    if(!S.bind) say(`${S.name} 命中 ${Math.round(dmg)} + 毒`); }
  else if(!S.bind) say(`${S.name} 命中 ${Math.round(dmg)}`);
}

function resolve(a, b){
  // 通常の斬りとスペシャルの大振りは、間合とダメージが違うだけで扱いは同じ
  const sp = (a.state==="spActive") ? a.special : null;
  if(a.state!=="active" && !sp) return;
  if(a.hitDone) return;
  const reach = sp ? sp.reach : a.s.reach;
  const dmg   = (sp ? sp.dmg : a.s.dmg) * a.dmgScale;
  const label = sp ? sp.name : a.s.skill;

  const dist = Math.abs(a.x-b.x);
  if(dist > reach || !a.facing(b)) return;
  a.hitDone = true;
  const kb = Math.sign(b.x-a.x)*RULES.knockback;

  if(b.state==="guard"){
    if(b.t <= b.s.parryWindow){                     // ジャスト防御
      a.stun(RULES.parryStun); a.swing=0;
      SFX.parry();
      if(b.s.reflect){ a.takeHit(b.s.reflect); say(`${b.s.name} 舞い返し！ ${b.s.reflect}反射`); }
      else if(b.s.parryRefund){ b.atk = 1; say(`${b.s.name} 香気斬り！ 攻撃ゲージ全快`); }
      else say(`ジャスト防御！ ${a.s.name} 硬直`);
      b.flash = .6;
    } else {                                        // 通常ガード（削りは通る）
      // スペシャルは削りが重い（大傘断ちは半分通る）
      const chip = sp ? Math.min(dmg*sp.chip, 14)
                      : Math.min(dmg*RULES.blockChip, RULES.chipCap);
      b.takeHit(chip); b.x = clampX(b.x+kb*0.5); SFX.block();
      say(`${label}をガード ${chip.toFixed(1)} 削り`);
    }
    return;
  }
  b.takeHit(dmg); b.hurt(RULES.hurtTime); b.x = clampX(b.x+kb*(sp?1.6:1)); SFX.hit(dmg);
  if(!sp && a.s.poison){ b.poison = a.s.poison.dur; b.poisonDps = a.s.poison.dps;
    say(`${label} 命中 ${Math.round(dmg)} + 猛毒`); }
  else say(`${label} 命中 ${Math.round(dmg)}`);
}
const clampX = x => Math.max(RULES.wallL, Math.min(RULES.wallR, x));
function say(t){ $("log").textContent = t; logT = 1.6; }

/* ---------- CPU ---------- */
function cpuThink(dt){
  cpuTimer -= dt;
  if(C.state!=="walk") return;
  if(cpuTimer>0) return;
  cpuTimer = cpuProf.react*(0.7+Math.random()*0.6);

  const dist = Math.abs(P.x-C.x);
  const closing = C.facing(P);

  // 飛んでくる弾は防御でしか止められない
  if(C.grd>=1){
    let best = null;
    for(const sh of shots){
      if(sh.owner===C) continue;
      if(Math.sign(sh.vx || sh.dir) !== Math.sign(C.x - sh.x)) continue;  // 近づいてくる弾だけ
      const tta = (Math.abs(sh.x-C.x) - RULES.hitHalfW) / Math.max(40, Math.abs(sh.vx));
      if(tta>=0 && (best===null || tta<best)) best = tta;
    }
    if(best!==null && best < Math.min(0.34, C.s.guardTime*0.55) && Math.random()<cpuProf.pGuard){ C.tryGuard(); return; }
  }
  // 相手の振りかぶりを見てから防御
  if(P.state==="windup" && C.grd>=1 && dist < P.s.reach+60){
    const remain = P.s.windup - P.t;
    if(remain < C.s.parryWindow*0.9 + 0.06 && Math.random() < cpuProf.guard){ C.tryGuard(); return; }
  }
  // 飛び道具は間合いの外から。山なり弾だけは近距離で頭上を越えるので撃たない
  if(C.sht>=1 && closing){
    const k = C.s.shot.kind;
    const ok = k==="lob" ? (dist>150 && dist<300) : dist > C.s.reach*0.95;
    const keepMelee = C.atk>=1 && dist < C.s.reach*1.7;   // 斬れる間合いなら撃たない
    if(ok && !keepMelee && Math.random()<cpuProf.shot){ C.tryShot(); return; }
  }
  // 間合いに入る時刻を予測して振る
  if(C.atk>=1 && closing){
    const rel = P.state==="walk" && !P.facing(C) ? C.s.speed - P.s.speed : C.s.speed + P.s.speed;
    const tta = (dist - C.s.reach*0.82) / Math.max(20, rel);
    if(tta <= C.s.windup + 0.05 && tta > -0.10) C.tryAttack();
  }
}

/* ---------- 画面いっぱいに合わせる ---------- */
/* 横幅（＝壁の間隔）は 480 で固定。バランスに直結するので画面で変えない。
   代わりに高さだけ画面比に合わせて伸ばし、余白を作らず全面を使う。 */
const view = {scale:1, ox:0, oy:0};
function fitStage(){
  const box = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const cssW = Math.max(240, box.width), cssH = Math.max(120, box.height);
  RULES.arenaH = Math.max(180, Math.min(460, Math.round(RULES.arenaW*cssH/cssW)));
  RULES.floorY = RULES.arenaH - 38;
  cv.style.width = cssW+"px"; cv.style.height = cssH+"px";
  cv.width  = Math.round(cssW*dpr);
  cv.height = Math.round(cssH*dpr);
  view.scale = cv.width/RULES.arenaW;
  view.ox = 0;
  view.oy = (cv.height - RULES.arenaH*view.scale)/2;
}
addEventListener("resize", ()=>{ if(!$("scFight").classList.contains("hide")){ fitStage(); if(P) render(); } });

/* ---------- 描画 ---------- */
function render(){
  const W=RULES.arenaW, H=RULES.arenaH, F=RULES.floorY;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle="#211E29"; g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(view.scale,0,0,view.scale,view.ox,view.oy);
  g.fillStyle="#282433"; g.fillRect(0,0,W,H);

  // 背景：胞子紋の同心円。画面が縦に伸びた分だけ輪も増やして空白を埋める
  g.save(); g.globalAlpha=.30; g.strokeStyle="#332E40"; g.lineWidth=1;
  const rMax = Math.max(300, H*1.4);
  for(let r=30;r<rMax;r+=24){ g.beginPath(); g.arc(W/2,F,r,Math.PI,0); g.stroke(); }
  g.restore();

  // 床
  g.strokeStyle="#4A4356"; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,F+.5); g.lineTo(W,F+.5); g.stroke();
  g.fillStyle="#211E29"; g.fillRect(0,F+1,W,H-F);
  // 壁の目盛
  g.strokeStyle="#3A3547";
  [RULES.wallL,RULES.wallR].forEach(x=>{ g.beginPath(); g.moveTo(x,F-74); g.lineTo(x,F); g.stroke(); });

  // 間合いリング（プレイヤーが振れる距離）
  if(P.ready.a && P.state==="walk"){
    g.save(); g.globalAlpha=.22; g.strokeStyle="#B06A3B"; g.setLineDash([3,5]); g.lineWidth=1;
    g.beginPath(); g.moveTo(P.x+P.dir*P.s.reach, F-58); g.lineTo(P.x+P.dir*P.s.reach, F); g.stroke();
    g.restore();
  }

  [C,P].forEach(f=>{
    if(f.flash>0){ g.save(); g.globalAlpha=Math.min(.40,f.flash*.5);
      g.fillStyle="#D08A92"; g.beginPath(); g.arc(f.x,F-34,30,0,7); g.fill(); g.restore(); }
    if(f.state==="guard"){
      const just = f.t<=f.s.parryWindow;
      g.save(); g.strokeStyle= just? "#EDE4CC":"#7C8F4E";
      g.lineWidth= just?2.5:1.5; g.globalAlpha= just?.95:.6;
      g.beginPath(); g.arc(f.x, F-30, 32, f.dir>0? -1.4:1.75, f.dir>0? 1.4:4.55); g.stroke(); g.restore();
    }
    if(f.state==="stun"){ g.fillStyle="#D08A92"; g.font="600 13px "+getComputedStyle(document.body).fontFamily;
      g.textAlign="center"; g.fillText("★", f.x, F-78); }
    if(f.poison>0){ g.save(); g.globalAlpha=.5; g.fillStyle="#7C8F4E";
      for(let i=0;i<3;i++){ const p=(performance.now()/700+i/3)%1;
        g.beginPath(); g.arc(f.x-8+i*8, F-16-p*54, 2.2, 0, 7); g.fill(); } g.restore(); }
    drawMushroom(g, f.s, f.x, F, 1, f.dir, {
      swing:f.swing, ko:f.hp<=0,
      shout:f.state==="windup"||f.state==="active"||f.state==="hurt"||f.state==="cast",
    });
    // 溜め中の胞子玉
    if(f.state==="cast"){
      const p = Math.min(1, f.t/f.s.shot.windup);
      g.save(); g.globalAlpha=.4+p*.6; g.fillStyle=f.s.art.body;
      g.beginPath(); g.arc(f.x+f.dir*26, F+RULES.muzzleY, 2+p*f.s.shot.r, 0, 7); g.fill();
      g.restore();
    }
    // スペシャルの溜め（武器色の輪が締まる）
    if(f.state==="spCast" || f.state==="spWind"){
      const w=f.special, p=Math.min(1, f.t/w.windup);
      g.save(); g.globalAlpha=.25+p*.6; g.strokeStyle=w.color; g.lineWidth=2;
      g.beginPath(); g.arc(f.x, F-34, 46-p*24, 0, 7); g.stroke(); g.restore();
    }
    // 大傘断ちの薙ぎ
    if(f.state==="spActive" && f.special && f.special.kind==="melee"){
      const w=f.special, p=f.t/w.active;
      g.save(); g.globalAlpha=.7*(1-p); g.strokeStyle=w.color; g.lineWidth=9; g.lineCap="round";
      g.beginPath(); g.arc(f.x, F-34, w.reach*0.55, f.dir>0? -1.5+p*1.9 : 1.6-p*1.9,
                                                      f.dir>0? -0.9+p*1.9 : 2.2-p*1.9); g.stroke();
      g.restore();
    }
  });

  shots.forEach(sh=>drawShot(g, sh));
  bolts.forEach(b=>{                       // 落雷菌：上から落ちる柱
    const p = b.t/0.35;
    g.save(); g.globalAlpha = Math.max(0, 1-p); g.strokeStyle="#BCA9EC"; g.lineWidth=7-p*5;
    g.beginPath(); g.moveTo(b.x, 0); g.lineTo(b.x+6, F*0.45); g.lineTo(b.x-4, F*0.7); g.lineTo(b.x, F-8);
    g.stroke();
    g.globalAlpha = Math.max(0,.5-p*.5); g.fillStyle="#EDE4CC";
    g.beginPath(); g.arc(b.x, F-20, 26*(1-p)+6, 0, 7); g.fill(); g.restore();
  });

  // ラベル
  g.font="500 9px ui-monospace,monospace"; g.textAlign="center";
  g.fillStyle="#6E6880"; g.fillText("YOU", P.x, RULES.floorY+15);

  // HUD
  $("hpL").style.width = (P.hp/P.maxHp*100)+"%";
  $("hpR").style.width = (C.hp/C.maxHp*100)+"%";
  $("clock").textContent = Math.max(0,Math.ceil(timeLeft));
  $("clock").classList.toggle("low", timeLeft<=15);
  if(logT<=0) $("log").innerHTML="&nbsp;";
  paintPad("padA", P.atk, "#B06A3B");
  paintPad("padG", P.grd, "#7C8F4E");
  paintPad("padS", P.sht, "#C6A24A");
}

/* ---------- 弾の描画：種ごとに軌道が違うので見た目も変える ---------- */
function drawShot(g, sh){
  const S=sh.s, col=sh.owner.s.art.body, k=S.kind;
  g.save(); g.translate(sh.x, RULES.floorY + sh.dy);
  if(k==="mist"){                       // ふくらむ毒の雲
    const p = sh.t/S.life;
    g.globalAlpha=.30*(1-p*0.5); g.fillStyle="#7C8F4E";
    for(let i=0;i<4;i++){ const a=i*1.9+sh.t*1.2;
      g.beginPath(); g.arc(Math.cos(a)*S.r*.5, Math.sin(a)*S.r*.4, S.r*(.7+p*.5), 0, 7); g.fill(); }
    g.globalAlpha=.85; g.fillStyle=col;
    g.beginPath(); g.arc(0,0,S.r*.42,0,7); g.fill();
  } else {
    // 尾（速いものほど長い）
    g.globalAlpha=.32; g.strokeStyle=col; g.lineWidth=S.r*0.9; g.lineCap="round";
    g.beginPath(); g.moveTo(0,0); g.lineTo(-sh.dir*S.speed*0.035, 0); g.stroke();
    g.globalAlpha=1;
    g.fillStyle=col; g.beginPath();
    if(k==="dart"){ g.ellipse(0,0,S.r*1.7,S.r*0.62,0,0,7); }
    else { g.arc(0,0,S.r,0,7); }
    g.fill();
    g.strokeStyle=ART.line; g.lineWidth=1.6; g.stroke();
    // 胞子紋のヒダ
    g.strokeStyle="rgba(30,27,36,.45)"; g.lineWidth=1;
    for(let i=0;i<5;i++){ const a=i/5*Math.PI*2 + sh.t*4;
      g.beginPath(); g.moveTo(Math.cos(a)*S.r*.3, Math.sin(a)*S.r*.3);
      g.lineTo(Math.cos(a)*S.r*.85, Math.sin(a)*S.r*.85); g.stroke(); }
  }
  g.restore();
}
/* ---------- 手持ちと特殊ボタン ---------- */
function renderBag(){
  const el = $("bag"); el.innerHTML = "";
  for(let i=0;i<BAG_MAX;i++){
    const w = wep(SAVE.bag[i]);
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = w? w.mark : "・";
    b.className = (w? "has ":"") + (i===selSlot && w? "sel":"");
    b.style.setProperty("--w", w? w.color : "var(--dim)");
    b.title = w? `${w.name} — ${w.desc}` : "空き";
    b.disabled = !w;
    b.onclick = ()=>{ selSlot = i; renderBag(); };
    el.appendChild(b);
  }
  const w = wep(SAVE.bag[selSlot]) || wep(SAVE.bag.find(x=>x));
  $("wmark").textContent = w? w.mark : "―";
  $("wmark").style.setProperty("--w", w? w.color : "var(--dim)");
  $("padW").disabled = !w;
  $("padW").title = w? `${w.name} — ${w.desc}` : "スペシャル武器なし（勝利のガチャで手に入る）";
}
function currentWeapon(){
  if(wep(SAVE.bag[selSlot])) return {w:wep(SAVE.bag[selSlot]), i:selSlot};
  const i = SAVE.bag.findIndex(x=>wep(x));
  return i>=0 ? {w:wep(SAVE.bag[i]), i} : null;
}
function special(){
  if(!running) return;
  const cur = currentWeapon();
  if(!cur){ say("スペシャル武器がない"); return; }
  if(P.state!=="walk"){ return; }
  if(P.trySpecial(cur.w)){
    SAVE.bag.splice(cur.i,1); SAVE.save();          // 1回使うと消える
    selSlot = Math.min(selSlot, Math.max(0, SAVE.bag.length-1));
    renderBag(); say(`${cur.w.name}！`);
  }
}

function paintPad(id, pct, col){
  const el=$(id), c=el.querySelector("canvas"), x=c.getContext("2d");
  x.clearRect(0,0,84,84); drawSporeGauge(x,42,42,30,pct,col,"#3A3547");
  el.classList.toggle("ready", pct>=1);
}
function shot(){ if(running && !P.tryShot() && P.state==="walk") say("ゲージ不足"); }

/* ---------- 決着 ---------- */
function finish(){
  if(!running) return;
  running=false;
  // 撃沈の姿勢を1フレーム描いてから結果へ（時間切れは待たせない）
  const ko = P.hp<=0 || C.hp<=0;
  BGM.setMode("menu");
  if(ko) SFX.ko();
  render();
  setTimeout(showResult, ko? 1100 : 260);
}
function showResult(){
  if(resultShown) return;      // レベルとガチャは1試合につき1回だけ
  resultShown = true;
  const pr=P.hp/P.maxHp, cr=C.hp/C.maxHp;
  const win = C.hp<=0 && P.hp>0 ? 1 : P.hp<=0 && C.hp>0 ? -1 : (pr>cr?1:pr<cr?-1:0);
  $("resultText").textContent = win>0? "勝　利" : win<0? "敗　北" : "引　分";
  $("resultText").style.color = win>0? "var(--cream)" : win<0? "var(--pink)" : "var(--dim)";
  if(win>0) SFX.win(); else if(win<0) SFX.lose();

  let sub = `${P.s.name} ${Math.round(P.hp)}/${P.maxHp}  ―  Lv.${SAVE.level} ${C.s.name} ${Math.round(C.hp)}/${C.maxHp}`
          + (timeLeft<=0 ? "  (時間切れ判定)" : "");
  if(win>0){                       // 勝ったら敵が1つ強くなる＋ガチャ
    SAVE.level = Math.min(99, SAVE.level+1); SAVE.save();
    sub += `  →  次は Lv.${SAVE.level}`;
    gachaReady();
  } else {
    $("gachaBox").classList.add("hide");
  }
  $("resultSub").textContent = sub;
  show("scEnd");
}

/* ---------- ガチャ ---------- */
let gachaSpinning = false;
function gachaReady(){
  const box = $("gachaBox");
  box.classList.remove("hide");
  $("gslot").textContent = "?";
  $("gslot").style.color = "var(--dim)";
  $("gname").textContent = SAVE.bag.length>=BAG_MAX ? "手持ちが満杯（5個）" : "\u00a0";
  $("gdesc").textContent = SAVE.bag.length>=BAG_MAX
    ? "1つ使ってから回すと受け取れる。回すこと自体はできる。" : "\u00a0";
  $("gachaBtn").disabled = false;
  $("gachaBtn").textContent = "ガチャを回す";
}
function spinGacha(){
  if(gachaSpinning) return;
  gachaSpinning = true;
  $("gachaBtn").disabled = true;
  const result = rollGacha();
  const marks = WEAPONS.map(w=>w.mark).concat(["・"]);
  let n = 0;
  const iv = setInterval(()=>{
    n++;
    $("gslot").textContent = marks[n % marks.length];
    $("gslot").style.color = "var(--cream)";
    SFX.gachaTick();
    if(n >= 16){
      clearInterval(iv);
      gachaSpinning = false;
      $("gachaBtn").textContent = "もう一度回すには勝つこと";
      if(!result){
        $("gslot").textContent = "×"; $("gslot").style.color = "var(--dim)";
        $("gname").textContent = "はずれ";
        $("gdesc").textContent = "また勝てば引ける。";
        SFX.gachaMiss();
      } else if(SAVE.bag.length >= BAG_MAX){
        $("gslot").textContent = result.mark; $("gslot").style.color = result.color;
        $("gname").textContent = `${result.name} … 手持ちが満杯で受け取れない`;
        $("gdesc").textContent = "5個持てる上限。1つ使ってから勝つと入る。";
        SFX.gachaMiss();
      } else {
        SAVE.bag.push(result.id); SAVE.save();
        $("gslot").textContent = result.mark; $("gslot").style.color = result.color;
        $("gname").textContent = `${result.name}（${result.role}）を獲得！`;
        $("gdesc").textContent = result.desc;
        SFX.gachaHit();
      }
      renderBag(); renderStatus();
    }
  }, 70);
}

/* ---------- 選択画面の状態表示 ---------- */
function renderStatus(){
  const slots = Array.from({length:BAG_MAX}, (_,i)=>{
    const w = wep(SAVE.bag[i]);
    return w? `<span class="slot" style="color:${w.color}" title="${w.name}">${w.mark}</span>`
            : `<span class="slot">・</span>`;
  }).join("");
  $("status").innerHTML =
    `敵のレベル <b>${SAVE.level}</b>　勝つと上がる` +
    `<span style="margin-left:6px">スペシャル ${slots} ${SAVE.bag.length}/${BAG_MAX}</span>` +
    `<button class="reset" id="resetBtn">記録を消す</button>`;
  $("resetBtn").onclick = ()=>{
    if(confirm("敵のレベルと手持ちの武器を消して、Lv.1 から始め直しますか？")){
      SAVE.reset(); selSlot=0; cpuProf = cpuProfile(SAVE.level); renderStatus(); renderBag();
    }
  };
}

/* ══════════════════════════════════════════════════════════════════
   SELECT UI
   ══════════════════════════════════════════════════════════════════ */
function buildRoster(){
  const max = {speed:165, hp:132, dmg:23};
  // ゲージは「短いほど満タン表示」。3本並べて型が一目で分かるようにする
  const gaugeBar = (label, v, lo, hi) =>
    bar(label, 1-(v-lo)/(hi-lo), v.toFixed(1)+"s");
  $("roster").innerHTML = "";
  SPECIES.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="card"; el.tabIndex=0; el.setAttribute("role","option");
    el.setAttribute("aria-selected", i===pick);
    el.style.setProperty("--accent", s.accent);
    el.innerHTML = `
      <canvas width="128" height="128"></canvas>
      <div>
        <div class="nm">${s.name}<span class="rl">${s.role}</span></div>
        <div class="sk">技: ${s.skill} — ${s.note}</div>
        <div class="sk">飛: ${s.shot.name}（${s.shot.dmg}） — ${s.shot.note}</div>
        <div class="bars">
          ${bar("速度", s.speed/max.speed)}
          ${bar("体力", s.hp/max.hp)}
          ${bar("攻撃", s.dmg/max.dmg)}
          ${gaugeBar("攻ゲージ", s.atkGauge, 1.1, 3.2)}
          ${gaugeBar("防ゲージ", s.guardGauge, 0.9, 2.0)}
          ${gaugeBar("飛ゲージ", s.shot.gauge, 2.2, 3.3)}
        </div>
      </div>`;
    const cx = el.querySelector("canvas").getContext("2d");
    cx.scale(2,2); drawMushroom(cx, s, 29, 60, 0.75, 1, {swing:0.15});
    el.onclick = ()=>{ pick=i; refreshSel(); };
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick=i; refreshSel(); } };
    $("roster").appendChild(el);
  });
}
const bar = (label, v, txt) =>
  `<div class="bar">${txt?label+" "+txt:label}<i style="--w:${Math.max(6,Math.min(100,v*100))}%"></i></div>`;
function refreshSel(){
  [...$("roster").children].forEach((el,i)=> el.setAttribute("aria-selected", i===pick));
}
function show(id){ ["scSelect","scFight","scEnd"].forEach(s=> $(s).classList.toggle("hide", s!==id)); }

/* ---------- 入力 ---------- */
function attack(){ if(running && !P.tryAttack() && P.state==="walk") say("ゲージ不足"); }
function guard(){ if(running && !P.tryGuard() && P.state==="walk") say("ゲージ不足"); }
["pointerdown"].forEach(ev=>{
  $("padA").addEventListener(ev, e=>{ e.preventDefault(); attack(); });
  $("padG").addEventListener(ev, e=>{ e.preventDefault(); guard(); });
  $("padS").addEventListener(ev, e=>{ e.preventDefault(); shot(); });
  $("padW").addEventListener(ev, e=>{ e.preventDefault(); special(); });
});
addEventListener("keydown", e=>{
  if(e.repeat) return;
  if(e.key==="f"||e.key==="F"||e.key==="ArrowLeft"){ e.preventDefault(); attack(); }
  if(e.key==="j"||e.key==="J"||e.key==="ArrowRight"){ e.preventDefault(); guard(); }
  if(e.key==="k"||e.key==="K"||e.key==="ArrowUp"||e.key===" "){ e.preventDefault(); shot(); }
  if(e.key==="l"||e.key==="L"||e.key==="ArrowDown"){ e.preventDefault(); special(); }
});
$("sndBtn").onclick = ()=>{     // 消音は取り消し線で示す（.snd[aria-pressed="false"]）
  SND.setOn(!SND.on);
  $("sndBtn").setAttribute("aria-pressed", SND.on);
};
$("sndBtn").setAttribute("aria-pressed", SND.on);
$("startBtn").onclick = ()=>{ cpuPick = (pick + 1 + Math.floor(Math.random()*4)) % 5; begin(); };
$("againBtn").onclick = ()=>{ cpuPick = (pick + 1 + Math.floor(Math.random()*4)) % 5; begin(); };
$("backBtn").onclick  = ()=>{ BGM.setMode("menu"); renderStatus(); show("scSelect"); };

buildRoster();
renderStatus();
renderBag();
$("gachaBtn").onclick = spinGacha;
</script>
